<style>
:root {
  --bg: #f8f6f3;
  --paper: #fffdfb;
  --ink: #1b1918;
  --muted: #706b66;
  --line: #e5dfd9;
  --accent: #7b1119;
  --accent-2: #a61d29;
  --accent-soft: #f5e8e8;
  --shadow: 0 14px 40px rgba(38, 24, 20, .08);
  --sidebar: 300px;
}

[data-theme="dark"] {
  --bg: #171514;
  --paper: #211e1c;
  --ink: #f3eee9;
  --muted: #a9a09a;
  --line: #3a3430;
  --accent: #dd5964;
  --accent-2: #f27680;
  --accent-soft: #352528;
  --shadow: 0 14px 40px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: Cairo, system-ui, sans-serif;
  line-height: 1.9;
}
button, input { font: inherit; }
a { color: inherit; }

.app-shell { min-height: 100vh; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 28px;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: max-content; }
.brand-mark {
  display: grid; place-items: center;
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--accent); color: #fff; font-weight: 800; letter-spacing: .04em;
}
.brand-copy { display: grid; line-height: 1.15; }
.brand-copy strong { font-size: .78rem; letter-spacing: .06em; }
.brand-copy small { margin-top: 5px; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: .68rem; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.search-wrap {
  display: flex; align-items: center; gap: 8px;
  width: min(430px, 42vw); height: 42px; padding: 0 11px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
}
.search-wrap input { border: 0; outline: 0; background: transparent; color: var(--ink); width: 100%; }
.search-wrap kbd { color: var(--muted); font-size: .65rem; white-space: nowrap; }
.icon-btn {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.mobile-menu { display: none; }

.layout { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
.sidebar {
  position: sticky; top: 72px; height: calc(100vh - 72px);
  border-left: 1px solid var(--line); background: var(--paper);
  overflow: auto;
}
.sidebar-inner { padding: 26px 18px; }
.sidebar-title { font-size: .8rem; font-weight: 800; color: var(--muted); margin-bottom: 14px; }
#toc { display: grid; gap: 4px; }
.toc-link {
  display: block; padding: 8px 10px; border-radius: 10px; text-decoration: none;
  color: var(--muted); font-size: .82rem; line-height: 1.5;
}
.toc-link:hover, .toc-link.active { background: var(--accent-soft); color: var(--accent); }
.toc-link.toc-h1 { font-weight: 800; margin-top: 8px; color: var(--ink); }
.toc-link.toc-h2 { padding-right: 22px; }
.sidebar-footer {
  margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; color: var(--muted); font-size: .72rem;
}
.sidebar-footer span:first-child { color: var(--accent); font-weight: 800; }

.main { min-width: 0; }
.reading-bar { position: fixed; top: 72px; right: 0; left: 0; height: 3px; z-index: 60; background: transparent; }
.reading-bar span { display: block; height: 100%; width: 0; background: var(--accent); }
.prose {
  width: min(980px, calc(100% - 48px));
  margin: 0 auto; padding: 70px 0 100px;
}
.loading { padding: 50px; text-align: center; color: var(--muted); }

.prose h1, .prose h2, .prose h3, .prose h4 { scroll-margin-top: 100px; line-height: 1.35; }
.prose h1 { font-size: clamp(2rem, 4vw, 3.8rem); margin: 0 0 20px; letter-spacing: -.03em; }
.prose h2 { font-size: clamp(1.5rem, 3vw, 2.35rem); margin-top: 72px; padding-top: 26px; border-top: 1px solid var(--line); }
.prose h3 { font-size: 1.22rem; margin-top: 40px; }
.prose h4 { font-size: 1rem; margin-top: 28px; }
.prose p { font-size: 1rem; color: var(--ink); }
.prose strong { color: var(--accent); }
.prose blockquote {
  margin: 26px 0; padding: 18px 22px; border-right: 4px solid var(--accent);
  background: var(--accent-soft); border-radius: 12px; font-weight: 700;
}
.prose table { width: 100%; border-collapse: collapse; margin: 24px 0 32px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; display: block; overflow-x: auto; }
.prose th, .prose td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: right; min-width: 140px; }
.prose th { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
.prose code { font-family: "IBM Plex Mono", monospace; background: var(--accent-soft); padding: .12em .4em; border-radius: 6px; }
.prose pre { direction: ltr; text-align: left; overflow: auto; background: #171514; color: #f3eee9; padding: 20px; border-radius: 14px; }
.prose img { max-width: 100%; border-radius: 14px; }
.prose a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.prose ul, .prose ol { padding-right: 24px; }
.prose li { margin: 5px 0; }

.prose > p:first-of-type {
  font-size: 1.18rem; color: var(--muted); max-width: 780px; margin-bottom: 48px;
}
.prose h2:first-of-type { margin-top: 24px; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 48px 0; }

.callout {
  background: linear-gradient(135deg, var(--accent-soft), transparent 70%);
  border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin: 30px 0;
}

.site-footer { border-top: 1px solid var(--line); padding: 22px 0 40px; display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; }
.text-btn { border: 0; background: transparent; color: var(--accent); cursor: pointer; }

.search-panel { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.45); display: none; padding: 90px 24px 24px; }
.search-panel.open { display: block; }
.search-panel-inner { width: min(760px, 100%); margin: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); max-height: 78vh; overflow: auto; }
.search-panel-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--paper); border-bottom: 1px solid var(--line); }
.search-result { padding: 16px 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
.search-result:hover { background: var(--accent-soft); }
.search-result h3 { margin: 0 0 4px; font-size: 1rem; }
.search-result p { margin: 0; color: var(--muted); font-size: .82rem; }
.search-result mark { background: #f3c86a; }

@media (max-width: 900px) {
  :root { --sidebar: 0px; }
  .topbar { padding: 0 14px; }
  .mobile-menu { display: block; }
  .search-wrap { width: min(360px, 52vw); }
  .sidebar { position: fixed; right: 0; top: 72px; width: min(330px, 86vw); z-index: 40; transform: translateX(105%); transition: transform .22s ease; box-shadow: var(--shadow); }
  .sidebar.open { transform: translateX(0); }
  .layout { display: block; }
  .prose { width: min(100% - 30px, 760px); padding-top: 44px; }
}

@media (max-width: 620px) {
  .brand-copy { display: none; }
  .search-wrap kbd { display: none; }
  .search-wrap { width: 42vw; }
  .prose { width: calc(100% - 24px); }
  .prose h2 { margin-top: 52px; }
  .site-footer { flex-direction: column; gap: 12px; }
}

</style>

<script>
const EMBEDDED_CONTENT = 'GAFI · ALEXANDRIA FREE ZONE · TRAINING FILE\n\n# ملف تدريب المنطقة الحرة\n\nدليل تدريب المنطقة الحرة بالإسكندرية، مش مجرد تجميع إجراءات وقوانين. الفكرة هنا إنك تمشي مع المشروع كأنه قدامك: يبدأ كفكرة على مكتب المستثمر، يدخل على الإدارات واحدة واحدة، يبدأ يستورد ويصنّع ويصدّر، وبعدها تتابعه الهيئة طوال عمره لحد ما ينجح أو يتوسع أو حتى يخرج من السوق بالتصفية.\n\nلو قابلت مصطلح مش فاهمه أثناء القراءة، في\xa0[مسرد مصطلحات كامل](https://heshvm101.github.io/GAFI/#table-glossary)\xa0في آخر الملف ترجعله في أي وقت.\n\n**55K**فرصة عمل مباشرة في المنطقة الحرة بالإسكندرية\n\n**$14.7B**إجمالي استثمارات المنطقة الحرة بالإسكندرية\n\n**$5.3B**صادرات المنطقة الحرة بالإسكندرية في 2025\n\n**#1**الأعلى صادرات بين كل المناطق الحرة في مصر\n\nالأرقام من تقرير وزارة الاستثمار والتجارة الخارجية عن أداء المنطقة الحرة العامة بالإسكندرية (العامرية)، يونيو 2026.\n\nالهيئة العامة للاستثمار والمناطق الحرة\n\nملف\nتدريبALEX · 2026\n\nGAFI · ALEX 2026\n\n01 · الأساس\n\n- [الهيئة العامة للاستثمار](https://heshvm101.github.io/GAFI/#basics-gafi)\n- [يعني إيه منطقة حرة؟](https://heshvm101.github.io/GAFI/#basics-what-is-it)\n- [خلاصة سريعة: أسئلة](https://heshvm101.github.io/GAFI/#basics-review-qa)\n\n02 · الإدارات\n\n- [رحلة المستثمر الكاملة](https://heshvm101.github.io/GAFI/#departments-journey)\n- [2.1 البحوث والتراخيص](https://heshvm101.github.io/GAFI/#research-licensing)\n- [دراسة الجدوى](https://heshvm101.github.io/GAFI/#research-feasibility-study)\n- [تعديل بيانات المشروع](https://heshvm101.github.io/GAFI/#research-amendments)\n- [تصفية المشروع](https://heshvm101.github.io/GAFI/#research-liquidation)\n- [2.2 التنفيذ](https://heshvm101.github.io/GAFI/#procedures)\n- [FOB وCIF](https://heshvm101.github.io/GAFI/#procedures-incoterms)\n- [اتفاقية الكويز (QIZ)](https://heshvm101.github.io/GAFI/#procedures-qiz)\n- [الهالك](https://heshvm101.github.io/GAFI/#procedures-waste)\n- [أهم الأخطاء الشائعة](https://heshvm101.github.io/GAFI/#procedures-mistakes)\n- [2.3 المتابعة المالية](https://heshvm101.github.io/GAFI/#post-approval)\n- [المخالفات والإجراءات](https://heshvm101.github.io/GAFI/#post-violations)\n\n03 · النظام المالي\n\n- [الانتفاع، الخدمات، الضمان](https://heshvm101.github.io/GAFI/#fees)\n- [خطاب الضمان](https://heshvm101.github.io/GAFI/#fees-guarantee-letter)\n- [مصادر إيرادات الهيئة](https://heshvm101.github.io/GAFI/#fees-revenue-sources)\n\n04 · الإطار القانوني\n\n- [أنواع المناطق، الإعفاءات](https://heshvm101.github.io/GAFI/#legal)\n- [تاريخ المناطق الحرة: من Free Port إلى Free Zone](https://heshvm101.github.io/GAFI/#legal-history)\n- [المناطق الحرة الخاصة](https://heshvm101.github.io/GAFI/#legal-private-zones)\n- [المناطق الحرة العامة التسع](https://heshvm101.github.io/GAFI/#legal-zones-map)\n- [البيئة شرط أساسي](https://heshvm101.github.io/GAFI/#legal-environment)\n\n05 · السياق الاقتصادي\n\n- [ليه الدولة متمسكة بالمناطق الحرة](https://heshvm101.github.io/GAFI/#context)\n\n06 · حالات عملية\n\n- [رفض بسبب البيئة](https://heshvm101.github.io/GAFI/#cases-environment)\n- [صناعي مقابل تخزيني بالأرقام](https://heshvm101.github.io/GAFI/#cases-industrial-vs-storage)\n- [دورة تصفية كاملة](https://heshvm101.github.io/GAFI/#cases-liquidation)\n\n07 · المرجع السريع\n\n- [مسرد المصطلحات](https://heshvm101.github.io/GAFI/#table-glossary)\n- [الجدول الشامل للرسوم](https://heshvm101.github.io/GAFI/#table-fees-full)\n\n01\n\n## الأساسيات: الهيئة ونظام المنطقة الحرة\n\nقبل ما ندخل في لجنة فنية، خطاب ضمان، أو إقرار وارد، لازم نعرف أصلًا: **مين ماسك اللعبة؟ وإيه اللي بيدخل المستثمر المنطقة الحرة عشانه؟**\n\n**الهيئة العامة للاستثمار (GAFI)**\n\nالهيئة العامة للاستثمار والمناطق الحرة (GAFI) هي الجهة الحكومية المسؤولة عن تنظيم وتشجيع الاستثمار في مصر، وتتبع الدولة في جذب المستثمرين المحليين والأجانب، وتشرف على تطبيق قانون الاستثمار رقم 72 لسنة 2017 داخل المناطق الحرة وغيرها من الأنظمة الاستثمارية. من أهم أهدافها: جذب الاستثمارات المحلية والأجنبية، زيادة الصادرات، توفير فرص عمل، إدخال عملة أجنبية، تبسيط إجراءات تأسيس المشروعات، وتوفير بيئة استثمارية مناسبة للمستثمر.\n\n**قبل ما نبدأ رحلة المستثمر: مين بيعمل إيه؟**\n\nأول فرق لازم يثبت في دماغك: الهيئة مش هي الشركة، ومش شريك فيها. هي الجهة اللي بتحط القواعد، تراجع المشروع، تمنح الموافقات، وتراقب إن المزايا الممنوحة للمستثمر تُستخدم في النشاط المصرح به.\n\n**الهيئة مقابل الشركات**\n\nالفرق الأساسي اللي هيوضح كل حاجة بعد كده: الهيئة جهة خدمية وتنظيمية، دورها يقتصر على استقبال المستثمر، مراجعة المشروع، إصدار الموافقات، الرقابة، ومتابعة تنفيذ القوانين — مش طرف منتج ولا تاجر في السوق.\n\n| **الهيئةالشركات**      |                      |\n| ---------------------- | -------------------- |\n| **جهة حكومية**         | جهة ربحية            |\n| **تقدم خدمات تنظيمية** | تبيع منتجات أو خدمات |\n| **تشجع الاستثمار**     | تحقق أرباحاً         |\n| **تمنح الموافقات**     | تنتج أو تتاجر        |\n\n**يعني إيه منطقة حرة؟**\n\nتخيل مستثمر عايز يعمل مصنع للتصدير. أول سؤال عنده: *إيه اللي هيخليني أنتج من مصر وأفضل قادر أنافس منتج معمول في بلد تانية؟* هنا بيظهر نظام المنطقة الحرة.\n\nتعريف الهيئة الرسمي: جزء من إقليم الدولة يدخل ضمن حدودها ويخضع لسلطتها الإدارية، ويُعامَل وفقًا لأحكام ضريبية وجمركية ونقدية خاصة.\n\nبمعنى عملي: الشركة جوه المنطقة الحرة تقدر تستورد خامات من أي دولة من غير ما تدفع الجمارك المعتادة، تصنّع أو تخزّن أو تقدّم خدمة، وبعدين تصدّر للخارج. الهدف من النظام ده بالنسبة للدولة أربع حاجات: زيادة الصادرات، جذب الاستثمار الأجنبي، توفير فرص عمل، وإدخال عملة صعبة (دولار أو يورو) لمصر.\n\nوبما إن الشركة معفاة من الجمارك العادية، تكلفة الإنتاج بتقل، وده اللي بيخليها تنافس بقوة أكبر في السوق العالمي.\n\n**3 أنواع مشروعات فقط**\n\n### مشروع صناعي\n\nمصنع كامل: يستورد خامات، يصنّعها، ثم يصدّر منتج جديد بالكامل.\n\nمواد خام\n\n←\n\nتصنيع (تغيير الشكل)\n\n←\n\nتصدير منتج جديد\n\nمثال: مصنع ملابس، مصنع بلاستيك، مصنع مواد غذائية.\n\n### مشروع تخزيني\n\nلا يصنّع ولا يغيّر في المنتج، فقط يستورد بضاعة جاهزة، يخزّنها، ثم يعيد تصديرها.\n\nبضاعة جاهزة\n\n←\n\nتخزين (بدون تغيير)\n\n←\n\nإعادة تصدير\n\nمثال: شركة تستورد 500 سيارة، تخزنها شهرين، ثم توزّع 100 لمصر و200 لليبيا و200 لتونس.\n\n### مشروع خدمي\n\nمفيش سلعة أصلًا؛ المنتج نفسه هو الخدمة المقدَّمة.\n\nطلب العميل\n\n←\n\nتنفيذ الخدمة\n\n←\n\nتسليم لعميل خارجي\n\nمثال: استشارات هندسية، تأجير معدات وحفارات، توفير مهندسين لشركات بترول.\n\n### صناعي مقابل تخزيني: إيه الفرق فعلاً؟\n\n**الصناعي**\xa0بيضيف قيمة للمنتج (بيصنّع منتج جديد)، وده بيديه مزايا أكبر، ودوره يشجّع التصدير.\n\n**التخزيني**\xa0مايضيفش قيمة كبيرة (بيخزّن ويعيد التصدير بس)، مزاياه أقل، ودوره يعتمد على التخزين وإعادة التعبئة.\n\n### ليه الفرق ده مهم؟\n\nلأن نوع النشاط بيأثر على فئة الرسوم والمعاملة اللي المشروع بياخدها من الهيئة — راجع فصل "النظام المالي" للتفاصيل.\n\n**الأنشطة المسموحة والممنوعة**\n\nالهيئة تسمح بكل الأنشطة الموجهة أساسًا للتصدير للخارج، حسب سياستها، باستثناء بعض الأنشطة المحظورة كليًا أو المقيدة بموافقة خاصة.\n\n### ممنوعة نهائيًا\n\nصناعات الخمور والمواد الكحولية، وصناعات الأسلحة والذخائر والمتفجرات وما يرتبط بالأمن القومي.\n\n### مسموحة بموافقة خاصة (بعد تعديل 2023)\n\nتصنيع البترول، صناعة الأسمدة، الحديد والصلب، تسييل ونقل الغاز الطبيعي، والصناعات كثيفة استخدام الطاقة، كانت ممنوعة تمامًا وأصبحت جائزة بموافقة المجلس الأعلى للطاقة بعد القانون رقم 160 لسنة 2023.\n\n**ليه الشركات تدخل منطقة حرة؟**\n\nتقليل تكلفة الاستيراد بدون جمارك عادية، يعني تكلفة إنتاج أقل، ومنافسة أقوى في السوق العالمي. بالإضافة لضمانات قانونية وحوافز تفصيلية موجودة في قسم "الإطار القانوني" بالأسفل.\n\n**خلاصة سريعة: أسئلة ومراجعة**\n\n| **السؤالالإجابة**                              |                                                                                                                            |\n| ---------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------- |\n| **ما هي الهيئة العامة للاستثمار؟**             | جهة حكومية مسؤولة عن تنظيم وتشجيع الاستثمار والإشراف على المناطق الحرة وتطبيق قانون الاستثمار.                             |\n| **ما الهدف الأساسي للمناطق الحرة؟**            | تشجيع الاستثمار، زيادة الصادرات، توفير العملة الأجنبية، خلق فرص عمل.                                                       |\n| **هل الهيئة جهة إنتاج؟**                       | لأ، هي جهة خدمية وتنظيمية ورقابية.                                                                                         |\n| **ما أول إدارة يقابلها المستثمر؟**             | إدارة البحوث.                                                                                                              |\n| **ما الفرق بين المنطقة الحرة العامة والخاصة؟** | العامة: منطقة مجهزة تستقبل عدداً كبيراً من المشروعات. الخاصة: تنشأ لخدمة مشروع أو مشروعات محددة خارج المنطقة الحرة العامة. |\n\n02\n\n## الإدارات\n\nDepartments · هنا بنسيب تعريف النظام ونبدأ نمشي مع **المستثمر نفسه**. تخيل إنك مكانه: قدمت الفكرة، والورق بدأ يتحرك. من هنا كل إدارة هتاخد مرحلة من الرحلة، لحد ما المشروع يشتغل وتبدأ الهيئة تتابعه.\n\n**رحلة المستثمر من الفكرة للتشغيل**\n\nقبل ما نفصّل كل إدارة، شوف الرحلة كلها مرة واحدة. الفكرة إنك ما تحفظش الإدارات كأسماء منفصلة؛ اربط كل إدارة بلحظة معينة في عمر المشروع.\n\n**الحكاية ببساطة:** المستثمر عنده فكرة → يقدم الطلب → المشروع يتفحص → الأرض تتخصص → الشركة تتأسس → المعدات تدخل → الإنتاج يبدأ → الصادرات والواردات تتراقب → ولو المشروع انتهى، تبدأ رحلة التصفية.\n\nكل مرحلة معاها مين مسؤول عنها، وفين بتظهر الرسوم على الطريق. الخريطة دي نظرة عامة بس — كل مصطلح فيها ([مقابل الانتفاع](https://heshvm101.github.io/GAFI/#fees-usufruct)،\xa0[مقابل الضمان](https://heshvm101.github.io/GAFI/#fees-guarantee-fee)،\xa0[الرسم الجاري](https://heshvm101.github.io/GAFI/#procedures-fees)، إلخ) هيتشرح بالتفصيل في مكانه بعد كده، فلو قابلت كلمة مش فاهمها دلوقتي، دوس عليها على طول أو كمّل قراءة عادي وهتوصلها.\n\n**فكرة المشروع + دراسة الجدوى**\n\nالمستثمر\n\n**تقديم الطلب (Application)**\n\n2.1 البحوث والتراخيص\n\n**اللجنة الفنية ← الموافقة المبدئية ← استكمال الشروط ← الموافقة النهائية**\n\n2.1 البحوث والتراخيص\n\n**تخصيص الأرض**\n\n2.1 البحوث والتراخيصمقابل الانتفاع يبدأ\n\n**تأسيس الشركة رسميًا (سجل تجاري، بطاقة ضريبية، عقد الشركة)**\n\nمجمع خدمات الاستثمار\n\n**سداد مقابل الانتفاع والخدمات، واستكمال الإجراءات المالية**\n\nالمتابعة المالية\n\n**التنفيذ: استيراد المعدات وبدء النشاط**\n\n2.2 التنفيذمقابل الضمان + الرسم الجاري\n\n**تشغيل المشروع**\n\n2.2 التنفيذمقابل الخدمات السنوي\n\n**المتابعة والرقابة المستمرة**\n\n2.3 المتابعة المالية\n\n**قطاع المناطق الحرة**\n\nقطاع المناطق الحرة من أهم قطاعات الهيئة، ويتولى: استقبال المستثمرين، تخصيص الأراضي، مراجعة المشروعات، متابعة الشركات، تحصيل الرسوم، الرقابة على تنفيذ النشاط، ومتابعة الصادرات والواردات. الإدارات التلاتة اللي جاية هي أقسام جوه القطاع ده.\n\nالهيئة كمان مش بتستنى المستثمرين بس — فيه\xa0**قطاع الترويج للاستثمار**\xa0بيحضر المعارض الدولية والمؤتمرات، بيقابل المستثمرين، وبيسوّق للفرص الاستثمارية جوه مصر وبرا، بالإضافة للخريطة الاستثمارية اللي بتعرض الفرص إلكترونياً. القطاع ده رسميًا واحد من المحاور الاستراتيجية الخمسة للهيئة (جنب إدارة المناطق الحرة وتنمية المناطق الاستثمارية، تطوير خدمات الاستثمار، دعم المشروعات الصغيرة والمتوسطة وريادة الأعمال، والتطوير المؤسسي الداعم). تفاصيل سير العمل اليومي جواه (زي إدارة الأقسام التانية بالضبط) لسه مش موثقة هنا، هتتضاف لما تتوفر.\n\n**تطور حديث (مايو 2026):**\xa0رئيس الهيئة وجّه القطاع بالتحول من "الترويج العام" لـ"الاستهداف المباشر" — يعني بدل ما يكتفي بالترويج الواسع، بقى فيه آلية متابعة منظمة لكل شركة أو مستثمر مستهدف بالاسم، مع محتوى ترويجي مبني على بيانات ومؤشرات اقتصادية فعلية، لحد ما الفرصة تتحول لاستثمار فعلي على الأرض.\n\n**قطاع المناطق الحرة**\n\n**2.1**البحوث والتراخيص\n\n**2.2**التنفيذ\n\n**2.3**المتابعة المالية\n\n**—**الترويج\n\n**—**الهندسي\nاعتماد تراخيص البناء فور تقديم الرسومات الهندسية ومراجعتها\n\n**—**القانوني\nمراجعة الشكل القانوني والعقود\n\n[**2.1**](https://heshvm101.github.io/GAFI/#research-licensing)\n\n### [البحوث والتراخيص](https://heshvm101.github.io/GAFI/#research-licensing)\n\n[استقبال المستثمر، مرحلتا الموافقة، اللجنة الفنية، دور فرع الإسكندرية.](https://heshvm101.github.io/GAFI/#research-licensing)\n\n[افتح القسم ←](https://heshvm101.github.io/GAFI/#research-licensing)\n\n[**2.2**](https://heshvm101.github.io/GAFI/#procedures)\n\n### [التنفيذ](https://heshvm101.github.io/GAFI/#procedures)\n\n[مسار الاستيراد، المعاينة الثلاثية، الرسم الجاري حسب نوع المشروع.](https://heshvm101.github.io/GAFI/#procedures)\n\n[افتح القسم ←](https://heshvm101.github.io/GAFI/#procedures)\n\n[**2.3**](https://heshvm101.github.io/GAFI/#post-approval)\n\n### [المتابعة المالية](https://heshvm101.github.io/GAFI/#post-approval)\n\n[خروج المعدات، الصادرات والواردات، نسبة التصدير، المخالفات.](https://heshvm101.github.io/GAFI/#post-approval)\n\n[افتح القسم ←](https://heshvm101.github.io/GAFI/#post-approval)\n\n2.1\n\n**الفصل الثاني · الإدارات \xa0/\xa0 1 من 3**\n\n## إدارة البحوث والتراخيص\n\nResearch & Licensing Department · **هنا المشروع لسه فكرة على الورق.** المستثمر لسه ما دخلش شاحنات ولا بدأ إنتاج. كل اللي معاه هو مشروع عايز يقنع الهيئة إنه يستحق يدخل النظام، وده بالضبط دور الإدارة: تحول الفكرة من مجرد تصور إلى مشروع قابل للموافقة.\n\n| **السؤالالإجابة**                    |                                                                                                                                 |\n| ------------------------------------ | ------------------------------------------------------------------------------------------------------------------------------- |\n| **الدور الأساسي**                    | استقبال المستثمر، شرح النظام، مراجعة فكرة المشروع، تصحيح المفاهيم الخاطئة، وتوضيح المستندات المطلوبة                            |\n| **إمتى بيبدأ دورها في رحلة المشروع** | من أول لحظة — هي أول إدارة يقابلها المستثمر، ودورها يستمر لحد صدور قرار المزاولة                                                |\n| **علاقتها بالإدارات التانية**        | بعد موافقتها، الملف يروح لمجمع خدمات الاستثمار للتأسيس، بعدين للمتابعة المالية لسداد الرسوم، وأخيرًا لإدارة التنفيذ لبدء النشاط |\n| **ليه موجودة أصلاً**                 | عشان تتأكد إن المشروع مناسب لنظام المناطق الحرة ومستوفي شروطه، قبل ما ياخد أرض أو موافقة                                        |\n| **أول مستند تتعامل معه**             | نموذج طلب إقامة المشروع (Application)                                                                                           |\n| **الجهة صاحبة القرار النهائي**       | مجلس إدارة الهيئة أصلًا — لكن في الإسكندرية بتفويض من 2013، رئيس المنطقة يوقّعه مباشرة                                          |\n\n**1قبل الموافقة**\n\n**دراسة الجدوى (Feasibility Study)**\n\nأول اختبار حقيقي للمشروع مش هو المبنى ولا الماكينات، بل **هل الفكرة نفسها منطقية؟** عشان كده بعد تقديم الطلب، الإدارة بترجع لدراسة الجدوى وبتفككها إلى 5 أجزاء أساسية:\n\n| **الجزءبيحتوي على إيه؟** |                                |\n| ------------------------ | ------------------------------ |\n| **دراسة السوق**          | العملاء والمنافسون والطلب      |\n| **الدراسة الفنية**       | الإنتاج والآلات والموقع        |\n| **الدراسة المالية**      | رأس المال والتكاليف والإيرادات |\n| **الدراسة القانونية**    | الشكل القانوني والتراخيص       |\n| **البرنامج الزمني**      | مراحل تنفيذ المشروع            |\n\n### رأس المال مقابل التكاليف الاستثمارية\n\n**رأس المال:**\xa0الأموال اللي المستثمر نفسه بيمتلكها، وهي جزء من المشروع بس.\n\n**التكاليف الاستثمارية:**\xa0كل الأموال اللازمة لتشغيل المشروع، بتشمل رأس المال + القروض والتسهيلات وغيرها.\n\n### الحصة النقدية مقابل العينية\n\n**نقدية:**\xa0أموال، ومش محتاجة تقييم خاص.\n\n**عينية:**\xa0معدات أو أصول أو خبرة أو حقوق معنوية، ولازم تتقيّم من خبراء.\n\n**الأشكال القانونية للشركات**\n\nالشكل القانوني اللي المستثمر بيختاره جزء من الدراسة القانونية جوه دراسة الجدوى، وبيأثر على المسؤولية والإدارة. الاختيار عمومًا بين المرونة والحماية:\n\nأسهل وأسرعأكتر حماية وتنظيم\n\n**منشأة فردية**\n\n**تضامن**\n\n**توصية بسيطة**\n\n**ذات مسؤولية محدودة**\n\n**مساهمة**\n\n| **النوعالوصفأهم ميزةأهم عيب** |                                              |                          |                              |\n| ----------------------------- | -------------------------------------------- | ------------------------ | ---------------------------- |\n| **منشأة فردية**               | سهل التأسيس، مرن، لكن الصاحب مسؤول عن كل شيء | سهلة التأسيس             | تنتهي بوفاة صاحبها           |\n| **تضامن**                     | شركاء بمسؤولية مشتركة وغير محدودة            | مرونة الإدارة            | مسؤولية غير محدودة           |\n| **توصية بسيطة**               | خليط: شركاء متضامنون + ممولون                | جذب مستثمرين ممولين      | الإدارة للمتضامن فقط         |\n| **ذات مسؤولية محدودة**        | حماية الشركاء بمسؤولية محدودة برأس المال     | حماية الشركاء            | قيود أكثر من المنشأة الفردية |\n| **مساهمة**                    | الأكثر تنظيماً، للمشروعات الكبيرة جداً       | مناسبة للمشروعات الكبيرة | إجراءات أكثر تعقيداً         |\n\n**المستندات المطلوبة**\n\nوبعد ما يتحدد الشكل القانوني، الإدارة بتطلب من المستثمر مجموعة مستندات رسمية تثبت كل اللي اتقال في دراسة الجدوى:\n\n| **المستندليه بيتطلب؟**  |                                 |\n| ----------------------- | ------------------------------- |\n| **نموذج إقامة المشروع** | بداية جميع الإجراءات            |\n| **التوكيل**             | لو مقدّم الطلب مش المستثمر نفسه |\n| **بطاقة أو جواز سفر**   | إثبات الشخصية                   |\n| **شهادة عدم الالتباس**  | حجز اسم الشركة                  |\n| **دراسة الجدوى**        | تقييم المشروع                   |\n| **الرسم الكروكي**       | توضيح توزيع المصنع              |\n| **البرنامج الزمني**     | متابعة التنفيذ                  |\n| **الملاءة المالية**     | إثبات القدرة على التمويل        |\n| **بيانات الشركاء**      | معرفة الملاك ونسبهم             |\n| **بيان خطوط الإنتاج**   | التأكد من النشاط                |\n| **بيان الآلات**         | معرفة المعدات المستخدمة         |\n\n**ملحوظة:**\xa0شهادة عدم الالتباس بتحجز اسم الشركة لمدة 15 يوم، وده بيتفق مع مدة سريانها في السجل التجاري؛ لو المدة خلصت من غير ما يكمل المستثمر إجراءات التأسيس، لازم يستخرج شهادة جديدة.\n\n**مرحلتا الموافقة على المشروع**\n\nبمجرد ما المستندات تكتمل، الملف يدخل رسميًا في مسار الموافقة اللي بيمر بمرحلتين:\n\nمراجعة الطلب (Application)\n\n←\n\nمراجعة المستندات ودراسة المشروع\n\n←\n\nعرض الملف على اللجنة الفنية\n\n←\n\nالموافقة المبدئية\n\n←\n\nاستكمال الشروط\n\n←\n\nالموافقة النهائية\n\n**01**\n\n### الموافقة المبدئية\n\nمراجعة الطلب والمستندات، دراسة المشروع، ثم عرض الملف على اللجنة الفنية.\n\n**02**\n\n### الموافقة النهائية (Final Approval)\n\nبتصدر لو اللجنة الفنية وافقت والمستثمر استوفى كل الشروط، وبعدها تُستكمل إجراءات إقامة المشروع. المستند الرسمي اللي بيصدر بيها هو نفسه\xa0**"قرار المزاولة"**\xa0— الاسمين بيتقالوا على نفس الحاجة.\n\n**الصلاحية:**\xa0الموافقة النهائية (قرار المزاولة) صلاحيتها 6 شهور — لازم المشروع يستوفي شروطها خلال المدة دي، وإلا يُطلب منه تجديدها.\n\n**اللجنة الفنية (Technical Committee)**\n\nالجهة اللي بتاخد قرار الموافقة المبدئية فعليًا هي اللجنة الفنية، وهي بتجتمع بشكل دوري لدراسة طلبات المستثمرين قبل صدور أي موافقة.\n\n- **✓**\n\n  مراجعة كل مشروع على حدة.\n- **✓**\n\n  مناقشة البيانات المقدَّمة من المستثمر.\n- **✓**\n\n  التأكد من استيفاء الشروط المطلوبة.\n- **✓**\n\n  إصدار توصية: بالموافقة، أو الرفض، أو طلب استكمال مستندات.\n\n**ليه ممكن المشروع يترفض أو يتأخر؟**\n\nمش كل الطلبات بتعدي بسلاسة من اللجنة، أهم أسباب الرفض أو التأخير:\n\n- **✓**\n\n  دراسة الجدوى ضعيفة أو غير مقنعة.\n- **✓**\n\n  عدم إثبات الملاءة المالية.\n- **✓**\n\n  مستندات ناقصة.\n- **✓**\n\n  النشاط غير مناسب للمناطق الحرة.\n- **✓**\n\n  الشريك الأجنبي لم يحصل على الموافقات المطلوبة عند الحاجة.\n- **✓**\n\n  اسم الشركة غير متاح.\n- **✓**\n\n  البيانات المقدَّمة غير منطقية.\n\n### مراجعة الطلب (Application) قبل اللجنة\n\nقبل عرض المشروع على اللجنة، يراجع الموظف المختص: استكمال المستندات، صحة البيانات، ومطابقة النشاط.\n\n**ملحوظة:**\xa0كتابة اسم المشروع بالعربية والإنجليزية معاً أصبحت من المتطلبات الأساسية للطلب.\n\n### دور فرع الهيئة بالإسكندرية\n\nلا يخصص الأراضي بنفسه، وإنما يراجع الطلبات ويُعِدّها فقط، ويجمع موقف الشركة الكامل (الالتزام، السداد، الجرد السنوي) من كل الإدارات قبل عرضها — لأن فرع الإسكندرية عارف الشركات، والقاهرة لأ.\n\n**Practical Note · التفويض لرئيس المنطقة:**\xa0الموافقة النهائية أصلًا بتصدر من مجلس إدارة الهيئة، والمجلس ده بيجتمع نادرًا (مرتين تلاتة في السنة). من 2013، الإسكندرية هي المنطقة الوحيدة اللي أخدت تفويضًا من المجلس لرئيس المنطقة يوقّع الموافقة النهائية مباشرة — فبدل ما القرار ياخد شهر أو شهرين لحد ما ينعقد المجلس، بقى بيطلع في يوم واحد.\n\n**2بعد الموافقة**\n\n**تعديل بيانات المشروع (Project Amendments)**\n\nلحد هنا المشروع لسه بيتأسس. لكن بمجرد ما بدأ التشغيل الفعلي، أي تعديل في بياناته لازم يرجع للهيئة — مش المستثمر يعدّل لوحده — لأن بيانات المشروع بقت جزء من قرار المزاولة والملفات الرسمية. المستثمر بيقدّم طلب تعديل بمستنداته (زي جدول بيانات التوسع لو بيوسّع)، والإدارة بتراجعه، وبتاخد رأي إدارات تانية لو النشاط مش نمطي، وبيتعرض على اللجنة الفنية تاني لو استدعى الأمر، وبعد استيفاء المستندات تصدر الموافقة.\n\n**أول سنتين:**\xa0في الفترة دي عادةً ما بيُنصح المستثمر بعدم تعديل البيانات الأساسية للمشروع، لحد ما يثبت استقرار نشاطه.\n\n| **نوع التعديلبيتعدل فيه إيه؟** |                             |\n| ------------------------------ | --------------------------- |\n| **تعديل بيانات المشروع فقط**   | قرار المزاولة فقط           |\n| **تعديل عقد التأسيس**          | عقد التأسيس والسجل التجاري  |\n| **تعديل الاثنين معًا**         | قرار المزاولة + عقد التأسيس |\n\n### امتى يتعدل قرار المزاولة فقط؟\n\n- زيادة مساحة المشروع.\n- تقليل مساحة المشروع.\n- تغيير قطعة الأرض.\n- التوسعات داخل المنطقة الحرة.\n\nلأن البيانات دي تخص الهيئة فقط، ومش موجودة في عقد التأسيس أصلًا.\n\n### امتى يتعدل عقد التأسيس كمان؟\n\n- تغيير الممثل القانوني.\n- دخول شريك جديد.\n- خروج شريك.\n- تعديل نسب الشركاء.\n- تغيير رأس المال.\n\nلأن البيانات دي موجودة في عقد التأسيس وقرار المزاولة مع بعض.\n\nطلب تعديل\n\n←\n\nمراجعة المستندات\n\n←\n\nاللجنة الفنية\n\n←\n\nالموافقة\n\n←\n\nتعديل قرار المزاولة و/أو عقد التأسيس\n\n**تصفية المشروع (Project Liquidation)**\n\nولو المشروع وصل في يوم من الأيام للنهاية، القصة ما بتخلصش بمجرد إن المصنع يقفل بابه. **هنا تبدأ آخر رحلة للملف:** التصفية. لو التعديل مش كفاية والمستثمر قرر ينهي نشاطه تمامًا، بيدخل في مسار مختلف تمامًا. إنهاء نشاط المشروع مش مجرد إقفال المصنع أو ترك الموقع — لازم تصفية كاملة وفق إجراءات الهيئة لحد ما تنتهي كل الالتزامات القانونية والمالية. التصفية نوعين:\xa0**اختيارية**\xa0(المستثمر نفسه بيطلبها، والهيئة بتسأله الأول هل السبب حاجة تقدر تحلّها)، أو\xa0**إجبارية**\xa0(المشروع مش ملتزم رغم المتابعة والإنذارات، فتُعرض حالته على اللجنة الفنية).\n\n**طلب التصفية**\n\nالمستثمر أو الهيئة\n\n**اللجنة الفنية ← الموافقة المبدئية ← الموافقة النهائية**\n\n2.1 البحوث والتراخيص\n\n**جمعية الشركاء وتعيين المصفي القانوني**\n\nالشركاء / المساهمون\n\n**استخراج براءات الذمة من كل الجهات**\n\nالمصفي القانوني\n\n**النشر في جريدتين رسميتين + صحيفة الاستثمار**\n\nالمصفي القانوني\n\n**ميزانية التصفية + محضر الجمعية العمومية النهائي**\n\nالمصفي القانوني\n\n**قرار الإلغاء (يلغي قرار المزاولة وكل تعديلاته بقرار واحد)**\n\n2.1 البحوث والتراخيص\n\n**شطب الشركة من السجل التجاري**\n\nالسجل التجاري\n\n**استرداد خطاب الضمان**\n\nخطاب الضمان\n\n### براءات الذمة (Clearance Certificates)\n\nقبل إنهاء المشروع، لازم يثبت عدم وجود أي التزامات على الشركة تجاه: الهيئة، الجمارك، الضرائب، الكهرباء، المياه، والجهات الحكومية الأخرى. المصفي القانوني كمان بيقدّم إقرار يتحمّل فيه مسؤولية أي مستحقات تظهر لاحقًا.\n\n### دور المصفي القانوني (Legal Liquidator)\n\nبمجرد تعيينه في محضر جمعية الشركاء، بيبقى هو الوحيد اللي الهيئة بتتعامل معاه — مش الشركاء ولا الممثل القانوني. مسؤول عن تصفية حسابات الشركة، بيع أصولها، وسداد كل ديونها.\n\n**مدة التصفية:**\xa0ست شهور قانونًا، وممكن تُمدّ بمبررات — لكن المد نفسه لازم يمشي في نفس مسار الموافقة المبدئية والنهائية تاني.\n\n**أهم الأخطاء الشائعة (بعد الموافقة)**\n\n- **1**\n\n  **تعديل بيانات المشروع من غير الرجوع للهيئة:**\xa0أي تغيير (توسعة، تغيير أرض، دخول شريك) لازم يعدّي على الإدارة أولًا، مش يتنفذ على الأرض ثم يُبلَّغ.\n- **2**\n\n  **تعديل بيانات أساسية في أول سنتين:**\xa0بيُنصح الاستثمار بعدم لمس البيانات الأساسية قبل ما يثبت استقرار النشاط، وتجاهل النصيحة دي بيعقّد أي طلب تعديل لاحق.\n- **3**\n\n  **محاولة التصفية من غير تعيين مصفٍّ قانوني رسمي:**\xa0بعد التعيين، الهيئة مش بتتعامل مع الشركاء ولا الممثل القانوني إلا من خلاله؛ أي تصرف خارج هذا المسار بيعطّل الإجراءات.\n- **4**\n\n  **عدم استخراج براءات الذمة من كل الجهات:**\xa0الهيئة، الجمارك، الضرائب، الكهرباء، والمياه — نسيان جهة واحدة بيوقف التصفية بالكامل.\n\n2.2\n\n**الفصل الثاني · الإدارات \xa0/\xa0 2 من 3**\n\n## إدارة التنفيذ\n\nExecution Department · **الحاوية وصلت الميناء. من هنا الكلام بقى حقيقي.** البضاعة موجودة فعلًا، والمستندات لازم تتطابق معاها، والهيئة والجمارك لازم يتأكدوا إن اللي داخل هو فعلًا اللي المشروع مصرح له يتعامل فيه.\n\n| **السؤالالإجابة**                    |                                                                                                                                              |\n| ------------------------------------ | -------------------------------------------------------------------------------------------------------------------------------------------- |\n| **الدور الأساسي**                    | مراجعة حركة البضائع من دخولها مصر لحد خروجها: تسمح بالاستيراد والتصدير، تراجع المستندات، وتتأكد إن الإعفاءات مش بتتستغل غلط                  |\n| **إمتى بيبدأ دورها في رحلة المشروع** | بعد صدور قرار مزاولة النشاط مباشرة — لحظة ما الإدارات التانية تخلّص دورها                                                                    |\n| **علاقتها بالإدارات التانية**        | البحوث بتوافق على المشروع، مجمع الاستثمار بيؤسس الشركة، المتابعة المالية بتحصّل الرسوم — والتنفيذ هي اللي بتدير الحركة الفعلية للنشاط يوميًا |\n| **ليه موجودة أصلاً**                 | الدولة بتدي امتيازات ضخمة (إعفاءات جمركية وضريبية)، ومحتاجة رقابة تضمن إن كل امتياز بيتستخدم في النشاط المصرح بيه بس                         |\n\n**1 · حركة البضاعة**\n\n**أول ما البضاعة تتحرك، يبدأ الاختبار الحقيقي للنظام.**\n\nأول ما\xa0[قرار المزاولة](https://heshvm101.github.io/GAFI/#research-approval-stages)\xa0يصدر والمشروع يبدأ نشاطه، أول حاجة الإدارة بتتابعها هي حركة البضاعة الداخلة والخارجة. الوارد مش دايمًا جاي من مصدر واحد، والإجراءات بتختلف حسب المصدر:\n\n### من خارج مصر\n\nزي شركة بتستورد خامات من الصين — يحتاج بوليصة شحن وتأمين نقل بري.\n\n### من منطقة حرة أخرى\n\nزي شركة ببورسعيد بترسل خامات لشركة في الإسكندرية — إجراءات مختلفة عن الوارد الأجنبي والمحلي.\n\n### من السوق المحلي\n\nزي مصنع في القاهرة بيبيع خامات لمصنع في المنطقة الحرة — أسهل الحالات، مفيش تأمين نقل مطلوب.\n\n**أنواع الصادر (بنفس المنطق)**\n\n### تصدير للخارج\n\nالأصل والهدف الأساسي للمنطقة الحرة — المنتج بيخرج بره مصر بالكامل.\n\n### تحويل لمنطقة حرة أخرى\n\nنفس منطق الوارد بين المناطق، لكن بالعكس — بضاعة أو منتج نصف مصنّع بيتحرك لمشروع في منطقة حرة تانية.\n\n### بيع في السوق المحلي\n\nاستثناء، مش الأصل — يحتاج موافقات وسداد الرسوم الجمركية والضرائب المستحقة (تفاصيله في فصل المتابعة المالية).\n\n**مسار الاستيراد (وارد أجنبي)**\n\nأعقد حالات الوارد هي الوارد الأجنبي، وهي اللي بتوضح المسار الكامل من أول مستند لحد دخول البضاعة فعليًا:\n\nبوليصة الشحن\n\n←\n\nفاتورة البيع\n\n←\n\nوثيقة التأمين\n\n←\n\nإقرار وارد\n\n←\n\nإدارة التنفيذ بالهيئة\n\n←\n\nمصلحة الجمارك\n\n←\n\nدخول المنطقة الحرة\n\n**إقرار الوارد (Import Declaration)**\xa0هو أهم مستند في العملية كلها — إعلان رسمي من الشركة بالأصناف والكميات والغرض من استخدامها والنشاط المرتبط بيها. إدارة التنفيذ بتراجع كل بند فيه مقابل قرار مزاولة النشاط: هل الصنف ده أصلًا مسموح للشركة تتعامل فيه؟ هل هي هتستخدمه فعلًا في نشاطها ولا الهدف بيعه في السوق المحلي بدون ضرائب؟\n\n### بوليصة الشحن (Bill of Lading)، إيه هي بالظبط؟\n\nوثيقة قانونية بتصدرها شركة الشحن (الناقل) للمُصدِّر لما تستلم البضاعة عشان تنقلها. بتلعب 3 أدوار في نفس الوقت:\xa0**إيصال استلام**\xa0(إثبات إن الناقل فعلًا استلم البضاعة)،\xa0**عقد نقل**\xa0(شروط النقل والوجهة والأجرة)، و**وثيقة ملكية قابلة للتداول**\xa0— يعني اللي معاه البوليصة الأصلية هو اللي له حق استلام البضاعة، حتى لو مش هو المُصدِّر الأصلي.\n\n### ليه هي أول خطوة في المسار؟\n\nلأن من غيرها مفيش إثبات إن البضاعة اتشحنت أصلًا. الشركة الناقلة بتصدرها فور استلام البضاعة، وبعدين باقي المستندات (فاتورة البيع، وثيقة التأمين، إقرار الوارد) بتُبنى على البيانات المذكورة فيها: نوع البضاعة، الكمية، ميناء الشحن، ميناء الوصول، ووسيلة النقل.\n\n**أنواعها حسب وسيلة النقل:**\xa0بحرية (الأكثر شيوعًا، وثيقة قابلة للتداول)، جوية (Air Waybill، غير قابلة للتداول، مجرد عقد نقل)، وبرية (للشحن بين الدول المتجاورة). كل نوع نفس الوظيفة القانونية، يختلف بس شكل المستند حسب وسيلة النقل.\n\n**تحديث حديث من الهيئة:**\xa0بدل ختم فواتير الاستيراد والتصدير بشكل دوري مع كل عملية، أصبحت الهيئة تصدر شهادة استيراد وشهادة تصدير سارية لمدة 3 سنوات لكل منهما، لتقليل الإجراءات المتكررة على الشركات.\n\n### تأمين النقل البري (وثيقة التأمين)\n\nمطلوب بس للوارد الأجنبي. الهيئة بتضمن للجمارك إن البضاعة هتوصل من الدائرة الجمركية للمنطقة الحرة سليمة — لو حصل فقد أو سرقة أو تصرف غير قانوني، الهيئة هي اللي مسؤولة أمام الجمارك. قيمة الوثيقة = قيمة الجمارك والضرائب المستحقة، مش القيمة الكاملة للبضاعة.\n\nبضاعة قيمتها\xa0$100,000، الجمارك المستحقة عليها\xa0$20,000\xa0← وثيقة التأمين تُحرَّر بقيمة\xa0$20,000\xa0فقط. الرسم المقابل لخدمة الضمان دي هو نفسه\xa0[مقابل الضمان](https://heshvm101.github.io/GAFI/#fees-guarantee-fee)\xa0(1‰) في فصل النظام المالي.\n\n### الوارد المحلي: أسهل حالة\n\nلو البضاعة أصلًا داخل مصر، الإجراءات أبسط بكتير: إقرار وارد ← مراجعة ← توقيع ← ختم شعار الجمهورية ← يرسل للجمارك ← تفتح شهادة ← تدخل البضاعة. مفيش تأمين نقل بري ولا بوليصة شحن خارجية، لأن البضاعة أصلًا مش خارجة من دائرة جمركية.\n\n### الرصيد لدى الهيئة\n\nمش بس مرتبط بالتأمين — نفس الفكرة دي بتتطبق على أي رسم بيتكرر مع كل عملية استيراد أو تصدير (زي مقابل الضمان أو رسوم الإقرارات). بدل ما الشركة تدفع كل مرة لوحدها، بتحط مبلغ مقدّم كرصيد لديها، والهيئة تخصم الرسوم منه أول بأول مع كل عملية.\n\nمثال شائع: إيداع\xa0$10,000\xa0كرصيد يُخصم منه تباعًا.\n\n**المعاينة الثلاثية**\n\nقبل ما البضاعة تعدّي، فيه لحظة لازم تتقابل فيها **ثلاث صور لنفس العملية:** الورق، والبضاعة الموجودة على الأرض، والبيانات المسجلة على النظام. لو الثلاثة اتطابقوا، العملية تكمل. لو واحدة مختلفة، الحركة بتقف لحد ما السبب يتفهم ويتحل.\n\nقبل دخول أو خروج أي بضاعة، لازم لجنة من 3 أطراف تتأكد إن البضاعة المتحركة فعليًا مطابقة للمستندات المقدَّمة.\n\n01\n\n#### موظف إدارة التنفيذ\n\nممثل الهيئة\n\n02\n\n#### موظف مصلحة الجمارك\n\nالجهة الرقابية\n\n03\n\n#### مندوب الشركة\n\nصاحب البضاعة\n\n**القاعدة اللي بيشتغل بيها كل موظف تنفيذ:**\xa0مايراجعش مستند واحد لوحده أبدًا، دايمًا بيقارن 3 عناصر مع بعض — المستندات، والبضاعة الموجودة فعليًا، والبيانات المسجلة على النظام. لو الثلاثة متطابقين، الإجراءات بتكمل عادي. لو فيه اختلاف في أي عنصر، الإجراءات بتوقف لحد ما يتعرف السبب.\n\n**2الحساب والرسوم**\n\n**مصطلحات التجارة الدولية: FOB وCIF**\n\nلحد هنا الكلام كله عن حركة البضاعة نفسها. لكن كل عملية استيراد أو تصدير محتاجة كمان يتحدد مين بيدفع الشحن والتأمين ومتى تنتقل المسؤولية من البائع للمشتري — وده اللي بيبني عليه حساب الرسوم بعد شوية. الإجابة موجودة في قواعد\xa0**Incoterms**\xa0الصادرة عن غرفة التجارة الدولية، وأكتر مصطلحين مستخدمين في شغل المنطقة الحرة هما FOB وCIF.\n\n| **العنصرFOB (Free On Board)CIF (Cost, Insurance & Freight)** |                                       |                           |\n| ------------------------------------------------------------ | ------------------------------------- | ------------------------- |\n| **يتحمل الشحن البحري**                                       | المشتري                               | البائع                    |\n| **يتحمل التأمين**                                            | المشتري                               | البائع                    |\n| **تنتهي مسؤولية البائع**                                     | عند تحميل البضاعة على السفينة         | عند وصولها لميناء الوصول  |\n| **قيمة العقد تشمل**                                          | التصنيع + النقل للميناء + التحميل فقط | البضاعة + التأمين + الشحن |\n\n**قاعدة سهلة للحفظ:**\xa0FOB = "البائع يوصّل البضاعة للسفينة بس". CIF = "البائع يوصّل، ويؤمّن، ويدفع الشحن كمان".\n\nوده اللي بيربطها بالرسم الجاري (تحت): المشروع الصناعي بيتحاسب على أساس FOB لأنه صنّع منتج جديد فعلًا، والمشروع التخزيني بيتحاسب على أساس CIF لأنه بيتعامل مع البضاعة زي ما وصلت للميناء بالظبط.\n\n### مصطلحات تانية هتقابلها في المستندات\n\n- **Consignor / Shipper:**\xa0الشاحن أو المصدّر\n- **Consignee:**\xa0المستورد المستلم\n- **Freight Forwarder:**\xa0وكيل الشحن\n- **Customs Clearance:**\xa0التخليص الجمركي\n- **HS Code:**\xa0الكود الجمركي للسلعة\n- **Manifest:**\xa0بيان الشحنة كاملة\n- **Transit:**\xa0مرور البضاعة عبر دولة من غير دخولها للاستهلاك المحلي\n\n**اتفاقية الكويز (QIZ)**\n\n**مصطلح إضافي هتقابله في نفس السياق: اتفاقية الكويز.**\xa0اتفاقية "المناطق الصناعية المؤهلة" (Qualifying Industrial Zones) وقّعتها مصر مع أمريكا وإسرائيل في ديسمبر 2004. بتسمح لمنتجات مصرية معينة (غالبًا ملابس ومنسوجات) تدخل السوق الأمريكي بدون جمارك ومن غير سقف كمية (كوتا)، بشرط إن نسبة معينة من مكونات المنتج مصدرها إسرائيل (كانت 11.7% وقت التوقيع، وقلّت بعد تعديلات لاحقة لحد حوالي 8.5%). عدد المناطق المؤهلة وصل لأكتر من 27 منطقة في 14 محافظة.\n\n**مهم تفهمها صح:**\xa0الكويز مش نفس نظام المنطقة الحرة العادي — هي مسار تفضيلي منفصل خاص بالتصدير لأمريكا تحديدًا، وشركة ممكن تكون داخل منطقة حرة عادية وتستفيد بمزايا الكويز كمان لو نشاطها وموقعها مؤهلين، مش بديل عن نظام المناطق الحرة.\n\n**الرسم الجاري (Running Fee)، حسب نوع المشروع**\n\nوهنا بنرجع لأساس FOB وCIF اللي فات — لأن نوع المشروع هو اللي بيحدد أساس حساب الرسم الجاري:\n\n**صناعي**\n\n**1%**\xa0من قيمة الصادرات (أساس فوب FOB)، يُحصَّل وقت التصدير، لأن المصنع صنّع منتج جديد فعلًا. البضائع العابرة (ترانزيت) المحددة الوجهة مُعفاة من هذا الرسم.\n\n**تخزيني**\n\n**2%**\xa0من قيمة البضاعة الواردة (أساس سيف CIF)، يُحصَّل وقت دخول البضاعة، لأنه لم يصنّع شيئًا.\n\n**خدمي**\n\n**1%**\xa0من إجمالي الإيراد السنوي، قبل أي خصومات، من واقع قوائم مالية معتمدة من محاسب قانوني.\n\n**الأساس القانوني:**\xa0المادة 41 من قانون الاستثمار رقم 72 لسنة 2017، بالنسبة لمشروعات المناطق الحرة العامة (ومنها منطقة الإسكندرية).\n\n**مثال: ليه الرسم بيتحسب قبل الخصم؟ (مشروع خدمي)**\n\nقيمة الفاتورة الأصلية$100,000\n\nخصم مُقدَّم للعميل$20,000\n\nالمبلغ الذي دفعه العميل فعليًا$80,000\n\nأساس حساب الرسم لدى الهيئة**$100,000**\n\n### تقديم بيان الإيرادات\n\nالشركات الخدمية تقدّم بيان الإيرادات مرتين في السنة، مرفق معاه الفواتير والشيك المستحق. التأخير في التقديم يترتب عليه غرامات تأخير.\n\n### الوكيل الحصري (Exclusive Agent)\n\nكتير من شركات المنطقة الحرة مش بالضرورة هي المصنّعة، وإنما وكيل توزيع حصري لمنتج معين في أكتر من سوق: مصر، شمال أفريقيا، أوروبا، غرب آسيا.\n\n**الهالك: نسبة الفقد الطبيعي أثناء التصنيع**\n\nوطالما بنتكلم عن حساب الرسوم بدقة، فيه عنصر تاني بيأثر في الحساب لازم تعرفه: أي عملية تصنيع بتفقد جزء من الخامة الأصلية بشكل طبيعي (خامة بتتحول لمخلفات مش منتج نهائي) — النسبة دي اسمها "الهالك"، وهي مش نفس "الأخطاء" أو "التلاعب"، لكنها لازم تكون ضمن حدود منطقية ومقبولة فنيًا.\n\n### مين بيحدد النسبة؟\n\nالجهات الرقابية المختصة (زي الجهاز المسؤول عن كل صناعة) بتحدد "معامل هالك" ثابت لكل نشاط، بناءً على طبيعة المنتج والعملية الصناعية نفسها — مش رقم عشوائي ولا بيتحدد من الشركة.\n\n### ليه الهيئة بتتابعها؟\n\nمعامل الهالك ده هو الأساس اللي بيتحسب عليه الجمرك المستحق أو المسترد على الخامة المستوردة. لو الشركة استوردت 100 طن خامة وصنّعت منتج بوزن أقل من المتوقع حسب المعامل، الفرق ده لازم يتفسر — وإلا يبقى فيه شبهة إن جزء من الخامة اتباع في السوق المحلي بدون ما يتصنّع أو يتصدّر.\n\n**لما النسبة تتعدّى الحد المسموح:**\xa0الهيئة بتطلب تفسير من الشركة، وممكن تراجع العملية كاملة (زي ما هو موضح في "الأخطاء الشائعة" تحت) — لأن تجاوز الهالك المتكرر بيبقى مؤشر على مخالفة، مش مجرد فقد طبيعي.\n\n**أهم الأخطاء الشائعة**\n\n- **1**\n\n  **اختلاف بيانات المستندات:**\xa0اختلاف الكميات أو الوصف أو أرقام الحاويات — بيوقف الإجراءات فورًا لحد ما يتصحح.\n- **2**\n\n  **اختيار نشاط غير مناسب:**\xa0استيراد مواد أو أصناف مش داخلة أصلًا في النشاط المرخّص للشركة.\n- **3**\n\n  **خروج معدات بدون تصريح:**\xa0كل المعدات مسجلة لدى الهيئة، ومايجوزش تخرج من غير موافقة رسمية.\n- **4**\n\n  **زيادة الهالك بصورة غير مبررة:**\xa0لو نسبة الفقد أو التلف أثناء التصنيع تعدّت الحدود الفنية المسموحة، الهيئة بتطلب تفسير وممكن تراجع العملية كاملة.\n- **5**\n\n  **التأخير في تقديم الإقرارات:**\xa0كل عملية لازم تتسجّل في موعدها، والتأخير بيعطّل باقي الإجراءات.\n\n**مفاهيم هتتغطى بالتفصيل لاحقًا:**\xa0تصريح الخروج، بيان المعاينة، "التشغيل بين المشروعات"، و"الرسائل المؤقتة والمرتدة" — دول أسماء اتذكرت في التدريب بس البحث عنهم (حتى على الإنترنت) مأدّاش تفاصيل موثوقة تستاهل الكتابة، لأنهم مصطلحات إجرائية داخلية للهيئة مش موثّقة في مصادر عامة، فمستنيين تفاصيلهم من زميل في الإدارة بدل ما نخمّن.\n\n**ملحوظة عامة على الإدارة الهندسية والقانونية:**\xa0الدور العام بتاعهم معروف (اعتماد تراخيص البناء فور تقديم الرسومات الهندسية / مراجعة الشكل القانوني والعقود، زي الموضح في جدول الإدارات فوق) لكن تفاصيل سير العمل اليومي جواهم لسه مش موثقة في أي مصدر عام، خصوصًا الإدارة القانونية، ومحتاجة معلومة من جوه الهيئة نفسها.\n\n2.3\n\n**الفصل الثاني · الإدارات \xa0/\xa0 3 من 3**\n\n## إدارة المتابعة المالية\n\nFinancial Follow-up Department · **المشروع أخد الموافقة وبدأ يشتغل. هل كده دور الهيئة خلص؟ بالعكس.** هنا تبدأ مرحلة المتابعة: هل المشروع بينفذ اللي اتوافق عليه؟ هل بيستخدم الأرض والمعدات في النشاط الصحيح؟ وهل بيحافظ على شروط النظام طول فترة تشغيله؟\n\nالهدف من المتابعة إنها تتأكد إن المستثمر بينفذ اللي اتعهد بيه، وملتزم بقوانين المناطق الحرة، وبيستخدم الأرض والمعدات في النشاط المصرح بيه بس.\n\n| **السؤالالإجابة**                    |                                                                                                                                   |\n| ------------------------------------ | --------------------------------------------------------------------------------------------------------------------------------- |\n| **الدور الأساسي**                    | التأكد إن المستثمر بينفذ اللي اتعهد بيه، ملتزم بقوانين المناطق الحرة، وبيستخدم الأرض والمعدات في النشاط المصرح بيه بس             |\n| **إمتى بيبدأ دورها في رحلة المشروع** | فور ما المشروع يبدأ التشغيل الفعلي، ودورها مستمر طول عمر المشروع — لحد التصفية لو حصلت                                            |\n| **علاقتها بالإدارات التانية**        | بتشتغل بالتوازي مع إدارة التنفيذ (اللي بتراقب حركة البضائع يوم بيوم)، وبترفع للجنة الفنية لو المشروع خالف أو محتاج تعديل أو تصفية |\n| **ليه موجودة أصلاً**                 | الموافقة على المشروع مش نهاية القصة — الهيئة لازم تتأكد إن المزايا والإعفاءات مستمرة تتاخد مقابل التزام فعلي، مش مرة واحدة وخلاص  |\n\n**خروج المعدات من المنطقة الحرة**\n\n### الحالة العادية\n\nالمعدات جوه المنطقة الحرة مايجوزش تتخرج بحرية. لو المستثمر محتاج يخرج ماكينة للصيانة أو الإصلاح، لازم يقدّم طلب رسمي للهيئة الأول.\n\n### امتى محتاج موافقة خاصة؟\n\nلو التغيير كبير — زي إخراج عدد كبير من المعدات، أو استبدال خط إنتاج كامل، أو إحلال وتجديد المعدات.\n\nمبررات مقبولة: حريق، تلف في المعدات، أو استبدالها بمعدات أحدث. والهيئة بتحدد مدة زمنية لإحضار المعدات البديلة.\n\n**متابعة الصادرات والواردات**\n\nالمشروع بيقدّم بيانات دورية توضح قيمة الواردات والصادرات وكميات البضائع، والبيانات دي بتتستخدم لإعداد الإحصائيات ومتابعة أداء المشروع.\n\n**الالتزام بنسبة التصدير**\n\nلو المشروع اتوافق عليه أصلًا كمشروع تصديري، لازم يلتزم بالنسبة المقررة (بعض المشروعات، حسب الضوابط، مسموح لها تبيع نسبة محدودة في السوق المحلي — 20% مثلًا). لو المشروع مايحققش نسبة التصدير المطلوبة، ممكن يحصل:\n\n- **1**\n\n  وقف بعض المزايا الممنوحة للمشروع.\n- **2**\n\n  طلب توضيح أسباب عدم الالتزام.\n- **3**\n\n  تقديم مستندات تبرر الوضع.\n\n**التقييم الدوري للمشروع**\n\nالمشروعات مش بتتسيب بعد ما تبدأ التشغيل — بتتقيّم بشكل دوري (سنويًا غالبًا، أو حسب طبيعة المشروع)، والتقييم بيشمل: مدى الالتزام بالنشاط، تنفيذ الخطة، الالتزام بالقوانين، واستمرار الإنتاج.\n\n**المخالفات: من الاكتشاف إلى الإجراء القانوني**\n\nاكتشاف مخالفة\n\n←\n\nطلب توفيق الأوضاع\n\n←\n\nمتابعة التنفيذ\n\n←\n\nإنذار (عند عدم الالتزام)\n\n←\n\nإجراءات قانونية / إدارية (لو استمرت المخالفة)\n\n**أهم الأخطاء الشائعة**\n\n- **1**\n\n  **إخراج معدات من غير تصريح رسمي:**\xa0حتى لو للصيانة، لازم طلب مسبق للهيئة — إخراج أي معدة بدون موافقة بيُحسب كمخالفة مباشرة.\n- **2**\n\n  **عدم الالتزام بنسبة التصدير المقررة:**\xa0بيع كميات أكبر من المسموح في السوق المحلي بدون توضيح الأسباب أو استكمال المستندات المبررة.\n- **3**\n\n  **تجاهل الإنذارات:**\xa0المشروع اللي بيستمر في المخالفة رغم الإنذارات المتكررة بيدخل مسار الإجراءات القانونية مباشرة، بدل ما يتحل الموقف وديًا في مرحلة "توفيق الأوضاع".\n- **4**\n\n  **التعامل مع التقييم الدوري كإجراء شكلي:**\xa0عدم تجهيز مستندات الالتزام بالنشاط والخطة والقوانين قبل موعد التقييم بيطوّل وقت المراجعة.\n\n03\n\n## الرسوم والمقابل المالي\n\n**المشروع أخد الأرض، بدأ يستورد، والامتيازات اشتغلت. لكن كل ميزة ليها مقابل أو التزام مالي معين.** هنا بنفكك الرسوم والضمانات، مش كأرقام للحفظ، لكن كجزء من رحلة المشروع.\n\n**01**\n\n### مقابل الانتفاع (Usufruct Fee)\n\nإيجار الأرض أو المبنى، يُحسب سنويًا بسعر ثابت لكل متر مربع من المساحة المخصصة للمشروع. مجلس إدارة الهيئة هو المنوط بتحديد فئات هذا السعر، وتختلف الفئة حسب نوع النشاط (صناعي / تخزيني / خدمي).\n\n**الأساس القانوني:**\xa0المادة 11 من قرار وزيرة الاستثمار رقم 39 لسنة 2019.\n\n**03**\n\n### مقابل الضمان (Guarantee Fee)\n\n1 بالألف من قيمة وثيقة التأمين (مش من قيمة البضاعة نفسها).\n\nمثال: وثيقة تأمين قيمتها\xa0$20,000\xa0← مقابل الضمان =\xa0$20\n\n**02**\n\n### مقابل الخدمات السنوي (Annual Service Fee)\n\nيستحق بمجرد صدور قرار مزاولة النشاط، وبيتحسب سنويًا بعد كده، وفقًا لما تطبّقه الهيئة حاليًا.\n\n- **0.5 بالألف**\xa0من رأس المال المصدر، للمشروع الصناعي.\n- **1 بالألف**\xa0من رأس المال المصدر، للمشروع التخزيني أو الخدمي.\n- له\xa0**حد أقصى سنوي**\xa0= ما يعادل 100,000 جنيه مصري، يتحول لدولار أو يورو حسب سعر الصرف بالبنك المركزي يوم 1 يناير من كل سنة.\n- لو الناتج من الحسبة أقل من الحد الأقصى، تُطلب القيمة المحسوبة. لو أكبر، يُطلب الحد الأقصى فقط.\n\n**مثال حساب: مشروع صناعي، رأس المال المصدر $5,000,000**\n\nالنسبة المستحقة0.5‰\n\nالقيمة المحسوبة$5,000,000 × 0.5‰ = $2,500\n\nالحد الأقصى السنوي (2026)$2,103.77\n\nالمستحق فعليًا**$2,103.77**\n\nالحد الأقصى بيتجدد كل سنة حسب سعر صرف البنك المركزي يوم 1 يناير، ولذلك رقمه بالدولار يختلف من سنة لسنة. الرقم المحدد لسنة 2026 لسه محتاج تأكيد من مصدر رسمي منشور، الآلية نفسها (تحويل 100,000 جنيه بسعر يوم 1 يناير) هي المؤكدة.\n\nالقيمة المحسوبة\n\n$2,500.00\n\n**الحد الأقصى 2026**\n\n**$2,103.77 ← المستحق**\n\nالقاعدة: المستحق فعليًا هو\xa0**الأقل**\xa0بين القيمة المحسوبة والحد الأقصى — هنا الحد الأقصى أصغر، فهو اللي بيتحصّل.\n\n**بداية النشاط في نص السنة:**\xa0لو قرار المزاولة صدر مثلًا في 8 يناير، الشركة تدفع فقط عن الأيام المتبقية لحد آخر ديسمبر (عدد الأيام ÷ 365 × القيمة السنوية)، وبعدين من أول يناير التالي تدفع القيمة كاملة.\n\n**زيادة رأس المال:**\xa0لو الشركة زوّدت رأس مالها المصدر بعد كده، تُعاد حسبة مقابل الخدمات، وتُطلب الزيادة فقط من تاريخ الزيادة، مش من أول السنة.\n\nملاحظة: الغالبية العظمى من الشركات (حوالي 98%) رأس مالها بالدولار، والباقي (حوالي 2%) باليورو، وعدد شركات اليورو دي محدود جدًا (رقم يحتاج تأكيد من مصدره الأصلي: هل هو إجمالي عدد الشركات، ولا عدد اللي بتنضم كل سنة؟).\n\n**معلومة إضافية:**\xa0قانون الاستثمار يشترط ألا يقل رأس المال المصدر عن 250,000 جنيه مصري عند تأسيس الشركة، وهو نفس الرقم (رأس المال المصدر) اللي بيتبنى عليه حساب مقابل الخدمات كل سنة.\n\n**خطاب الضمان (Letter of Guarantee) — مش نفس مقابل الضمان**\n\nخطاب الضمان مختلف تمامًا عن "مقابل الضمان" اللي فوق (اللي هو 1‰ من قيمة وثيقة التأمين). خطاب الضمان مش رسم بيتحصّل وينتهي، وإنما ضمان مالي بتحتفظ بيه الهيئة طول عمر المشروع، عشان تضمن سداد أي التزامات مالية يتأخر المستثمر فيها — وبيتقدَّم إما كخطاب ضمان بنكي أو كإيداع نقدي في حساب الهيئة.\n\n| **نوع المشروعقيمة الضمان** |                            |\n| -------------------------- | -------------------------- |\n| **صناعي**                  | 1% من التكاليف الاستثمارية |\n| **تخزيني**                 | 2% من التكاليف الاستثمارية |\n\n### لو المستثمر اتأخر في السداد\n\nالهيئة بتخصم من خطاب الضمان (مقابل الانتفاع، مقابل الخدمات، أو أي رسوم مستحقة)، وفورًا بتطالب المستثمر يكمّل قيمة الضمان لحد ما ترجع لقيمتها الأصلية — النظام صارم في النقطة دي ومايسمحش إن الضمان يفضل ناقص.\n\n### الاسترداد\n\nبيترد للمستثمر في آخر خطوة من إجراءات التصفية، بعد شطب الشركة من السجل التجاري مباشرة — وده أحد أهم الأسباب اللي بتخلي حتى الشركات المتعثرة تكمّل إجراءات التصفية بدل ما تسيبها.\n\n**مصادر إيرادات الهيئة**\n\nغير الرسوم الأساسية اللي فوق، عند الهيئة مصادر إيرادات تانية أصغر بس منتشرة على كل تعاملات المشروع:\n\n| **المصدرتفاصيله**           |                                                                                                                                              |\n| --------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------- |\n| **مقابل تنمية وتطوير**      | 0.5% من قيمة مقابل الانتفاع (الإيجار)، بيتحصّل كل 3 شهور معاه؛ رسم مستحدث بموافقة مجلس إدارة الهيئة، وحاليًا معطّل مؤقتًا مراعاة لظروف السوق |\n| **رسوم صور طبق الأصل**      | 50 جنيه للورقة، بحد أقصى 300 جنيه، لأي مستند (قرار مزاولة، محضر تسليم أرض، إلخ)                                                              |\n| **رسوم الأرشيف الإلكتروني** | لمجرد الاطلاع على مستند قديم في الأرشيف القانوني، لازم طلب ورسوم                                                                             |\n| **رسوم دخول وخروج البضاعة** | مرتبطة بإقرارات الوارد والصادر، تُحصَّل في المتابعة المالية                                                                                  |\n| **رسوم الإقرارات**          | لكل إقرار وارد أو صادر رسم مستقل                                                                                                             |\n\n### ليه الهيئة بتحصّل الرسوم دي؟\n\nمش بغرض الربح فقط، وإنما مقابل خدمات فعلية بتقدّمها للمستثمر:\n\n- **✓**\n\n  وجود الجمارك داخل المنطقة الحرة نفسها.\n- **✓**\n\n  تجميع الجهات الحكومية في مكان واحد.\n- **✓**\n\n  تسهيل الإجراءات وإصدار المستندات.\n- **✓**\n\n  إدارة عمليات الدخول والخروج.\n- **✓**\n\n  متابعة المشروع طوال فترة تشغيله.\n\n**أهم الفروق اللي لازم متتلخبطش فيها**\n\n- **1**\n\n  **مقابل الضمان ≠ خطاب الضمان:**\xa0الأول رسم صغير (1‰ من قيمة وثيقة التأمين) بيتحصّل ويخلص، والتاني ضمان مالي كامل فاضل طول عمر المشروع ومش بيتحصّل كرسم.\n- **2**\n\n  **مقابل الانتفاع ≠ مقابل الخدمات السنوي:**\xa0الأول إيجار الأرض بسعر ثابت للمتر، والتاني نسبة من رأس المال المصدر بحد أقصى سنوي يتجدد كل سنة.\n- **3**\n\n  **الرسم الجاري بيختلف حسب نوع المشروع:**\xa01% صناعي (على أساس FOB وقت التصدير)، 2% تخزيني (على أساس CIF وقت الدخول)، 1% خدمي (على الإيراد السنوي كامل، مش بعد الخصومات).\n- **4**\n\n  **المستحق فعليًا هو الأقل بين القيمة المحسوبة والحد الأقصى**\xa0في حالة مقابل الخدمات السنوي، مش القيمة المحسوبة نفسها دايمًا.\n\n04\n\n## الإطار القانوني والتاريخي وأنواع المناطق الحرة\n\nقبل ما تحفظ قانون 72 أو تعدّد أنواع المناطق، لازم تعرف **إزاي وصلت مصر أصلًا لشكل المنطقة الحرة الموجود النهارده**. هنبدأ بقصة الفكرة عالميًا، ثم نشوف دخول مصر للنظام، وبعدها نرجع للقانون الحالي والأنواع والإعفاءات.\n\nالمناطق الحرة في مصر تخضع لقانون الاستثمار رقم 72 لسنة 2017 ولائحته التنفيذية وتعديلاتهما، بالإضافة إلى لائحة نظام إدارة المناطق الحرة الصادرة بقرار وزيرة الاستثمار رقم 39 لسنة 2019. وتشرف على تطبيق كل ده الهيئة العامة للاستثمار والمناطق الحرة (GAFI).\n\n### تاريخ المناطق الحرة: من Free Port إلى Free Zone\n\nقبل ما نفهم قانون مصر الحالي، مهم نعرف إن فكرة "المنطقة الحرة" نفسها أقدم بكتير من القوانين المصرية الحديثة. الفكرة بدأت أصلًا في صورة **Free Ports**: موانئ أو مناطق تحصل على معاملة جمركية خاصة لتسهيل التجارة، والتخزين، وإعادة التصدير. من أشهر الأمثلة التاريخية **Livorno في إيطاليا**، التي تطور فيها نظام الميناء الحر منذ القرن السابع عشر.\n\n### من الميناء الحر إلى المنطقة الحرة الحديثة\n\nالتحول الكبير حصل في القرن العشرين، لما تطورت الفكرة من مجرد تسهيل التجارة والتخزين إلى **منطقة صناعية موجهة للتصدير**.\n\n**1959 · Shannon, Ireland**\n\nإنشاء **Shannon Free Zone** في أيرلندا، وتوصف عادة بأنها أول منطقة حرة صناعية حديثة، وكانت الفكرة وقتها استخدام الحوافز الجمركية والاستثمارية لجذب شركات تقوم بالتصنيع والتصدير وخلق فرص عمل.\n\nوبكده حصل التحول من:\n\n**Free Port**\nتجارة + تخزين + إعادة تصدير\n\n←\n\n**Modern Free Zone**\nتصنيع + استثمار + تصدير + وظائف\n\n### مصر دخلت القصة إمتى؟\n\nمصر لم تخترع فكرة المناطق الحرة، لكنها دخلت مبكرًا نسبيًا في تبني **النموذج الحديث** للمناطق الحرة داخل إطار الاستثمار والتصدير. والمهم إن البداية المصرية لم تكن فجأة مع قانون 43 لسنة 1974 فقط؛ توجد إشارات إلى خطوات وتشريعات سابقة في أوائل السبعينيات، من بينها ترتيبات بدأت في **1971 و1972 و1973** لإنشاء وتشجيع المناطق الحرة.\n\nثم جاء **قانون رقم 43 لسنة 1974 بشأن استثمار المال العربي والأجنبي والمناطق الحرة** ليضع الإطار القانوني الحديث بصورة أكثر وضوحًا، في سياق سياسة **الانفتاح الاقتصادي** في عهد الرئيس السادات.\n\nيعني الأدق إننا نقول:\n\n> **قانون 43 لسنة 1974 رسّخ نظام المناطق الحرة الحديث في مصر، لكنه لم يكن أول ظهور للفكرة أو أول خطوة مصرية نحوها.**\n\nوده فرق مهم، لأن الملف الحالي نفسه فيه أمثلة على مناطق أقدم زمنيًا من القانون، مثل منطقة القاهرة التي تأسست سنة 1973.\n\n### خط زمني سريع\n\n**قرون سابقة**\nFree Ports\nتسهيل التجارة والتخزين وإعادة التصدير\n\n←\n\n**1959**\nShannon Free Zone\nأحد أهم النماذج المبكرة للمنطقة الصناعية الحرة الحديثة\n\n←\n\n**أوائل السبعينيات**\nخطوات وتشريعات مصرية أولية للمناطق الحرة\n\n←\n\n**1974**\nقانون 43\nإطار حديث للمناطق الحرة في مصر\n\n←\n\n**1997**\nقانون 8\nضمانات وحوافز الاستثمار\n\n←\n\n**2017**\nقانون 72\nالقانون الحالي\n\n### طيب مين اخترع المناطق الحرة؟\n\nمفيش دولة واحدة نقدر ننسب لها اختراع الفكرة كلها. **Free Port** أقدم بقرون من النظام الحديث، أما **Modern Free Zone** فهي نتيجة تطور تدريجي للفكرة، وكان نموذج Shannon من أهم نقاط التحول في القرن العشرين.\n\nومصر لم تخترع الفكرة، لكنها **كانت من المتبنين المبكرين للنموذج الحديث في المنطقة العربية**، وطورت بعد ذلك نظامها الخاص ضمن سياسات الاستثمار والتصدير.\n\n**المراجع:**\n- [Oxford Academic · تاريخ الموانئ الحرة](https://academic.oup.com/book/6189)\n- [Oireachtas · Overview of Freeports / Free Zones](https://data.oireachtas.ie/ie/oireachtas/libraryResearch/2020/2020-11-27_l-rs-note-overview-of-freeports-or-free-zones_en.pdf)\n- [World Bank · Special Economic Zones](https://documents.worldbank.org/curated/en/343901468330977533/pdf/458690WP0Box331s0april200801PuBlic1.pdf)\n- [UNCTAD · Egypt investment framework](https://unctad.org/system/files/official-document/iteiipmisc.11_en.pdf)\n- [Egyptian National Investment Bank · Laws of Investment and Free Zones](https://www.nib.gov.eg/English/LIBRARY-E/general-laws-e.html)\n\n### قبل قانون 72: كان الأساس القانوني إيه؟\n\nالقانون اللي كان شغال قبل 72 لسنة 2017 مباشرة هو **قانون رقم 8 لسنة 1997** ("قانون ضمانات وحوافز الاستثمار"). وده كان بدوره خلف قانون 43 لسنة 1974، الذي رسّخ الإطار الحديث للمناطق الحرة في مصر.\n\n**ليه قانون 43/1974 بالذات مهم؟** لأنه جاء ضمن سياسة الانفتاح الاقتصادي في السبعينيات، وفتح الباب أمام رأس المال العربي والأجنبي، وربط نظام المناطق الحرة بأهداف جذب الاستثمار، والتصنيع، والتصدير.\n\n43 لسنة 1974\nاستثمار المال العربي والأجنبي والمناطق الحرة\n\n←\n\n230 لسنة 1989\nقانون الاستثمار\n\n←\n\n8 لسنة 1997\nضمانات وحوافز الاستثمار\n\n←\n\n72 لسنة 2017\nالقانون الحالي\n\n### أهم الفروق بين 8/1997 و72/2017\n\n- **الموافقة الواحدة:**\xa0قانون 72 قدّم مبدأ موافقة واحدة تجمع الترخيص وتخصيص الأرض وتصريح البناء لمشروعات معينة، بدل موافقات منفصلة.\n- **الخريطة الاستثمارية:**\xa0أداة إلكترونية جديدة كليًا تعرض الفرص الاستثمارية المتاحة ببياناتها (نفس الخريطة اللي قطاع الترويج بيستخدمها).\n- **حوافز نقدية إضافية:**\xa0قانون 72 (بعد تعديل 2023) أضاف حافز نقدي بنسبة 35% إلى 55% من الضريبة المسددة لأنشطة صناعية معينة في مناطق محددة جغرافيًا.\n- **ضمانات أقوى ضد سحب التراخيص:**\xa0منع صريح لإلغاء أو وقف ترخيص المشروع إلا بعد إنذار المستثمر وسماع وجهة نظره وإدّاله مهلة لإزالة المخالفة.\n\n### الشركات القديمة إيه اللي بيحصلها؟\n\nالشركات اللي كانت قائمة وقت سريان قانون 72 (أُسست تحت قانون 8/1997) محتفظة بمزاياها وإعفاءاتها القديمة لحد ما تنتهي مدتها المقررة أصلًا — مش بتتحول تلقائيًا لأحكام القانون الجديد.\n\n**يعني عمليًا:**\xa0ممكن تلاقي في المنطقة الحرة شركات قديمة لسه شغالة بشروط قانون 1997 جنب شركات جديدة خاضعة لقانون 2017، لحد ما تنتهي مدة مزايا الشركات القديمة.\n\nقانون 72 نفسه اتعدّل أكتر من مرة بعد صدوره — أبرزها تعديل 2019 (تيسيرات إجرائية زي حد أقصى لرسوم توثيق العقود)، وتعديل 2023 اللي أضاف الخريطة الاستثمارية والحوافز النقدية، وسمح بالأنشطة كثيفة الطاقة بموافقة خاصة (تفصيلها في جدول الأنشطة بالأسفل).\n\n**نوعان من المناطق الحرة**\n\n### مناطق حرة عامة\n\nتديرها الهيئة مباشرة وتضم أكثر من مشروع، ومزودة ببنية تحتية متكاملة: طرق، كهرباء، محطات صرف صحي، شبكات مياه وتليفونات، بالإضافة لوحدة جمركية متكاملة، ووحدة شرطة أمن موانئ، ووحدة أمن تعمل على مدار 24 ساعة.\n\nيوجد حاليًا 9 مناطق حرة عامة موزعة على أنحاء الجمهورية.\n\n### مناطق حرة خاصة\n\nكيان مستقل يمثل مشروعًا واحدًا (أو أكثر من مشروع بأنشطة متشابهة)، يقع خارج حدود المناطق العامة على أرض المستثمر نفسه (مملوكة أو مستأجرة) — زي أرض على الطريق الصحراوي، أو ساحات ومخازن كانت أصلًا مستأجرة داخل الميناء (غالبية الشركات اللي حوّلت لمنطقة حرة خاصة كانت شركات ملاحة).\n\n**نفس القانون، موافقات مختلفة:**\xa0نفس الإعفاءات الجمركية والضريبية للمنطقة العامة بالظبط، لكن الموافقة المبدئية من رئيس الوزراء والنهائية من مجلس الوزراء (مش مجلس إدارة الهيئة)، والمساحة والرسوم والشروط أكبر عمومًا.\n\n### فرع منطقة حرة خاصة لشركة عامة\n\nممكن الشركة الأم تكون منطقة حرة عامة (هنا في الإسكندرية مثلًا)، وتفتح فرع منطقة حرة خاصة في أرض تانية — بس نشاط الفرع لازم يكون مشتق من نشاط الشركة الأم، ورأس مال الفرع بيتخصّص من رأس مال الشركة الأم نفسها.\n\n### الأرض من غير تحويل مش معفاة\n\nلو المستثمر أخد أرض برا واستخدمها كمكتب إداري عادي (مش منطقة حرة رسمية)، الأرض دي مالهاش أي إعفاءات جمركية أو ضريبية — لازم يبقى الموقع محول رسميًا لمنطقة حرة عشان الإعفاءات تسري عليه.\n\n**المناطق الحرة العامة التسع**\n\nمهم توضيحها من البداية: المناطق التسع دي كلها غير متخصصة رسميًا. كل منطقة بتضم خليط من المشروعات الصناعية والتخزينية والخدمية جنب بعضها، مش نشاط واحد بس. الاستثناء الوحيد هو مدينة الإنتاج الإعلامي. لكن كل منطقة من التسعة ليها قصة اختيار مختلفة تمامًا عن التانية.\n\n### 1 · الإسكندرية (العامرية)\n\nالأكبر والأعلى تصديرًا بين التسعة بفارق واضح — الأرقام الكاملة (فرص العمل، الاستثمارات، الصادرات) موجودة في مقدمة الملف. والاختيار مش صدفة: مراكز أبحاث اقتصادية مصرية بتوثّق إن فكرة "المنطقة الحرة" في مصر أصلًا ظهرت في الإسكندرية من قرون بعيدة، لما كانت المدينة مركز التجارة الواردة بين أوروبا وآسيا في العصور الوسطى — يعني المدينة بترجع لدورها التاريخي كبوابة تجارة، مش بتبدأ من الصفر. وموقعها بالتحديد في منطقة الكافوري بحي أول العامرية، عند تقاطع طريق القاهرة-الإسكندرية الصحراوي مع طريق الكافوري-برج العرب، وعلى بعد 20 كم بس من ميناء الإسكندرية ومطار النزهة الدولي — يعني قريبة من كل حاجة محتاجاها في نفس الوقت.\n\n416 مشروع · 1353 فدان\n\n### 2 · القاهرة (مدينة نصر)\n\nمن أقدم المناطق (تأسست 1973 — قبل ما يصدر\xa0[قانون الانفتاح الاقتصادي](https://heshvm101.github.io/GAFI/#legal-history)\xa0رقم 43 لسنة 1974 اللي بُني عليه نظام المناطق الحرة الحديث بسنة كاملة)، وموجودة جوه مدينة نصر نفسها اللي بناها عبد الناصر في أواخر الخمسينات كحلم توسع عمراني حديث في الصحراء (والاسم "نصر" تيمنًا بانتصار ثورة يوليو، مش نسبة لعبد الناصر شخصيًا زي ما ناس كتير فاكرة غلط). موقعها تحديدًا خلف جمعية الوفاء والأمل، على بعد 25 كم بس من مطار القاهرة الدولي، بيديها ميزة قربها من مراكز القرار والخدمات المالية والمصرفية. استثماراتها التراكمية تخطّت 7 مليار دولار، وبقت مؤخرًا جاذبة لشركات السوفت وير والذكاء الاصطناعي جنب الصناعات التقليدية، مش بس أرض صناعية كلاسيكية.\n\nتأسست 1973 · $7B استثمارات تراكمية · 25 كم من مطار القاهرة\n\n### 3 · بورسعيد\n\nالقصة هنا أعقد وأشيق من "أقدم منطقة حرة". وأصلًا الحكاية بتبدأ قبل كده بكتير: سنة 1902، الحكومة المصرية وقّعت اتفاق مع شركة قناة السويس وعملت منطقة حرة برية وبحرية ملحقة بالمدينة، غرضها الوحيد خدمة الشركة في توسيع وصيانة الميناء — يعني بورسعيد كانت "منطقة حرة" من أول القرن العشرين، من قبل ما يكون في مصر أصلًا هيئة استثمار أو قانون انفتاح. بعد كده بورسعيد شافت شكلين مختلفين من "الحرية الجمركية": الأول "مدينة حرة" كاملة (المدينة كلها معفاة، مش بس منطقة داخلها) بقرار من يناير 1976، وده خلق طفرة تسوق ضخمة (ناس من كل مصر بتيجي تشتري بضاعة مستوردة معفاة من الجمارك) استمرت لحد ما القانون رقم 5 لسنة 2002 ألغى وضع "المدينة الحرة" بالكامل بسبب أضرار اقتصادية واتهامات بتهريب البضائع. الشكل التاني هو "المنطقة الحرة العامة" الفعلية (800 ألف م² تقريبًا 190 فدان، بقرار من يوليو 1975 في منطقة الرسوة الصناعية) وهي اللي فضلت شغالة واتحولت بمرور الوقت من مدينة استيراد لمدينة تصنيع وتصدير — النهاردة بتوفر لوحدها حوالي 35-40% من صادرات مصر من الملابس الجاهزة.\n\nأول منطقة حرة في مصر (1902) · المنطقة الحالية 1975 · \\~83 مصنع · \\~30 ألف عامل\n\n### 4 · السويس (الأدبية / بورتوفيق / عتاقة)\n\n3 مواقع بمحافظة السويس، وموقعها مش بس قريب من ميناء العين السخنة، هي تاريخيًا نقطة انطلاق قافلة الحج المصري للأراضي الحجازية لقرون طويلة، يعني المحافظة كلها اتعودت من الأساس إنها ممر عبور استراتيجي. وفيه ميزة أقل شهرة: جبل عتاقة القريب من المنطقة غني بخامات الرمال والسيليكا اللي بتدخل في صناعة الزجاج والإلكترونيات الدقيقة — يعني في بعض الحالات المصنع مش بس قريب من الميناء، هو قريب من خامته الأساسية كمان. وكل موقع من المواقع التلاتة له دور مختلف عمليًا: بورتوفيق قريب من قلب المدينة، الأدبية بميناء بحري بيستقبل ويفرّغ البضائع مباشرة، وعتاقة الأقرب لميناء العين السخنة نفسه.\n\n3 مواقع · جنب ميناء العين السخنة · خامات سيليكا محلية\n\n### 5 · الإسماعيلية\n\nالمدينة نفسها اتبنت سنة 1862 كمقر لشركة قناة السويس، وسُمّيت باسم الخديوي إسماعيل، ولسه لحد النهاردة المقر الرئيسي لهيئة قناة السويس نفسها موجود فيها — يعني المنطقة الحرة مش بس "في المنتصف جغرافيًا" بين بورسعيد والسويس، هي حرفيًا قريبة من مركز القرار الإداري لقناة السويس كلها. شهدت موجة استثمارات حديثة (2024-2025) من شركات صينية وتركية في المنسوجات والملابس الجاهزة وملابس الحماية الرياضية.\n\n9 شركات جديدة (2025) · $41.6M استثمارات · 16 ألف فرصة عمل\n\n### 6 · دمياط\n\nالميناء نفسه من أقدم موانئ مصر — آثار فرعونية اتلاقت فيه منقولة دلوقتي لمتحف اللوفر في باريس، وكان الميناء الأهم في مصر قبل الإسكندرية لحد سقوط عكا في القرن الـ14 اللي غيّر مسارات التجارة العالمية لصالح الإسكندرية. الميناء الحديث اتفتح 1986، والمنطقة الحرة (1998) جنب صناعة الأثاث الحرفي اللي دمياط مشهورة بيها قوميًا وعالميًا (فيه مشروع قومي منفصل اسمه "مدينة دمياط للأثاث" في نفس المحافظة، مش بالضرورة نفس كيان المنطقة الحرة). استثماراتها موزعة على 5 جنسيات مختلفة (عربية، أوروبية، آسيوية، مصرية، أمريكية-أسترالية) بنسب متقاربة، صورة نادرة للتنوع الحقيقي في مصدر رأس المال.\n\nتأسست 1998 · 190 فدان · بوابة مباشرة على الميناء\n\n### 7 · شبين الكوم (المنوفية)\n\nعكس الانطباع الأول تمامًا — دي مش منطقة مهمّشة، دي منطقة ناجحة لدرجة إنها امتلأت بالكامل. المنطقة مبنية جنب أرض شركة "مصر شبين الكوم للغزل والنسيج" التاريخية، وفي 2022 مجلس الوزراء وافق على ضم قطعة أرض إضافية (65,186 م² تقريبًا 15.5 فدان) من أراضي الشركة نفسها للتوسع، بعد ما وصلت المنطقة لإشغال كامل المساحات المتاحة. التوسعة دي لوحدها كانت لـ11 مشروع تصديري جديد باستثمارات 20 مليون دولار و1500 فرصة عمل.\n\nإشغال كامل (2022) · +15.5 فدان توسعة · $20M لـ11 مشروع جديد\n\n### 8 · مدينة الإنتاج الإعلامي (6 أكتوبر)\n\nالمنطقة الوحيدة من التسعة المتخصصة رسميًا، ودي أغرب حكاية في الملف كله. الفكرة طلعت من وزير الإعلام الأسبق صفوت الشريف بعد نجاح قطاع الإنتاج بماسبيرو، والشركة اتأسست 1997 على مساحة مليوني متر مربع (10 كم بس من الأهرامات)، ولقّبوها "هوليوود الشرق" باعتبارها أكبر كيان إعلامي وإنتاجي في الشرق الأوسط. الأغرب: المدينة فيها ديكورات دائمة لأحياء مصرية حقيقية معاد بناؤها بالكامل — شارع عماد الدين التاريخي (المكان اللي "اتولدت" فيه السينما والمسرح المصري في العشرينات) اتبنى من جديد في 59 يوم بس، وفيه كمان حي جاردن سيتي بقصوره وفيلاته، وشارع بطراز الإسكندرية القديمة بترام كهربائي شغال وواجهات أوروبية، وحي بمستوى الدقي الراقي. المدينة كمان فيها 3 بحيرات صناعية ومنطقة أمواج صناعية للمشاهد المائية، و6 مجمعات إنتاج ضخمة، وأول معمل دولبي للصوت المحيطي بجودة عالمية في الشرق الأوسط.\n\nتأسست 1997 · 2 مليون م² · التخصص الرسمي الوحيد\n\n### 9 · قنا (قفط)\n\nالمنطقة الوحيدة من التسعة في صعيد مصر، لكن الاختيار مش عشوائي خالص. قفط بالذات كانت من آلاف السنين مركز عبادة الإله "مين" — حامي طرق التجارة والمحاجر عند المصريين القدماء — وكانت بوابة القوافل التجارية المتجهة لموانئ البحر الأحمر وبعثات التعدين في الصحراء الشرقية. في العصر البيزنطي اتسمت "جستنيانوبوليس"، وفي العصور الإسلامية الوسطى فضلت من أهم مراكز التجارة مع الهند. يعني الهيئة لما اختارت قفط لتكون بوابة الصعيد الصناعية الحديثة، هي عمليًا بتكمل دور المدينة كمحطة تجارة شرقية عمرها آلاف السنين، مش بتخترع دور جديد ليها.\n\nالوحيدة في الصعيد · مركز تجاري منذ العصر الفرعوني\n\n**الإعفاءات الممنوحة للمشروع**\n\n- **✓**\n\n  إعفاء الأصول الرأسمالية ومستلزمات الإنتاج (عدا سيارات الركوب) من الجمارك وضريبة القيمة المضافة، طوال فترة مزاولة النشاط.\n- **✓**\n\n  إعفاء صادرات وواردات المشروع من وإلى خارج البلاد من أي رسوم جمركية أو ضريبية.\n- **✓**\n\n  عدم خضوع المشروع وأرباحه لقوانين الضرائب أو الجمارك المعمول بها داخل البلاد، طوال فترة مزاولة النشاط.\n- **✓**\n\n  إعفاء واردات المشروع من السوق المحلي من ضريبة القيمة المضافة.\n- **✓**\n\n  إعفاء بضائع الترانزيت المحددة الوجهة من أي رسوم، بشرط أن يكون المشروع داخل الدائرة الجمركية وأن تكون الوجهة النهائية محددة بـ[بوليصة الشحن](https://heshvm101.github.io/GAFI/#procedures-bill-of-lading)\xa0والفاتورة.\n- **✓**\n\n  إعفاء المكوّن المحلي من السلع المصنَّعة في المنطقة الحرة من الرسوم الجمركية عند بيعها للسوق المحلي.\n\n**الضمانات القانونية للمشروع**\n\n- **⚖**\n\n  لا يجوز رفع دعوى قضائية ضد مشروعات المناطق الحرة إلا بعد الرجوع إلى الهيئة أولًا.\n- **⚖**\n\n  لا يجوز تأميم المشروعات والمنشآت أو مصادرتها.\n- **⚖**\n\n  لا يجوز بالطريق الإداري فرض الحراسة على المشروعات، أو الحجز على أموالها، أو الاستيلاء عليها، أو تجميدها، أو مصادرتها إلا بحكم قضائي.\n\n**ميزة الجهة الإدارية الواحدة**\n\nأهم ميزة عملية للمنطقة الحرة إن الشركة بتتعامل مع جهة واحدة بس، هي إدارة المنطقة الحرة، وهي اللي بتتولى: إصدار كل الموافقات اللازمة لإقامة المشروع، إصدار ترخيص مزاولة النشاط (اللي بيغني عن القيد في السجل الصناعي)، تسليم الأرض واعتماد تراخيص البناء فور تقديم الطلب، إتمام كل إجراءات دخول وخروج البضائع عبر إقرارات الوارد والصادر، وصولًا لإجراءات تصفية المشروع لو الشركة قررت إنهاء نشاطها.\n\n**البيئة شرط أساسي، مش إجراء شكلي**\n\nقرار المزاولة مايصدرش أبدًا من غير موافقة جهاز شؤون البيئة. المستثمر بيعمل دراسة بيئية (شبيهة بدراسة الجدوى بس مركّزة على البيئة) عن طريق مكتب معتمد، ويقدّمها لجهاز شؤون البيئة مع خريطة الأنشطة المحيطة بالموقع — والجهاز بيرفض أو يوافق حتى لو مصنع المستثمر نفسه مطابق لكل الاشتراطات، وده لأن الهيئة مش بتوزّع الأنشطة على مناطق منفصلة (مفيش "شارع كيماويات" و"شارع أغذية")، فاختيار الأرض بيحمل مخاطرة بيئية من الجيران مش بيد المستثمر.\n\n**مثال واقعي:**\xa0مشروع بتمويل من بنك أوروبي بمهلة سداد محددة، اتعطّل بسبب رفض جهاز شؤون البيئة رغم إن المبنى كان بمواصفات أوروبية عالية، لأن الأرض المجاورة كانت لشركات بترول وكيماويات. المهلة انتهت قبل ما توافق البيئة، فاضطر المستثمر يصفّي المشروع رغم الاستثمارات الكبيرة اللي كان دخلها فيه.\n\n05\n\n## السياق الاقتصادي والاستراتيجي\n\nبعد ما شوفنا المشروع من جوه، نطلع خطوة لورا ونسأل سؤال أكبر: **ليه الدولة أصلًا مصممة النظام ده؟ وإيه اللي بتاخده مصر مقابله؟** هنا بنربط الرسوم والمزايا بالمشهد الاقتصادي كله.\n\n### ليه بعض الرسوم زادت بعد قانون 72؟\n\nالفكرة مش إن الدولة عايزة تلغي ميزة المنطقة الحرة، لكن إنها تحاول توازن بين حاجتين:\n\n- الحفاظ على قدرة النظام على جذب الاستثمار.\n- حصول الدولة على عائد مناسب مقابل الخدمات والمزايا التي يقدمها النظام.\n\nلذلك، أي تعديل في الرسوم لازم يتفهم داخل السؤال الأكبر: **قد إيه الدولة مستعدة تمنح حوافز عشان تجذب الاستثمار والتصدير، وقد إيه عائدها لازم يغطي تكلفة النظام؟**\n\n### ليه الدولة لسه متمسكة بالمناطق الحرة؟\n\nلو النظام فيه إعفاءات ومزايا، طبيعي تسأل: **مصر بتكسب إيه؟**\n\nالإجابة مش رقم واحد، وإنما مجموعة من النتائج بتشتغل مع بعض:\n\n- جذب استثمارات محلية وأجنبية.\n- دعم الإنتاج والتصدير.\n- توفير فرص عمل.\n- إدخال عملة أجنبية من النشاط التصديري.\n- توطين جزء من القيمة المضافة داخل مصر.\n\nبحسب GAFI، المناطق الحرة تساهم بحوالي **22% من إجمالي الصادرات السلعية المصرية**، وده بيوضح إن النظام له وزن فعلي في منظومة التصدير، مش مجرد ميزة قانونية على الورق.\n\n### مصادر العملة الأجنبية في مصر\n\nقبل ما نقول إن المنطقة الحرة "بتدخل دولار"، لازم نشوف الدولار بيدخل مصر منين أصلًا.\n\nفي **FY 2024/2025**، أظهر توزيع متحصلات الحساب الجاري أن أكبر البنود كانت:\n\n| **الترتيب** | **المصدر** | **النسبة من متحصلات الحساب الجاري** | **القيمة** |\n|---|---|---:|---:|\n| **1** | **التحويلات الخاصة، وأهمها تحويلات المصريين بالخارج** | **32.5%** | **$36.5B** |\n| **2** | **الصادرات غير البترولية** | **31.0%** | **$34.6B** |\n| **3** | **السياحة (Travel)** | **15.0%** | **$16.7B** |\n| **4** | **النقل (Transportation)** | **8.4%** | **$9.4B** |\n| **5** | **الصادرات البترولية** | **5.0%** | **$5.6B** |\n| **6** | **إيرادات أخرى** | **4.6%** | **$5.2B** |\n| **7** | **إيرادات الاستثمار** | **2.6%** | **$2.9B** |\n| **8** | **الخدمات الحكومية** | **0.7%** | **$0.8B** |\n\n**المصدر:** وزارة المالية اعتمادًا على بيانات البنك المركزي المصري. النسب هنا تخص **متحصلات الحساب الجاري**، وليست ترتيبًا لكل التدفقات المالية الداخلة إلى مصر؛ فالـ FDI مثلًا يظهر في الحساب الرأسمالي والمالي.\n\nمصادر:\n- [وزارة المالية · Financial Monthly Report October 2025](https://assets.mof.gov.eg/files/a3d91bb0-cb67-11f0-af07-2d8d741b250f.pdf)\n- [البنك المركزي المصري · Balance of Payments FY 2024/2025](https://www.cbe.org.eg/ar/news-publications/news/2025/10/07/17/35/bop-fy-2024-2025)\n\n### طب وقناة السويس فين؟\n\nهنا مثال مهم على طريقة قراءة الإحصاءات.\n\nقناة السويس مش بند منفصل في الجدول السابق، لكنها داخلة تحت **Transportation**. وفي FY 2024/2025 بلغت متحصلات النقل نحو **$9.4B**، منها حوالي **$3.6B لقناة السويس**.\n\nيعني الإحصاءات أحيانًا بتجمع نشاطًا كبيرًا داخل بند أوسع منه.\n\n**وده بالضبط اللي بيحصل مع المناطق الحرة.**\n\n### طيب المناطق الحرة مكانها فين؟\n\nهنا المفاجأة:\n\n**المناطق الحرة مش مصدر مستقل للعملة الأجنبية جنب الصادرات والسياحة والتحويلات.**\n\nهي **آلية بتقوّي أكثر من قناة في نفس الوقت، وعلى رأسها الصادرات والاستثمار.**\n\nالقصة ببساطة:\n\n**Free Zone**\n\n↓\n\n**إنتاج / تخزين / خدمة**\n\n↓\n\n**تصدير**\n\n↓\n\n**Export Proceeds**\n\n↓\n\n**عملة أجنبية**\n\nوفي مسار آخر:\n\n**Free Zone**\n\n↓\n\n**بيئة استثمارية وحوافز**\n\n↓\n\n**مستثمر أجنبي**\n\n↓\n\n**FDI**\n\nعشان كده لما حد يعمل قائمة بـ"مصادر الدولار في مصر"، غالبًا هتلاقي **الصادرات**، ومش هتلاقي **المناطق الحرة** كبند مستقل. الإحصاءات القومية بتسجل نتيجة المعاملة، وليس المكان أو النظام الذي تمت من خلاله.\n\n### المناطق الحرة والصادرات\n\nدي أهم علاقة لازم تثبت:\n\n> **Free Zones → Export Production → Foreign Currency**\n\nبحسب GAFI، تساهم المناطق الحرة بحوالي **22% من إجمالي الصادرات السلعية المصرية**. وفي صفحة أخرى عن المناطق الحرة المستهدفة، تستخدم الهيئة مقياسًا مختلفًا وتذكر مساهمة تصل إلى **25% من الصادرات الصناعية غير البترولية**؛ والفرق هنا سببه اختلاف المقام، لذلك لازم ما نخلطش الرقمين مع بعض.\n\nمصادر:\n- [GAFI · World Free Zones Organization Congress](https://www.gafi.gov.eg/English/MediaCenter/News/Pages/The-11th-World-Free-Zones-Organization-Global-Annual-Congress.aspx)\n- [GAFI · New Targeted Free Zones](https://www.gafi.gov.eg/English/StartaBusiness/InvestmentZones/Pages/NewTargetedFreeZones.aspx)\n\n**مهم:** لا تتعامل مع 22% على أنها "22% من كل العملة الأجنبية التي تدخل مصر"؛ هي نسبة من الصادرات السلعية تحديدًا.\n\n### ليه محدش بيتكلم عن المناطق الحرة لما يقول "مصادر الدولار"؟\n\nلأن السؤالين مختلفين:\n\n**مين بيدخل العملة الأجنبية؟**\n\nإجابته: الصادرات، السياحة، التحويلات، النقل، وغيرها.\n\n**إيه النظام أو المكان اللي ساعد النشاط ده يحصل؟**\n\nهنا ممكن تكون الإجابة: المنطقة الحرة.\n\nيعني المنطقة الحرة **مش بند جديد في الجدول، لكنها جزء من بعض البنود الموجودة أصلًا.**\n\n### مثال سريع\n\nمصنع ملابس داخل المنطقة الحرة:\n\n**خامات من الخارج**\n\n←\n\n**تصنيع داخل مصر**\n\n←\n\n**تصدير لأوروبا**\n\n←\n\n**إيراد أجنبي**\n\nالمصنع هنا لم "يخلق مصدرًا تاسعًا" للعملة الأجنبية. هو **ساهم في بند الصادرات**، وفي نفس الوقت خلق قيمة مضافة وفرص عمل وجذب استثمار.\n\n### أهمية المنطقة الحرة بالإسكندرية\n\nالمنطقة الحرة العامة بالإسكندرية في العامرية تضم **416 مشروعًا** باستثمارات تتجاوز **$14.7B**، وتوفر نحو **55 ألف فرصة عمل**، وسجلت مشروعاتها صادرات سلعية بقيمة **$5.3B في 2025**.\n\nمصدر: [GAFI · Alexandria Public Free Zone, 26 June 2026](https://www.gafi.gov.eg/Arabic/MediaCenter/News/Pages/%D9%88%D8%B2%D9%8A%D8%B1-%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%AB%D9%85%D8%A7%D8%B1-%D9%8A%D8%AA%D9%81%D9%82%D8%AF-%D8%B9%D8%AF%D8%AF-%D8%A7%D9%84%D9%85%D8%B4%D8%B1%D9%88%D8%B9%D8%A7%D8%AA-%D8%A7%D9%84%D8%B5%D9%86%D8%A7%D8%B9%D9%8A%D8%A9-%D8%AA%D9%88%D9%81%D8%B1-%D8%A2%D9%84%D8%A7%D9%81-%D9%81%D8%B1%D8%B5-%D8%A7%D9%84%D8%B9%D9%85%D9%84.aspx)\n\nوده يخلي الإسكندرية مثالًا عمليًا ممتازًا لفهم الفكرة كلها:\n\n**استثمار**\n\n↓\n\n**مشروعات**\n\n↓\n\n**إنتاج وخدمات**\n\n↓\n\n**تصدير**\n\n↓\n\n**عملة أجنبية + وظائف + قيمة مضافة**\n\n06\n\n## حالات عملية\n\nCase Studies · هنا بنرجع لكل اللي اتعلمناه، لكن بدل ما نشوفه كمعلومات منفصلة، هنشوفه وهو بيحصل **لشركة حقيقية في سيناريو واحد متصل**.\n\n**حالة 1 · مشروع تقريبًا جاهز... لكن الأرض نفسها أسقطته**\n\nتخيل مستثمر خلّص التمويل، بدأ التنفيذ، وبنى مبنى مطابقًا لمواصفات عالية. ظاهريًا كل شيء ماشي. لكن فيه اختبار واحد لم ينتهِ بعد: البيئة.\n\nتمويل بنكي بمهلة محددة\n\n←\n\nبناء مطابق لأعلى المواصفات\n\n←\n\nتقديم الدراسة البيئية\n\n←\n\nرفض جهاز شؤون البيئة\n\n←\n\nانتهاء المهلة البنكية\n\n←\n\nتصفية إجبارية\n\nالسبب الحقيقي للرفض: الأرض المجاورة كانت لشركات بترول وكيماويات، ومصنع المستثمر نفسه ملوش دخل بده — لأن الهيئة مش بتوزّع الأنشطة على مناطق منفصلة (مفيش "شارع كيماويات" و"شارع أغذية")، فاختيار قطعة الأرض بيحمل مخاطرة بيئية من الجيران، مش من نشاط المستثمر نفسه. راجع\xa0["البيئة شرط أساسي"](https://heshvm101.github.io/GAFI/#legal-environment)\xa0للتفاصيل.\n\n**الدرس المستفاد:** أكبر غلطة هنا إن المستثمر شاف الأرض كمجرد قطعة أرض، بينما الهيئة والبيئة بيشوفوها **جزءًا من بيئة صناعية كاملة**. لذلك الموافقة البيئية مش خطوة شكلية تتعمل في آخر الطريق، بل مخاطرة لازم تتحسب قبل ما المستثمر يربط نفسه بتمويل أو التزام زمني.\n\n**حالة 2 · نفس قيمة البضاعة... لكن فاتورة الهيئة مختلفة**\n\nاتخيل شركتين دخل عند كل واحدة منهما بضاعة بنفس القيمة تقريبًا. من الخارج، العملية شكلها متشابه. لكن واحدة صنعت، والثانية خزنت فقط. هنا نوع النشاط يغيّر أساس حساب الرسم الجاري بالكامل (راجع\xa0[FOB وCIF](https://heshvm101.github.io/GAFI/#procedures-incoterms)\xa0و[الرسم الجاري](https://heshvm101.github.io/GAFI/#procedures-fees)).\n\n| **العنصرشركة أ (صناعي)شركة ب (تخزيني)** |                                                |                                                          |\n| --------------------------------------- | ---------------------------------------------- | -------------------------------------------------------- |\n| **النشاط**                              | استوردت خامات قماش، صنّعت ملابس جاهزة، صدّرتها | استوردت بضاعة جاهزة، خزّنتها، أعادت تصديرها من غير تغيير |\n| **أساس حساب الرسم**                     | FOB · قيمة الصادرات وقت التصدير                | CIF · قيمة البضاعة الواردة وقت الدخول                    |\n| **نسبة الرسم الجاري**                   | 1%                                             | 2%                                                       |\n| **وقت التحصيل**                         | وقت التصدير (بعد إضافة القيمة بالتصنيع)        | وقت دخول البضاعة (قبل أي حركة تانية)                     |\n\n**الدرس المستفاد:** النسبة الأعلى في المشروع التخزيني مش معناها إن الهيئة "بتعاقب" التخزين. الفكرة إن نوع النشاط نفسه مختلف، وبالتالي **أساس الحساب وتوقيت التحصيل** مختلفان.\n\n**حالة 3 · المصنع قفل... لكن الملف لسه مفتوح**\n\nشركة قررت إنهاء نشاطها اختياريًا بعد ما استقر السوق على عدم جدوى الاستمرار. هنا المستثمر ممكن يتخيل إن آخر خطوة هي قفل المصنع، لكن قانونيًا القصة لسه ما خلصتش. الخطوات دي ملخصة من فصل\xa0[تصفية المشروع](https://heshvm101.github.io/GAFI/#research-liquidation)\xa0بالكامل.\n\n**جمعية الشركاء بتقرر التصفية وتعيّن مصفٍّ قانوني**\n\nالشركاء\n\n**المصفي يستخرج براءات ذمة من الهيئة والجمارك والضرائب والكهرباء والمياه**\n\nالمصفي القانوني\n\n**نشر إعلان التصفية في جريدتين رسميتين + صحيفة الاستثمار**\n\nالمصفي القانوني\n\n**إعداد ميزانية التصفية ومحضر الجمعية العمومية النهائي**\n\nالمصفي القانوني\n\n**صدور قرار الإلغاء (يلغي قرار المزاولة وكل تعديلاته دفعة واحدة)**\n\n2.1 البحوث والتراخيص\n\n**شطب الشركة من السجل التجاري**\n\nالسجل التجاري\n\n**استرداد خطاب الضمان — آخر خطوة في المسار كله**\n\nخطاب الضمان\n\n**الدرس المستفاد:**\xa0استرداد خطاب الضمان بيجي بعد الشطب من السجل التجاري مباشرة، مش قبله — وده اللي بيخلي حتى الشركات المتعثرة تفضّل تكمّل إجراءات التصفية الرسمية بدل ما تسيب المشروع من غير تصفية.\n\n07\n\n## المرجع السريع\n\nلو وصلت هنا ووقفت قدام كلمة زي FOB أو مقابل الضمان أو قرار المزاولة، ما ترجعش تدور في الفصول. **المرجع السريع معمول بالضبط عشان يرجّعك للمعلومة في ثواني.**\n\n**مسرد المصطلحات**\n\n| **المصطلحمعناه**                                          |
