                                                                                                     |\n| --------------------------------------------------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Application / طلب إقامة المشروع**                       | أول نموذج بيقدّمه المستثمر لبدء أي إجراء — قبله المشروع مجرد طلب، مش كيان معتمد                                                                                                                                       |\n| **الموافقة المبدئية (Preliminary Approval)**              | موافقة أولية بعد مراجعة اللجنة الفنية، قبل استكمال الشروط                                                                                                                                                             |\n| **الموافقة النهائية = قرار المزاولة (Operating License)** | نفس المستند بالظبط — القرار الرسمي اللي بيسمح للمشروع يبدأ نشاطه، صلاحيته 6 شهور                                                                                                                                      |\n| **عقد التأسيس (Articles of Association)**                 | العقد اللي بيحدد هيكل الشركة: الشركاء، رأس المال، الإدارة، مكان انعقاد الجمعية                                                                                                                                        |\n| **شهادة التأسيس (Certificate of Incorporation)**          | شهادة رسمية بتصدر مع عقد التأسيس تثبت قيام الشركة                                                                                                                                                                     |\n| **السجل التجاري (Commercial Register)**                   | التسجيل الرسمي للشركة؛ بيتحدّث كل ما يتغير قرار المزاولة أو عقد التأسيس                                                                                                                                               |\n| **اللجنة الفنية (Technical Committee)**                   | اللجنة في القاهرة اللي بتراجع الطلبات وتوصي بالموافقة أو الرفض                                                                                                                                                        |\n| **المصفي القانوني (Legal Liquidator)**                    | الشخص اللي بيتولى كل إجراءات تصفية الشركة بدل الشركاء بعد تعيينه                                                                                                                                                      |\n| **خطاب الضمان (Letter of Guarantee)**                     | ضمان مالي (1% صناعي / 2% تخزيني من التكاليف الاستثمارية) يفضل طول عمر المشروع، مش رسم بيتحصّل ويخلص                                                                                                                   |\n| **مقابل الضمان (Guarantee Fee)**                          | رسم صغير (1‰ من قيمة وثيقة التأمين) — مختلف تمامًا عن خطاب الضمان                                                                                                                                                     |\n| **مجمع خدمات الاستثمار (Investment Services Complex)**    | الجهة اللي بتتم فيها إجراءات تأسيس الشركة رسميًا (سجل تجاري، بطاقة ضريبية، عقد الشركة) بعد الموافقة المبدئية                                                                                                          |\n| **FOB (Free On Board)**                                   | البائع مسؤول لحد تحميل البضاعة على السفينة بس؛ المشتري يدفع الشحن والتأمين — التفاصيل في فصل التنفيذ                                                                                                                  |\n| **CIF (Cost, Insurance & Freight)**                       | البائع مسؤول عن البضاعة + الشحن + التأمين لحد ميناء الوصول — التفاصيل في فصل التنفيذ                                                                                                                                  |\n| **إقرار وارد (Import Declaration)**                       | إعلان رسمي من الشركة بالأصناف والكميات اللي عايزة تستوردها، أول مستند في أي عملية استيراد                                                                                                                             |\n| **الهالك (Wastage / Scrap Rate)**                         | نسبة الفقد الطبيعي أثناء التصنيع (خامة بتتحول لمخلفات مش منتج نهائي)؛ الجهات الرقابية المختصة بتحدد "معامل هالك" ثابت لكل نشاط، وعليه بيتحسب الجمرك المستحق أو المسترد. تجاوز النسبة المحددة بيستدعي مراجعة من الهيئة |\n| **مقابل الانتفاع (Usufruct Fee)**                         | إيجار الأرض أو المبنى، سعر ثابت لكل متر مربع بيتحصّل سنويًا طوال فترة الانتفاع — أول رسم بيبدأ بعد الموافقة المبدئية مباشرة                                                                                           |\n| **مقابل الخدمات السنوي (Annual Service Fee)**             | نسبة من رأس المال المصدر للشركة (مش من رأس المال المصرح به)، بحد أقصى سنوي يتجدد كل سنة حسب سعر الصرف. المستحق فعليًا هو الأقل بين القيمة المحسوبة والحد الأقصى                                                       |\n| **الرسم الجاري (Running Fee)**                            | نسبة بتتحصّل حسب نوع المشروع: 1% صناعي (على أساس FOB وقت التصدير)، 2% تخزيني (على أساس CIF وقت الدخول)، 1% خدمي (على الإيراد السنوي كامل)                                                                             |\n| **بوليصة الشحن (Bill of Lading)**                         | وثيقة من شركة الشحن، أول مستند في مسار الاستيراد؛ بتلعب 3 أدوار: إيصال استلام البضاعة، عقد نقل، ووثيقة ملكية قابلة للتداول                                                                                            |\n| **براءة الذمة (Clearance Certificate)**                   | إثبات رسمي من جهة معينة (الهيئة، الجمارك، الضرائب، الكهرباء، المياه) إن مفيش أي التزامات مالية مستحقة على الشركة تجاهها — مطلوبة قبل تصفية أي مشروع                                                                   |\n| **شهادة عدم الالتباس (Name Reservation Certificate)**     | بتحجز اسم الشركة لمدة 15 يوم قبل التأسيس؛ لو المدة خلصت من غير استكمال الإجراءات، لازم تُستخرج شهادة جديدة                                                                                                            |\n| **الوكيل الحصري (Exclusive Agent)**                       | شركة داخل المنطقة الحرة بتوزّع منتج معين حصريًا في سوق أو أكتر (مصر، شمال أفريقيا، أوروبا، غرب آسيا) من غير ما تكون هي المصنّعة الأصلية له                                                                            |\n| **المعاينة الثلاثية (Tripartite Inspection)**             | لجنة من 3 أطراف (موظف تنفيذ، موظف جمارك، مندوب الشركة) بتتأكد قبل دخول أو خروج أي بضاعة إنها مطابقة تمامًا للمستندات المقدَّمة                                                                                        |\n| **الرصيد لدى الهيئة (Deposit Balance)**                   | مبلغ مقدّم بيحطه المستثمر عند الهيئة، وبيتخصم منه أول بأول أي رسم متكرر (زي مقابل الضمان أو رسوم الإقرارات) بدل ما يدفع كل مرة لوحده                                                                                  |\n| **الانفتاح الاقتصادي (Open Door Policy)**                 | سياسة أطلقها السادات بقانون 43 لسنة 1974، فتحت الاقتصاد المصري قدام رأس المال العربي والأجنبي بعد سنين من التأميم والاقتصاد المغلق. عليها بُني نظام المناطق الحرة الحديث من الأساس                                    |\n| **المدينة الحرة (Free City — تختلف عن المنطقة الحرة)**    | وضع استثنائي كان لبورسعيد بس (1976-2002)، المدينة كلها معفاة من الجمارك مش منطقة داخلها بس. اتلغى بقانون 5 لسنة 2002. مختلف تمامًا عن "المنطقة الحرة" اللي الملف ده بيتكلم عنها                                       |\n\n**الجدول الشامل للرسوم**\n\n| **الرسمالنسبة / القيمةأساس الحسابوقت الاستحقاق** |                                                              |                                                        |                                         |\n| ------------------------------------------------ | ------------------------------------------------------------ | - const CONTENT_URL = null;
const content = document.getElementById("content");
const toc = document.getElementById("toc");
const searchInput = document.getElementById("searchInput");
const searchPanel = document.getElementById("searchPanel");
const searchResults = document.getElementById("searchResults");
const readingProgress = document.getElementById("readingProgress");
const readingPercent = document.getElementById("readingPercent");
const sidebar = document.getElementById("sidebar");

marked.setOptions({
  gfm: true,
  breaks: true,
  headerIds: true,
  mangle: false
});

function slugify(text) {
  return text.toLowerCase()
    .trim()
    .replace(/\s+/g, "-")
    .replace(/[^\u0600-\u06FFa-z0-9\-_]+/gi, "")
    .replace(/-+/g, "-");
}

function enhanceHeadings() {
  const headings = [...content.querySelectorAll("h1, h2, h3, h4")];
  const seen = new Map();
  headings.forEach((heading) => {
    let base = slugify(heading.textContent) || "section";
    const count = seen.get(base) || 0;
    seen.set(base, count + 1);
    heading.id = count ? `${base}-${count + 1}` : base;
  });
  return headings;
}

function buildToc(headings) {
  toc.innerHTML = "";
  headings.forEach((heading) => {
    const link = document.createElement("a");
    link.href = `#${heading.id}`;
    link.className = `toc-link toc-${heading.tagName.toLowerCase()}`;
    link.textContent = heading.textContent.trim();
    link.addEventListener("click", () => sidebar.classList.remove("open"));
    toc.appendChild(link);
  });
}

function decorateContent() {
  [...content.querySelectorAll("h2")].forEach((h) => {
    const title = h.textContent.trim();
    if (title.includes("تاريخ المناطق الحرة")) {
      const note = document.createElement("div");
      note.className = "callout";
      note.innerHTML = "<strong>الفكرة الأساسية:</strong> النظام لم يظهر مرة واحدة. تطور من موانئ حرة هدفها التجارة والتخزين، إلى مناطق صناعية حديثة تربط الاستثمار بالإنتاج والتصدير.";
      h.after(note);
    }
  });
}

function updateProgress() {
  const doc = document.documentElement;
  const scrollable = doc.scrollHeight - window.innerHeight;
  const pct = scrollable > 0 ? Math.min(100, Math.max(0, (window.scrollY / scrollable) * 100)) : 0;
  readingProgress.style.width = `${pct}%`;
  readingPercent.textContent = `${Math.round(pct)}%`;
}

function updateActiveToc() {
  const items = [...document.querySelectorAll("#toc a")];
  const headings = [...content.querySelectorAll("h1, h2, h3, h4")];
  let activeId = "";
  for (const heading of headings) {
    if (heading.getBoundingClientRect().top <= 130) activeId = heading.id;
  }
  items.forEach((item) => item.classList.toggle("active", item.getAttribute("href") === `#${activeId}`));
}

function normalizeSearchText(text) {
  return text.toLowerCase().replace(/[إأآا]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");
}

function search(query) {
  const q = normalizeSearchText(query.trim());
  if (!q || q.length < 2) {
    searchPanel.classList.remove("open");
    return;
  }

  const blocks = [...content.querySelectorAll("h1, h2, h3, h4, p, li")];
  const seen = new Set();
  const hits = [];

  for (const el of blocks) {
    const text = el.textContent.trim();
    const normalized = normalizeSearchText(text);
    if (!normalized.includes(q)) continue;

    const heading = el.closest("section")?.querySelector("h1, h2, h3, h4") ||
      (el.matches("h1, h2, h3, h4") ? el : null);
    const id = heading?.id || el.id;
    if (!id || seen.has(id)) continue;
    seen.add(id);

    const idx = normalized.indexOf(q);
    const start = Math.max(0, idx - 90);
    const raw = text.slice(start, start + 220);
    hits.push({ id, title: heading?.textContent?.trim() || text.slice(0, 80), excerpt: raw });
    if (hits.length >= 14) break;
  }

  searchPanel.classList.add("open");
  searchPanel.setAttribute("aria-hidden", "false");
  searchResults.innerHTML = hits.length
    ? hits.map(hit => `<div class="search-result" data-target="${CSS.escape(hit.id)}"><h3>${escapeHtml(hit.title)}</h3><p>${escapeHtml(hit.excerpt)}...</p></div>`).join("")
    : `<div class="search-result"><p>مفيش نتائج مطابقة.</p></div>`;

  searchResults.querySelectorAll(".search-result[data-target]").forEach((item) => {
    item.addEventListener("click", () => {
      document.getElementById(item.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" });
      searchPanel.classList.remove("open");
    });
  });
}

function escapeHtml(value) {
  return value.replace(/[&<>'"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch]));
}

## الأساسيات: الهيئة ونظام المنطقة الحرة

قبل ما ندخل في لجنة فنية، خطاب ضمان، أو إقرار وارد، لازم نعرف أصلًا: **مين ماسك اللعبة؟ وإيه اللي بيدخل المستثمر المنطقة الحرة عشانه؟**

**الهيئة العامة للاستثمار (GAFI)**

الهيئة العامة للاستثمار والمناطق الحرة (GAFI) هي الجهة الحكومية المسؤولة عن تنظيم وتشجيع الاستثمار في مصر، وتتبع الدولة في جذب المستثمرين المحليين والأجانب، وتشرف على تطبيق قانون الاستثمار رقم 72 لسنة 2017 داخل المناطق الحرة وغيرها من الأنظمة الاستثمارية. من أهم أهدافها: جذب الاستثمارات المحلية والأجنبية، زيادة الصادرات، توفير فرص عمل، إدخال عملة أجنبية، تبسيط إجراءات تأسيس المشروعات، وتوفير بيئة استثمارية مناسبة للمستثمر.

**قبل ما نبدأ رحلة المستثمر: مين بيعمل إيه؟**

أول فرق لازم يثبت في دماغك: الهيئة مش هي الشركة، ومش شريك فيها. هي الجهة اللي بتحط القواعد، تراجع المشروع، تمنح الموافقات، وتراقب إن المزايا الممنوحة للمستثمر تُستخدم في النشاط المصرح به.

**الهيئة مقابل الشركات**

الفرق الأساسي اللي هيوضح كل حاجة بعد كده: الهيئة جهة خدمية وتنظيمية، دورها يقتصر على استقبال المستثمر، مراجعة المشروع، إصدار الموافقات، الرقابة، ومتابعة تنفيذ القوانين — مش طرف منتج ولا تاجر في السوق.

| **الهيئةالشركات**      |                      |
| ---------------------- | -------------------- |
| **جهة حكومية**         | جهة ربحية            |
| **تقدم خدمات تنظيمية** | تبيع منتجات أو خدمات |
| **تشجع الاستثمار**     | تحقق أرباحاً         |
| **تمنح الموافقات**     | تنتج أو تتاجر        |

**يعني إيه منطقة حرة؟**

تخيل مستثمر عايز يعمل مصنع للتصدير. أول سؤال عنده: *إيه اللي هيخليني أنتج من مصر وأفضل قادر أنافس منتج معمول في بلد تانية؟* هنا بيظهر نظام المنطقة الحرة.

تعريف الهيئة الرسمي: جزء من إقليم الدولة يدخل ضمن حدودها ويخضع لسلطتها الإدارية، ويُعامَل وفقًا لأحكام ضريبية وجمركية ونقدية خاصة.

بمعنى عملي: الشركة جوه المنطقة الحرة تقدر تستورد خامات من أي دولة من غير ما تدفع الجمارك المعتادة، تصنّع أو تخزّن أو تقدّم خدمة، وبعدين تصدّر للخارج. الهدف من النظام ده بالنسبة للدولة أربع حاجات: زيادة الصادرات، جذب الاستثمار الأجنبي، توفير فرص عمل، وإدخال عملة صعبة (دولار أو يورو) لمصر.

وبما إن الشركة معفاة من الجمارك العادية، تكلفة الإنتاج بتقل، وده اللي بيخليها تنافس بقوة أكبر في السوق العالمي.

**3 أنواع مشروعات فقط**

### مشروع صناعي

مصنع كامل: يستورد خامات، يصنّعها، ثم يصدّر منتج جديد بالكامل.

مواد خام

←

تصنيع (تغيير الشكل)

←

تصدير منتج جديد

مثال: مصنع ملابس، مصنع بلاستيك، مصنع مواد غذائية.

### مشروع تخزيني

لا يصنّع ولا يغيّر في المنتج، فقط يستورد بضاعة جاهزة، يخزّنها، ثم يعيد تصديرها.

بضاعة جاهزة

مثال: شركة تستورد 500 سيارة، تخزنها شهرين، ثم توزّع 100 لمصر و200 لليبيا و200 لتونس.

### مشروع خدمي

مفيش سلعة أصلًا؛ المنتج نفسه هو الخدمة المقدَّمة.

تسليم لعميل خارجي

مثال: استشارات هندسية، تأجير معدات وحفارات، توفير مهندسين لشركات بترول.

### صناعي مقابل تخزيني: إيه الفرق فعلاً؟

**الصناعي** بيضيف قيمة للمنتج (بيصنّع منتج جديد)، وده بيديه مزايا أكبر، ودوره يشجّع التصدير.

**التخزيني** مايضيفش قيمة كبيرة (بيخزّن ويعيد التصدير بس)، مزاياه أقل، ودوره يعتمد على التخزين وإعادة التعبئة.

### ليه الفرق ده مهم؟

لأن نوع النشاط بيأثر على فئة الرسوم والمعاملة اللي المشروع بياخدها من الهيئة — راجع فصل \"النظام المالي\" للتفاصيل.

**الأنشطة المسموحة والممنوعة**

الهيئة تسمح بكل الأنشطة الموجهة أساسًا للتصدير للخارج، حسب سياستها، باستثناء بعض الأنشطة المحظورة كليًا أو المقيدة بموافقة خاصة.

### ممنوعة نهائيًا

صناعات الخمور والمواد الكحولية، وصناعات الأسلحة والذخائر والمتفجرات وما يرتبط بالأمن القومي.

### مسموحة بموافقة خاصة (بعد تعديل 2023)

تصنيع البترول، صناعة الأسمدة، الحديد والصلب، تسييل ونقل الغاز الطبيعي، والصناعات كثيفة استخدام الطاقة، كانت ممنوعة تمامًا وأصبحت جائزة بموافقة المجلس الأعلى للطاقة بعد القانون رقم 160 لسنة 2023.

**ليه الشركات تدخل منطقة حرة؟**

تقليل تكلفة الاستيراد بدون جمارك عادية، يعني تكلفة إنتاج أقل، ومنافسة أقوى في السوق العالمي. بالإضافة لضمانات قانونية وحوافز تفصيلية موجودة في قسم \"الإطار القانوني\" بالأسفل.

| **ما الهدف الأساسي للمناطق الحرة؟**            | تشجيع الاستثمار، زيادة الصادرات، توفير العملة الأجنبية، خلق فرص عمل.                                                       |

## الإدارات

Departments · هنا بنسيب تعريف النظام ونبدأ نمشي مع **المستثمر نفسه**. تخيل إنك مكانه: قدمت الفكرة، والورق بدأ يتحرك. من هنا كل إدارة هتاخد مرحلة من الرحلة، لحد ما المشروع يشتغل وتبدأ الهيئة تتابعه.

**رحلة المستثمر من الفكرة للتشغيل**

قبل ما نفصّل كل إدارة، شوف الرحلة كلها مرة واحدة. الفكرة إنك ما تحفظش الإدارات كأسماء منفصلة؛ اربط كل إدارة بلحظة معينة في عمر المشروع.

**الحكاية ببساطة:** المستثمر عنده فكرة → يقدم الطلب → المشروع يتفحص → الأرض تتخصص → الشركة تتأسس → المعدات تدخل → الإنتاج يبدأ → الصادرات والواردات تتراقب → ولو المشروع انتهى، تبدأ رحلة التصفية.

كل مرحلة معاها مين مسؤول عنها، وفين بتظهر الرسوم على الطريق. الخريطة دي نظرة عامة بس — كل مصطلح فيها ([مقابل الانتفاع](https://heshvm101.github.io/GAFI/#fees-usufruct)، [مقابل الضمان](https://heshvm101.github.io/GAFI/#fees-guarantee-fee)، [الرسم الجاري](https://heshvm101.github.io/GAFI/#procedures-fees)، إلخ) هيتشرح بالتفصيل في مكانه بعد كده، فلو قابلت كلمة مش فاهمها دلوقتي، دوس عليها على طول أو كمّل قراءة عادي وهتوصلها.

**قطاع المناطق الحرة**

قطاع المناطق الحرة من أهم قطاعات الهيئة، ويتولى: استقبال المستثمرين، تخصيص الأراضي، مراجعة المشروعات، متابعة الشركات، تحصيل الرسوم، الرقابة على تنفيذ النشاط، ومتابعة الصادرات والواردات. الإدارات التلاتة اللي جاية هي أقسام جوه القطاع ده.

الهيئة كمان مش بتستنى المستثمرين بس — فيه **قطاع الترويج للاستثمار** بيحضر المعارض الدولية والمؤتمرات، بيقابل المستثمرين، وبيسوّق للفرص الاستثمارية جوه مصر وبرا، بالإضافة للخريطة الاستثمارية اللي بتعرض الفرص إلكترونياً. القطاع ده رسميًا واحد من المحاور الاستراتيجية الخمسة للهيئة (جنب إدارة المناطق الحرة وتنمية المناطق الاستثمارية، تطوير خدمات الاستثمار، دعم المشروعات الصغيرة والمتوسطة وريادة الأعمال، والتطوير المؤسسي الداعم). تفاصيل سير العمل اليومي جواه (زي إدارة الأقسام التانية بالضبط) لسه مش موثقة هنا، هتتضاف لما تتوفر.

**تطور حديث (مايو 2026):** رئيس الهيئة وجّه القطاع بالتحول من \"الترويج العام\" لـ\"الاستهداف المباشر\" — يعني بدل ما يكتفي بالترويج الواسع، بقى فيه آلية متابعة منظمة لكل شركة أو مستثمر مستهدف بالاسم، مع محتوى ترويجي مبني على بيانات ومؤشرات اقتصادية فعلية، لحد ما الفرصة تتحول لاستثمار فعلي على الأرض.

Research & Licensing Department · **هنا المشروع لسه فكرة على الورق.** المستثمر لسه ما دخلش شاحنات ولا بدأ إنتاج. كل اللي معاه هو مشروع عايز يقنع الهيئة إنه يستحق يدخل النظام، وده بالضبط دور الإدارة: تحول الفكرة من مجرد تصور إلى مشروع قابل للموافقة.

| **إمتى بيبدأ دورها في رحلة المشروع** | من أول لحظة — هي أول إدارة يقابلها المستثمر، ودورها يستمر لحد صدور قرار المزاولة                                                |

### رأس المال مقابل التكاليف الاستثمارية

**رأس المال:** الأموال اللي المستثمر نفسه بيمتلكها، وهي جزء من المشروع بس.

**التكاليف الاستثمارية:** كل الأموال اللازمة لتشغيل المشروع، بتشمل رأس المال + القروض والتسهيلات وغيرها.

### الحصة النقدية مقابل العينية

**نقدية:** أموال، ومش محتاجة تقييم خاص.

**عينية:** معدات أو أصول أو خبرة أو حقوق معنوية، ولازم تتقيّم من خبراء.

### الموافقة النهائية (Final Approval)

بتصدر لو اللجنة الفنية وافقت والمستثمر استوفى كل الشروط، وبعدها تُستكمل إجراءات إقامة المشروع. المستند الرسمي اللي بيصدر بيها هو نفسه **\"قرار المزاولة\"** — الاسمين بيتقالوا على نفس الحاجة.

**الصلاحية:** الموافقة النهائية (قرار المزاولة) صلاحيتها 6 شهور — لازم المشروع يستوفي شروطها خلال المدة دي، وإلا يُطلب منه تجديدها.

**اللجنة الفنية (Technical Committee)**

الجهة اللي بتاخد قرار الموافقة المبدئية فعليًا هي اللجنة الفنية، وهي بتجتمع بشكل دوري لدراسة طلبات المستثمرين قبل صدور أي موافقة.

- **✓**

  مراجعة كل مشروع على حدة.
- **✓**

  مناقشة البيانات المقدَّمة من المستثمر.
- **✓**

  التأكد من استيفاء الشروط المطلوبة.
- **✓**

  إصدار توصية: بالموافقة، أو الرفض، أو طلب استكمال مستندات.

**ليه ممكن المشروع يترفض أو يتأخر؟**

مش كل الطلبات بتعدي بسلاسة من اللجنة، أهم أسباب الرفض أو التأخير:

- **✓**

  دراسة الجدوى ضعيفة أو غير مقنعة.
- **✓**

  عدم إثبات الملاءة المالية.
- **✓**

  مستندات ناقصة.
- **✓**

  النشاط غير مناسب للمناطق الحرة.
- **✓**

  الشريك الأجنبي لم يحصل على الموافقات المطلوبة عند الحاجة.
- **✓**

  اسم الشركة غير متاح.
- **✓**

  البيانات المقدَّمة غير منطقية.

### مراجعة الطلب (Application) قبل اللجنة

قبل عرض المشروع على اللجنة، يراجع الموظف المختص: استكمال المستندات، صحة البيانات، ومطابقة النشاط.

**ملحوظة:** كتابة اسم المشروع بالعربية والإنجليزية معاً أصبحت من المتطلبات الأساسية للطلب.

### دور فرع الهيئة بالإسكندرية

لا يخصص الأراضي بنفسه، وإنما يراجع الطلبات ويُعِدّها فقط، ويجمع موقف الشركة الكامل (الالتزام، السداد، الجرد السنوي) من كل الإدارات قبل عرضها — لأن فرع الإسكندرية عارف الشركات، والقاهرة لأ.

**Practical Note · التفويض لرئيس المنطقة:** الموافقة النهائية أصلًا بتصدر من مجلس إدارة الهيئة، والمجلس ده بيجتمع نادرًا (مرتين تلاتة في السنة). من 2013، الإسكندرية هي المنطقة الوحيدة اللي أخدت تفويضًا من المجلس لرئيس المنطقة يوقّع الموافقة النهائية مباشرة — فبدل ما القرار ياخد شهر أو شهرين لحد ما ينعقد المجلس، بقى بيطلع في يوم واحد.

**2بعد الموافقة**

**تعديل بيانات المشروع (Project Amendments)**

لحد هنا المشروع لسه بيتأسس. لكن بمجرد ما بدأ التشغيل الفعلي، أي تعديل في بياناته لازم يرجع للهيئة — مش المستثمر يعدّل لوحده — لأن بيانات المشروع بقت جزء من قرار المزاولة والملفات الرسمية. المستثمر بيقدّم طلب تعديل بمستنداته (زي جدول بيانات التوسع لو بيوسّع)، والإدارة بتراجعه، وبتاخد رأي إدارات تانية لو النشاط مش نمطي، وبيتعرض على اللجنة الفنية تاني لو استدعى الأمر، وبعد استيفاء المستندات تصدر الموافقة.

**أول سنتين:** في الفترة دي عادةً ما بيُنصح المستثمر بعدم تعديل البيانات الأساسية للمشروع، لحد ما يثبت استقرار نشاطه.

| **نوع التعديلبيتعدل فيه إيه؟** |                             |
| ------------------------------ | --------------------------- |
| **تعديل بيانات المشروع فقط**   | قرار المزاولة فقط           |
| **تعديل عقد التأسيس**          | عقد التأسيس والسجل التجاري  |
| **تعديل الاثنين معًا**         | قرار المزاولة + عقد التأسيس |

### امتى يتعدل قرار المزاولة فقط؟

- زيادة مساحة المشروع.
- تقليل مساحة المشروع.
- تغيير قطعة الأرض.
- التوسعات داخل المنطقة الحرة.

لأن البيانات دي تخص الهيئة فقط، ومش موجودة في عقد التأسيس أصلًا.

### امتى يتعدل عقد التأسيس كمان؟

- تغيير الممثل القانوني.
- دخول شريك جديد.
- خروج شريك.
- تعديل نسب الشركاء.
- تغيير رأس المال.

لأن البيانات دي موجودة في عقد التأسيس وقرار المزاولة مع بعض.

**تصفية المشروع (Project Liquidation)**

ولو المشروع وصل في يوم من الأيام للنهاية، القصة ما بتخلصش بمجرد إن المصنع يقفل بابه. **هنا تبدأ آخر رحلة للملف:** التصفية. لو التعديل مش كفاية والمستثمر قرر ينهي نشاطه تمامًا، بيدخل في مسار مختلف تمامًا. إنهاء نشاط المشروع مش مجرد إقفال المصنع أو ترك الموقع — لازم تصفية كاملة وفق إجراءات الهيئة لحد ما تنتهي كل الالتزامات القانونية والمالية. التصفية نوعين: **اختيارية** (المستثمر نفسه بيطلبها، والهيئة بتسأله الأول هل السبب حاجة تقدر تحلّها)، أو **إجبارية** (المشروع مش ملتزم رغم المتابعة والإنذارات، فتُعرض حالته على اللجنة الفنية).

### براءات الذمة (Clearance Certificates)

قبل إنهاء المشروع، لازم يثبت عدم وجود أي التزامات على الشركة تجاه: الهيئة، الجمارك، الضرائب، الكهرباء، المياه، والجهات الحكومية الأخرى. المصفي القانوني كمان بيقدّم إقرار يتحمّل فيه مسؤولية أي مستحقات تظهر لاحقًا.

### دور المصفي القانوني (Legal Liquidator)

بمجرد تعيينه في محضر جمعية الشركاء، بيبقى هو الوحيد اللي الهيئة بتتعامل معاه — مش الشركاء ولا الممثل القانوني. مسؤول عن تصفية حسابات الشركة، بيع أصولها، وسداد كل ديونها.

**مدة التصفية:** ست شهور قانونًا، وممكن تُمدّ بمبررات — لكن المد نفسه لازم يمشي في نفس مسار الموافقة المبدئية والنهائية تاني.

**أهم الأخطاء الشائعة (بعد الموافقة)**

- **1**

  **تعديل بيانات المشروع من غير الرجوع للهيئة:** أي تغيير (توسعة، تغيير أرض، دخول شريك) لازم يعدّي على الإدارة أولًا، مش يتنفذ على الأرض ثم يُبلَّغ.
- **2**

  **تعديل بيانات أساسية في أول سنتين:** بيُنصح الاستثمار بعدم لمس البيانات الأساسية قبل ما يثبت استقرار النشاط، وتجاهل النصيحة دي بيعقّد أي طلب تعديل لاحق.
- **3**

  **محاولة التصفية من غير تعيين مصفٍّ قانوني رسمي:** بعد التعيين، الهيئة مش بتتعامل مع الشركاء ولا الممثل القانوني إلا من خلاله؛ أي تصرف خارج هذا المسار بيعطّل الإجراءات.
- **4**

  **عدم استخراج براءات الذمة من كل الجهات:** الهيئة، الجمارك، الضرائب، الكهرباء، والمياه — نسيان جهة واحدة بيوقف التصفية بالكامل.

**1 · حركة البضاعة**

**أول ما البضاعة تتحرك، يبدأ الاختبار الحقيقي للنظام.**

أول ما [قرار المزاولة](https://heshvm101.github.io/GAFI/#research-approval-stages) يصدر والمشروع يبدأ نشاطه، أول حاجة الإدارة بتتابعها هي حركة البضاعة الداخلة والخارجة. الوارد مش دايمًا جاي من مصدر واحد، والإجراءات بتختلف حسب المصدر:

### من خارج مصر

زي شركة بتستورد خامات من الصين — يحتاج بوليصة شحن وتأمين نقل بري.

### من منطقة حرة أخرى

زي شركة ببورسعيد بترسل خامات لشركة في الإسكندرية — إجراءات مختلفة عن الوارد الأجنبي والمحلي.

### من السوق المحلي

زي مصنع في القاهرة بيبيع خامات لمصنع في المنطقة الحرة — أسهل الحالات، مفيش تأمين نقل مطلوب.

**أنواع الصادر (بنفس المنطق)**

### تصدير للخارج

الأصل والهدف الأساسي للمنطقة الحرة — المنتج بيخرج بره مصر بالكامل.

### تحويل لمنطقة حرة أخرى

نفس منطق الوارد بين المناطق، لكن بالعكس — بضاعة أو منتج نصف مصنّع بيتحرك لمشروع في منطقة حرة تانية.

### بيع في السوق المحلي

استثناء، مش الأصل — يحتاج موافقات وسداد الرسوم الجمركية والضرائب المستحقة (تفاصيله في فصل المتابعة المالية).

**مسار الاستيراد (وارد أجنبي)**

أعقد حالات الوارد هي الوارد الأجنبي، وهي اللي بتوضح المسار الكامل من أول مستند لحد دخول البضاعة فعليًا:

**إقرار الوارد (Import Declaration)** هو أهم مستند في العملية كلها — إعلان رسمي من الشركة بالأصناف والكميات والغرض من استخدامها والنشاط المرتبط بيها. إدارة التنفيذ بتراجع كل بند فيه مقابل قرار مزاولة النشاط: هل الصنف ده أصلًا مسموح للشركة تتعامل فيه؟ هل هي هتستخدمه فعلًا في نشاطها ولا الهدف بيعه في السوق المحلي بدون ضرائب؟

### بوليصة الشحن (Bill of Lading)، إيه هي بالظبط؟

وثيقة قانونية بتصدرها شركة الشحن (الناقل) للمُصدِّر لما تستلم البضاعة عشان تنقلها. بتلعب 3 أدوار في نفس الوقت: **إيصال استلام** (إثبات إن الناقل فعلًا استلم البضاعة)، **عقد نقل** (شروط النقل والوجهة والأجرة)، و**وثيقة ملكية قابلة للتداول** — يعني اللي معاه البوليصة الأصلية هو اللي له حق استلام البضاعة، حتى لو مش هو المُصدِّر الأصلي.

### ليه هي أول خطوة في المسار؟

لأن من غيرها مفيش إثبات إن البضاعة اتشحنت أصلًا. الشركة الناقلة بتصدرها فور استلام البضاعة، وبعدين باقي المستندات (فاتورة البيع، وثيقة التأمين، إقرار الوارد) بتُبنى على البيانات المذكورة فيها: نوع البضاعة، الكمية، ميناء الشحن، ميناء الوصول، ووسيلة النقل.

**أنواعها حسب وسيلة النقل:** بحرية (الأكثر شيوعًا، وثيقة قابلة للتداول)، جوية (Air Waybill، غير قابلة للتداول، مجرد عقد نقل)، وبرية (للشحن بين الدول المتجاورة). كل نوع نفس الوظيفة القانونية، يختلف بس شكل المستند حسب وسيلة النقل.

**تحديث حديث من الهيئة:** بدل ختم فواتير الاستيراد والتصدير بشكل دوري مع كل عملية، أصبحت الهيئة تصدر شهادة استيراد وشهادة تصدير سارية لمدة 3 سنوات لكل منهما، لتقليل الإجراءات المتكررة على الشركات.

### تأمين النقل البري (وثيقة التأمين)

مطلوب بس للوارد الأجنبي. الهيئة بتضمن للجمارك إن البضاعة هتوصل من الدائرة الجمركية للمنطقة الحرة سليمة — لو حصل فقد أو سرقة أو تصرف غير قانوني، الهيئة هي اللي مسؤولة أمام الجمارك. قيمة الوثيقة = قيمة الجمارك والضرائب المستحقة، مش القيمة الكاملة للبضاعة.

بضاعة قيمتها $100,000، الجمارك المستحقة عليها $20,000 ← وثيقة التأمين تُحرَّر بقيمة $20,000 فقط. الرسم المقابل لخدمة الضمان دي هو نفسه [مقابل الضمان](https://heshvm101.github.io/GAFI/#fees-guarantee-fee) (1‰) في فصل النظام المالي.

### الوارد المحلي: أسهل حالة

لو البضاعة أصلًا داخل مصر، الإجراءات أبسط بكتير: إقرار وارد ← مراجعة ← توقيع ← ختم شعار الجمهورية ← يرسل للجمارك ← تفتح شهادة ← تدخل البضاعة. مفيش تأمين نقل بري ولا بوليصة شحن خارجية، لأن البضاعة أصلًا مش خارجة من دائرة جمركية.

### الرصيد لدى الهيئة

مش بس مرتبط بالتأمين — نفس الفكرة دي بتتطبق على أي رسم بيتكرر مع كل عملية استيراد أو تصدير (زي مقابل الضمان أو رسوم الإقرارات). بدل ما الشركة تدفع كل مرة لوحدها، بتحط مبلغ مقدّم كرصيد لديها، والهيئة تخصم الرسوم منه أول بأول مع كل عملية.

مثال شائع: إيداع $10,000 كرصيد يُخصم منه تباعًا.

**المعاينة الثلاثية**

قبل ما البضاعة تعدّي، فيه لحظة لازم تتقابل فيها **ثلاث صور لنفس العملية:** الورق، والبضاعة الموجودة على الأرض، والبيانات المسجلة على النظام. لو الثلاثة اتطابقوا، العملية تكمل. لو واحدة مختلفة، الحركة بتقف لحد ما السبب يتفهم ويتحل.

قبل دخول أو خروج أي بضاعة، لازم لجنة من 3 أطراف تتأكد إن البضاعة المتحركة فعليًا مطابقة للمستندات المقدَّمة.

**2الحساب والرسوم**

**مصطلحات التجارة الدولية: FOB وCIF**

لحد هنا الكلام كله عن حركة البضاعة نفسها. لكن كل عملية استيراد أو تصدير محتاجة كمان يتحدد مين بيدفع الشحن والتأمين ومتى تنتقل المسؤولية من البائع للمشتري — وده اللي بيبني عليه حساب الرسوم بعد شوية. الإجابة موجودة في قواعد **Incoterms** الصادرة عن غرفة التجارة الدولية، وأكتر مصطلحين مستخدمين في شغل المنطقة الحرة هما FOB وCIF.

| **العنصرFOB (Free On Board)CIF (Cost, Insurance & Freight)** |                                       |                           |
| ------------------------------------------------------------ | ------------------------------------- | ------------------------- |
| **يتحمل الشحن البحري**                                       | المشتري                               | البائع                    |
| **يتحمل التأمين**                                            | المشتري                               | البائع                    |
| **تنتهي مسؤولية البائع**                                     | عند تحميل البضاعة على السفينة         | عند وصولها لميناء الوصول  |
| **قيمة العقد تشمل**                                          | التصنيع + النقل للميناء + التحميل فقط | البضاعة + التأمين + الشحن |

**قاعدة سهلة للحفظ:** FOB = \"البائع يوصّل البضاعة للسفينة بس\". CIF = \"البائع يوصّل، ويؤمّن، ويدفع الشحن كمان\".

وده اللي بيربطها بالرسم الجاري (تحت): المشروع الصناعي بيتحاسب على أساس FOB لأنه صنّع منتج جديد فعلًا، والمشروع التخزيني بيتحاسب على أساس CIF لأنه بيتعامل مع البضاعة زي ما وصلت للميناء بالظبط.

### مصطلحات تانية هتقابلها في المستندات

- **Consignor / Shipper:** الشاحن أو المصدّر
- **Consignee:** المستورد المستلم
- **Freight Forwarder:** وكيل الشحن
- **Customs Clearance:** التخليص الجمركي
- **HS Code:** الكود الجمركي للسلعة
- **Manifest:** بيان الشحنة كاملة
- **Transit:** مرور البضاعة عبر دولة من غير دخولها للاستهلاك المحلي

**اتفاقية الكويز (QIZ)**

**مصطلح إضافي هتقابله في نفس السياق: اتفاقية الكويز.** اتفاقية \"المناطق الصناعية المؤهلة\" (Qualifying Industrial Zones) وقّعتها مصر مع أمريكا وإسرائيل في ديسمبر 2004. بتسمح لمنتجات مصرية معينة (غالبًا ملابس ومنسوجات) تدخل السوق الأمريكي بدون جمارك ومن غير سقف كمية (كوتا)، بشرط إن نسبة معينة من مكونات المنتج مصدرها إسرائيل (كانت 11.7% وقت التوقيع، وقلّت بعد تعديلات لاحقة لحد حوالي 8.5%). عدد المناطق المؤهلة وصل لأكتر من 27 منطقة في 14 محافظة.

**مهم تفهمها صح:** الكويز مش نفس نظام المنطقة الحرة العادي — هي مسار تفضيلي منفصل خاص بالتصدير لأمريكا تحديدًا، وشركة ممكن تكون داخل منطقة حرة عادية وتستفيد بمزايا الكويز كمان لو نشاطها وموقعها مؤهلين، مش بديل عن نظام المناطق الحرة.

**الرسم الجاري (Running Fee)، حسب نوع المشروع**

وهنا بنرجع لأساس FOB وCIF اللي فات — لأن نوع المشروع هو اللي بيحدد أساس حساب الرسم الجاري:

**صناعي**

**1%** من قيمة الصادرات (أساس فوب FOB)، يُحصَّل وقت التصدير، لأن المصنع صنّع منتج جديد فعلًا. البضائع العابرة (ترانزيت) المحددة الوجهة مُعفاة من هذا الرسم.

**تخزيني**

**2%** من قيمة البضاعة الواردة (أساس سيف CIF)، يُحصَّل وقت دخول البضاعة، لأنه لم يصنّع شيئًا.

**خدمي**

**1%** من إجمالي الإيراد السنوي، قبل أي خصومات، من واقع قوائم مالية معتمدة من محاسب قانوني.

**الأساس القانوني:** المادة 41 من قانون الاستثمار رقم 72 لسنة 2017، بالنسبة لمشروعات المناطق الحرة العامة (ومنها منطقة الإسكندرية).

**مثال: ليه الرسم بيتحسب قبل الخصم؟ (مشروع خدمي)**

قيمة الفاتورة الأصلية$100,000

خصم مُقدَّم للعميل$20,000

المبلغ الذي دفعه العميل فعليًا$80,000

أساس حساب الرسم لدى الهيئة**$100,000**

### تقديم بيان الإيرادات

الشركات الخدمية تقدّم بيان الإيرادات مرتين في السنة، مرفق معاه الفواتير والشيك المستحق. التأخير في التقديم يترتب عليه غرامات تأخير.

### الوكيل الحصري (Exclusive Agent)

كتير من شركات المنطقة الحرة مش بالضرورة هي المصنّعة، وإنما وكيل توزيع حصري لمنتج معين في أكتر من سوق: مصر، شمال أفريقيا، أوروبا، غرب آسيا.

**الهالك: نسبة الفقد الطبيعي أثناء التصنيع**

وطالما بنتكلم عن حساب الرسوم بدقة، فيه عنصر تاني بيأثر في الحساب لازم تعرفه: أي عملية تصنيع بتفقد جزء من الخامة الأصلية بشكل طبيعي (خامة بتتحول لمخلفات مش منتج نهائي) — النسبة دي اسمها \"الهالك\"، وهي مش نفس \"الأخطاء\" أو \"التلاعب\"، لكنها لازم تكون ضمن حدود منطقية ومقبولة فنيًا.

### مين بيحدد النسبة؟

الجهات الرقابية المختصة (زي الجهاز المسؤول عن كل صناعة) بتحدد \"معامل هالك\" ثابت لكل نشاط، بناءً على طبيعة المنتج والعملية الصناعية نفسها — مش رقم عشوائي ولا بيتحدد من الشركة.

### ليه الهيئة بتتابعها؟

معامل الهالك ده هو الأساس اللي بيتحسب عليه الجمرك المستحق أو المسترد على الخامة المستوردة. لو الشركة استوردت 100 طن خامة وصنّعت منتج بوزن أقل من المتوقع حسب المعامل، الفرق ده لازم يتفسر — وإلا يبقى فيه شبهة إن جزء من الخامة اتباع في السوق المحلي بدون ما يتصنّع أو يتصدّر.

**لما النسبة تتعدّى الحد المسموح:** الهيئة بتطلب تفسير من الشركة، وممكن تراجع العملية كاملة (زي ما هو موضح في \"الأخطاء الشائعة\" تحت) — لأن تجاوز الهالك المتكرر بيبقى مؤشر على مخالفة، مش مجرد فقد طبيعي.

**أهم الأخطاء الشائعة**

- **1**

  **اختلاف بيانات المستندات:** اختلاف الكميات أو الوصف أو أرقام الحاويات — بيوقف الإجراءات فورًا لحد ما يتصحح.
- **2**

  **اختيار نشاط غير مناسب:** استيراد مواد أو أصناف مش داخلة أصلًا في النشاط المرخّص للشركة.
- **3**

  **خروج معدات بدون تصريح:** كل المعدات مسجلة لدى الهيئة، ومايجوزش تخرج من غير موافقة رسمية.
- **4**

  **زيادة الهالك بصورة غير مبررة:** لو نسبة الفقد أو التلف أثناء التصنيع تعدّت الحدود الفنية المسموحة، الهيئة بتطلب تفسير وممكن تراجع العملية كاملة.
- **5**

  **التأخير في تقديم الإقرارات:** كل عملية لازم تتسجّل في موعدها، والتأخير بيعطّل باقي الإجراءات.

**مفاهيم هتتغطى بالتفصيل لاحقًا:** تصريح الخروج، بيان المعاينة، \"التشغيل بين المشروعات\"، و\"الرسائل المؤقتة والمرتدة\" — دول أسماء اتذكرت في التدريب بس البحث عنهم (حتى على الإنترنت) مأدّاش تفاصيل موثوقة تستاهل الكتابة، لأنهم مصطلحات إجرائية داخلية للهيئة مش موثّقة في مصادر عامة، فمستنيين تفاصيلهم من زميل في الإدارة بدل ما نخمّن.

**ملحوظة عامة على الإدارة الهندسية والقانونية:** الدور العام بتاعهم معروف (اعتماد تراخيص البناء فور تقديم الرسومات الهندسية / مراجعة الشكل القانوني والعقود، زي الموضح في جدول الإدارات فوق) لكن تفاصيل سير العمل اليومي جواهم لسه مش موثقة في أي مصدر عام، خصوصًا الإدارة القانونية، ومحتاجة معلومة من جوه الهيئة نفسها.

## إدارة المتابعة المالية

Financial Follow-up Department · **المشروع أخد الموافقة وبدأ يشتغل. هل كده دور الهيئة خلص؟ بالعكس.** هنا تبدأ مرحلة المتابعة: هل المشروع بينفذ اللي اتوافق عليه؟ هل بيستخدم الأرض والمعدات في النشاط الصحيح؟ وهل بيحافظ على شروط النظام طول فترة تشغيله؟

الهدف من المتابعة إنها تتأكد إن المستثمر بينفذ اللي اتعهد بيه، وملتزم بقوانين المناطق الحرة، وبيستخدم الأرض والمعدات في النشاط المصرح بيه بس.

**خروج المعدات من المنطقة الحرة**

### الحالة العادية

المعدات جوه المنطقة الحرة مايجوزش تتخرج بحرية. لو المستثمر محتاج يخرج ماكينة للصيانة أو الإصلاح، لازم يقدّم طلب رسمي للهيئة الأول.

### امتى محتاج موافقة خاصة؟

لو التغيير كبير — زي إخراج عدد كبير من المعدات، أو استبدال خط إنتاج كامل، أو إحلال وتجديد المعدات.

مبررات مقبولة: حريق، تلف في المعدات، أو استبدالها بمعدات أحدث. والهيئة بتحدد مدة زمنية لإحضار المعدات البديلة.

**متابعة الصادرات والواردات**

المشروع بيقدّم بيانات دورية توضح قيمة الواردات والصادرات وكميات البضائع، والبيانات دي بتتستخدم لإعداد الإحصائيات ومتابعة أداء المشروع.

**الالتزام بنسبة التصدير**

لو المشروع اتوافق عليه أصلًا كمشروع تصديري، لازم يلتزم بالنسبة المقررة (بعض المشروعات، حسب الضوابط، مسموح لها تبيع نسبة محدودة في السوق المحلي — 20% مثلًا). لو المشروع مايحققش نسبة التصدير المطلوبة، ممكن يحصل:

- **1**

  وقف بعض المزايا الممنوحة للمشروع.
- **2**

  طلب توضيح أسباب عدم الالتزام.
- **3**

  تقديم مستندات تبرر الوضع.

**التقييم الدوري للمشروع**

المشروعات مش بتتسيب بعد ما تبدأ التشغيل — بتتقيّم بشكل دوري (سنويًا غالبًا، أو حسب طبيعة المشروع)، والتقييم بيشمل: مدى الالتزام بالنشاط، تنفيذ الخطة، الالتزام بالقوانين، واستمرار الإنتاج.

**المخالفات: من الاكتشاف إلى الإجراء القانوني**

اكتشاف مخالفة

←

طلب توفيق الأوضاع

←

متابعة التنفيذ

←

إنذار (عند عدم الالتزام)

←

إجراءات قانونية / إدارية (لو استمرت المخالفة)

**أهم الأخطاء الشائعة**

- **1**

  **إخراج معدات من غير تصريح رسمي:** حتى لو للصيانة، لازم طلب مسبق للهيئة — إخراج أي معدة بدون موافقة بيُحسب كمخالفة مباشرة.
- **2**

  **عدم الالتزام بنسبة التصدير المقررة:** بيع كميات أكبر من المسموح في السوق المحلي بدون توضيح الأسباب أو استكمال المستندات المبررة.
- **3**

  **تجاهل الإنذارات:** المشروع اللي بيستمر في المخالفة رغم الإنذارات المتكررة بيدخل مسار الإجراءات القانونية مباشرة، بدل ما يتحل الموقف وديًا في مرحلة \"توفيق الأوضاع\".
- **4**

  **التعامل مع التقييم الدوري كإجراء شكلي:** عدم تجهيز مستندات الالتزام بالنشاط والخطة والقوانين قبل موعد التقييم بيطوّل وقت المراجعة.

## الرسوم والمقابل المالي

**المشروع أخد الأرض، بدأ يستورد، والامتيازات اشتغلت. لكن كل ميزة ليها مقابل أو التزام مالي معين.** هنا بنفكك الرسوم والضمانات، مش كأرقام للحفظ، لكن كجزء من رحلة المشروع.

**01**

### مقابل الانتفاع (Usufruct Fee)

إيجار الأرض أو المبنى، يُحسب سنويًا بسعر ثابت لكل متر مربع من المساحة المخصصة للمشروع. مجلس إدارة الهيئة هو المنوط بتحديد فئات هذا السعر، وتختلف الفئة حسب نوع النشاط (صناعي / تخزيني / خدمي).

**الأساس القانوني:** المادة 11 من قرار وزيرة الاستثمار رقم 39 لسنة 2019.

**03**

### مقابل الضمان (Guarantee Fee)

1 بالألف من قيمة وثيقة التأمين (مش من قيمة البضاعة نفسها).

مثال: وثيقة تأمين قيمتها $20,000 ← مقابل الضمان = $20

**02**

### مقابل الخدمات السنوي (Annual Service Fee)

يستحق بمجرد صدور قرار مزاولة النشاط، وبيتحسب سنويًا بعد كده، وفقًا لما تطبّقه الهيئة حاليًا.

- **0.5 بالألف** من رأس المال المصدر، للمشروع الصناعي.
- **1 بالألف** من رأس المال المصدر، للمشروع التخزيني أو الخدمي.
- له **حد أقصى سنوي** = ما يعادل 100,000 جنيه مصري، يتحول لدولار أو يورو حسب سعر الصرف بالبنك المركزي يوم 1 يناير من كل سنة.
- لو الناتج من الحسبة أقل من الحد الأقصى، تُطلب القيمة المحسوبة. لو أكبر، يُطلب الحد الأقصى فقط.

**مثال حساب: مشروع صناعي، رأس المال المصدر $5,000,000**

النسبة المستحقة0.5‰

القيمة المحسوبة$5,000,000 × 0.5‰ = $2,500

الحد الأقصى السنوي (2026)$2,103.77

المستحق فعليًا**$2,103.77**

الحد الأقصى بيتجدد كل سنة حسب سعر صرف البنك المركزي يوم 1 يناير، ولذلك رقمه بالدولار يختلف من سنة لسنة. الرقم المحدد لسنة 2026 لسه محتاج تأكيد من مصدر رسمي منشور، الآلية نفسها (تحويل 100,000 جنيه بسعر يوم 1 يناير) هي المؤكدة.

القيمة المحسوبة

$2,500.00

**الحد الأقصى 2026**

**$2,103.77 ← المستحق**

القاعدة: المستحق فعليًا هو **الأقل** بين القيمة المحسوبة والحد الأقصى — هنا الحد الأقصى أصغر، فهو اللي بيتحصّل.

**بداية النشاط في نص السنة:** لو قرار المزاولة صدر مثلًا في 8 يناير، الشركة تدفع فقط عن الأيام المتبقية لحد آخر ديسمبر (عدد الأيام ÷ 365 × القيمة السنوية)، وبعدين من أول يناير التالي تدفع القيمة كاملة.

**زيادة رأس المال:** لو الشركة زوّدت رأس مالها المصدر بعد كده، تُعاد حسبة مقابل الخدمات، وتُطلب الزيادة فقط من تاريخ الزيادة، مش من أول السنة.

ملاحظة: الغالبية العظمى من الشركات (حوالي 98%) رأس مالها بالدولار، والباقي (حوالي 2%) باليورو، وعدد شركات اليورو دي محدود جدًا (رقم يحتاج تأكيد من مصدره الأصلي: هل هو إجمالي عدد الشركات، ولا عدد اللي بتنضم كل سنة؟).

**معلومة إضافية:** قانون الاستثمار يشترط ألا يقل رأس المال المصدر عن 250,000 جنيه مصري عند تأسيس الشركة، وهو نفس الرقم (رأس المال المصدر) اللي بيتبنى عليه حساب مقابل الخدمات كل سنة.

**خطاب الضمان (Letter of Guarantee) — مش نفس مقابل الضمان**

خطاب الضمان مختلف تمامًا عن \"مقابل الضمان\" اللي فوق (اللي هو 1‰ من قيمة وثيقة التأمين). خطاب الضمان مش رسم بيتحصّل وينتهي، وإنما ضمان مالي بتحتفظ بيه الهيئة طول عمر المشروع، عشان تضمن سداد أي التزامات مالية يتأخر المستثمر فيها — وبيتقدَّم إما كخطاب ضمان بنكي أو كإيداع نقدي في حساب الهيئة.

| **نوع المشروعقيمة الضمان** |                            |
| -------------------------- | -------------------------- |
| **صناعي**                  | 1% من التكاليف الاستثمارية |
| **تخزيني**                 | 2% من التكاليف الاستثمارية |

### لو المستثمر اتأخر في السداد

الهيئة بتخصم من خطاب الضمان (مقابل الانتفاع، مقابل الخدمات، أو أي رسوم مستحقة)، وفورًا بتطالب المستثمر يكمّل قيمة الضمان لحد ما ترجع لقيمتها الأصلية — النظام صارم في النقطة دي ومايسمحش إن الضمان يفضل ناقص.

### الاسترداد

بيترد للمستثمر في آخر خطوة من إجراءات التصفية، بعد شطب الشركة من السجل التجاري مباشرة — وده أحد أهم الأسباب اللي بتخلي حتى الشركات المتعثرة تكمّل إجراءات التصفية بدل ما تسيبها.

**مصادر إيرادات الهيئة**

غير الرسوم الأساسية اللي فوق، عند الهيئة مصادر إيرادات تانية أصغر بس منتشرة على كل تعاملات المشروع:

| **المصدرتفاصيله**           |                                                                                                                                              |
| --------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------- |
| **مقابل تنمية وتطوير**      | 0.5% من قيمة مقابل الانتفاع (الإيجار)، بيتحصّل كل 3 شهور معاه؛ رسم مستحدث بموافقة مجلس إدارة الهيئة، وحاليًا معطّل مؤقتًا مراعاة لظروف السوق |
| **رسوم صور طبق الأصل**      | 50 جنيه للورقة، بحد أقصى 300 جنيه، لأي مستند (قرار مزاولة، محضر تسليم أرض، إلخ)                                                              |
| **رسوم الأرشيف الإلكتروني** | لمجرد الاطلاع على مستند قديم في الأرشيف القانوني، لازم طلب ورسوم                                                                             |
| **رسوم دخول وخروج البضاعة** | مرتبطة بإقرارات الوارد والصادر، تُحصَّل في المتابعة المالية                                                                                  |
| **رسوم الإقرارات**          | لكل إقرار وارد أو صادر رسم مستقل                                                                                                             |

### ليه الهيئة بتحصّل الرسوم دي؟

مش بغرض الربح فقط، وإنما مقابل خدمات فعلية بتقدّمها للمستثمر:

- **✓**

  وجود الجمارك داخل المنطقة الحرة نفسها.
- **✓**

  تجميع الجهات الحكومية في مكان واحد.
- **✓**

  تسهيل الإجراءات وإصدار المستندات.
- **✓**

  إدارة عمليات الدخول والخروج.
- **✓**

  متابعة المشروع طوال فترة تشغيله.

**أهم الفروق اللي لازم متتلخبطش فيها**

- **1**

  **مقابل الضمان ≠ خطاب الضمان:** الأول رسم صغير (1‰ من قيمة وثيقة التأمين) بيتحصّل ويخلص، والتاني ضمان مالي كامل فاضل طول عمر المشروع ومش بيتحصّل كرسم.
- **2**

  **مقابل الانتفاع ≠ مقابل الخدمات السنوي:** الأول إيجار الأرض بسعر ثابت للمتر، والتاني نسبة من رأس المال المصدر بحد أقصى سنوي يتجدد كل سنة.
- **3**

  **الرسم الجاري بيختلف حسب نوع المشروع:** 1% صناعي (على أساس FOB وقت التصدير)، 2% تخزيني (على أساس CIF وقت الدخول)، 1% خدمي (على الإيراد السنوي كامل، مش بعد الخصومات).
- **4**

  **المستحق فعليًا هو الأقل بين القيمة المحسوبة والحد الأقصى** في حالة مقابل الخدمات السنوي، مش القيمة المحسوبة نفسها دايمًا.

## الإطار القانوني والتاريخي وأنواع المناطق الحرة

قبل ما تحفظ قانون 72 أو تعدّد أنواع المناطق، لازم تعرف **إزاي وصلت مصر أصلًا لشكل المنطقة الحرة الموجود النهارده**. هنبدأ بقصة الفكرة عالميًا، ثم نشوف دخول مصر للنظام، وبعدها نرجع للقانون الحالي والأنواع والإعفاءات.

المناطق الحرة في مصر تخضع لقانون الاستثمار رقم 72 لسنة 2017 ولائحته التنفيذية وتعديلاتهما، بالإضافة إلى لائحة نظام إدارة المناطق الحرة الصادرة بقرار وزيرة الاستثمار رقم 39 لسنة 2019. وتشرف على تطبيق كل ده الهيئة العامة للاستثمار والمناطق الحرة (GAFI).

### تاريخ المناطق الحرة: من Free Port إلى Free Zone

قبل ما نفهم قانون مصر الحالي، مهم نعرف إن فكرة \"المنطقة الحرة\" نفسها أقدم بكتير من القوانين المصرية الحديثة. الفكرة بدأت أصلًا في صورة **Free Ports**: موانئ أو مناطق تحصل على معاملة جمركية خاصة لتسهيل التجارة، والتخزين، وإعادة التصدير. من أشهر الأمثلة التاريخية **Livorno في إيطاليا**، التي تطور فيها نظام الميناء الحر منذ القرن السابع عشر.

### من الميناء الحر إلى المنطقة الحرة الحديثة

التحول الكبير حصل في القرن العشرين، لما تطورت الفكرة من مجرد تسهيل التجارة والتخزين إلى **منطقة صناعية موجهة للتصدير**.

**1959 · Shannon, Ireland**

إنشاء **Shannon Free Zone** في أيرلندا، وتوصف عادة بأنها أول منطقة حرة صناعية حديثة، وكانت الفكرة وقتها استخدام الحوافز الجمركية والاستثمارية لجذب شركات تقوم بالتصنيع والتصدير وخلق فرص عمل.

وبكده حصل التحول من:

**Free Port**
تجارة + تخزين + إعادة تصدير

←

**Modern Free Zone**
تصنيع + استثمار + تصدير + وظائف

### مصر دخلت القصة إمتى؟

مصر لم تخترع فكرة المناطق الحرة، لكنها دخلت مبكرًا نسبيًا في تبني **النموذج الحديث** للمناطق الحرة داخل إطار الاستثمار والتصدير. والمهم إن البداية المصرية لم تكن فجأة مع قانون 43 لسنة 1974 فقط؛ توجد إشارات إلى خطوات وتشريعات سابقة في أوائل السبعينيات، من بينها ترتيبات بدأت في **1971 و1972 و1973** لإنشاء وتشجيع المناطق الحرة.

ثم جاء **قانون رقم 43 لسنة 1974 بشأن استثمار المال العربي والأجنبي والمناطق الحرة** ليضع الإطار القانوني الحديث بصورة أكثر وضوحًا، في سياق سياسة **الانفتاح الاقتصادي** في عهد الرئيس السادات.

يعني الأدق إننا نقول:

> **قانون 43 لسنة 1974 رسّخ نظام المناطق الحرة الحديث في مصر، لكنه لم يكن أول ظهور للفكرة أو أول خطوة مصرية نحوها.**

وده فرق مهم، لأن الملف الحالي نفسه فيه أمثلة على مناطق أقدم زمنيًا من القانون، مثل منطقة القاهرة التي تأسست سنة 1973.

### طيب مين اخترع المناطق الحرة؟

مفيش دولة واحدة نقدر ننسب لها اختراع الفكرة كلها. **Free Port** أقدم بقرون من النظام الحديث، أما **Modern Free Zone** فهي نتيجة تطور تدريجي للفكرة، وكان نموذج Shannon من أهم نقاط التحول في القرن العشرين.

ومصر لم تخترع الفكرة، لكنها **كانت من المتبنين المبكرين للنموذج الحديث في المنطقة العربية**، وطورت بعد ذلك نظامها الخاص ضمن سياسات الاستثمار والتصدير.

### قبل قانون 72: كان الأساس القانوني إيه؟

القانون اللي كان شغال قبل 72 لسنة 2017 مباشرة هو **قانون رقم 8 لسنة 1997** (\"قانون ضمانات وحوافز الاستثمار\"). وده كان بدوره خلف قانون 43 لسنة 1974، الذي رسّخ الإطار الحديث للمناطق الحرة في مصر.

**ليه قانون 43/1974 بالذات مهم؟** لأنه جاء ضمن سياسة الانفتاح الاقتصادي في السبعينيات، وفتح الباب أمام رأس المال العربي والأجنبي، وربط نظام المناطق الحرة بأهداف جذب الاستثمار، والتصنيع، والتصدير.

### أهم الفروق بين 8/1997 و72/2017

- **الموافقة الواحدة:** قانون 72 قدّم مبدأ موافقة واحدة تجمع الترخيص وتخصيص الأرض وتصريح البناء لمشروعات معينة، بدل موافقات منفصلة.
- **الخريطة الاستثمارية:** أداة إلكترونية جديدة كليًا تعرض الفرص الاستثمارية المتاحة ببياناتها (نفس الخريطة اللي قطاع الترويج بيستخدمها).
- **حوافز نقدية إضافية:** قانون 72 (بعد تعديل 2023) أضاف حافز نقدي بنسبة 35% إلى 55% من الضريبة المسددة لأنشطة صناعية معينة في مناطق محددة جغرافيًا.
- **ضمانات أقوى ضد سحب التراخيص:** منع صريح لإلغاء أو وقف ترخيص المشروع إلا بعد إنذار المستثمر وسماع وجهة نظره وإدّاله مهلة لإزالة المخالفة.

### الشركات القديمة إيه اللي بيحصلها؟

الشركات اللي كانت قائمة وقت سريان قانون 72 (أُسست تحت قانون 8/1997) محتفظة بمزاياها وإعفاءاتها القديمة لحد ما تنتهي مدتها المقررة أصلًا — مش بتتحول تلقائيًا لأحكام القانون الجديد.

**يعني عمليًا:** ممكن تلاقي في المنطقة الحرة شركات قديمة لسه شغالة بشروط قانون 1997 جنب شركات جديدة خاضعة لقانون 2017، لحد ما تنتهي مدة مزايا الشركات القديمة.

قانون 72 نفسه اتعدّل أكتر من مرة بعد صدوره — أبرزها تعديل 2019 (تيسيرات إجرائية زي حد أقصى لرسوم توثيق العقود)، وتعديل 2023 اللي أضاف الخريطة الاستثمارية والحوافز النقدية، وسمح بالأنشطة كثيفة الطاقة بموافقة خاصة (تفصيلها في جدول الأنشطة بالأسفل).

**نوعان من المناطق الحرة**

### مناطق حرة عامة

تديرها الهيئة مباشرة وتضم أكثر من مشروع، ومزودة ببنية تحتية متكاملة: طرق، كهرباء، محطات صرف صحي، شبكات مياه وتليفونات، بالإضافة لوحدة جمركية متكاملة، ووحدة شرطة أمن موانئ، ووحدة أمن تعمل على مدار 24 ساعة.

يوجد حاليًا 9 مناطق حرة عامة موزعة على أنحاء الجمهورية.

### مناطق حرة خاصة

كيان مستقل يمثل مشروعًا واحدًا (أو أكثر من مشروع بأنشطة متشابهة)، يقع خارج حدود المناطق العامة على أرض المستثمر نفسه (مملوكة أو مستأجرة) — زي أرض على الطريق الصحراوي، أو ساحات ومخازن كانت أصلًا مستأجرة داخل الميناء (غالبية الشركات اللي حوّلت لمنطقة حرة خاصة كانت شركات ملاحة).

**نفس القانون، موافقات مختلفة:** نفس الإعفاءات الجمركية والضريبية للمنطقة العامة بالظبط، لكن الموافقة المبدئية من رئيس الوزراء والنهائية من مجلس الوزراء (مش مجلس إدارة الهيئة)، والمساحة والرسوم والشروط أكبر عمومًا.

### فرع منطقة حرة خاصة لشركة عامة

ممكن الشركة الأم تكون منطقة حرة عامة (هنا في الإسكندرية مثلًا)، وتفتح فرع منطقة حرة خاصة في أرض تانية — بس نشاط الفرع لازم يكون مشتق من نشاط الشركة الأم، ورأس مال الفرع بيتخصّص من رأس مال الشركة الأم نفسها.

### الأرض من غير تحويل مش معفاة

لو المستثمر أخد أرض برا واستخدمها كمكتب إداري عادي (مش منطقة حرة رسمية)، الأرض دي مالهاش أي إعفاءات جمركية أو ضريبية — لازم يبقى الموقع محول رسميًا لمنطقة حرة عشان الإعفاءات تسري عليه.

**المناطق الحرة العامة التسع**

مهم توضيحها من البداية: المناطق التسع دي كلها غير متخصصة رسميًا. كل منطقة بتضم خليط من المشروعات الصناعية والتخزينية والخدمية جنب بعضها، مش نشاط واحد بس. الاستثناء الوحيد هو مدينة الإنتاج الإعلامي. لكن كل منطقة من التسعة ليها قصة اختيار مختلفة تمامًا عن التانية.

### 1 · الإسكندرية (العامرية)

الأكبر والأعلى تصديرًا بين التسعة بفارق واضح — الأرقام الكاملة (فرص العمل، الاستثمارات، الصادرات) موجودة في مقدمة الملف. والاختيار مش صدفة: مراكز أبحاث اقتصادية مصرية بتوثّق إن فكرة \"المنطقة الحرة\" في مصر أصلًا ظهرت في الإسكندرية من قرون بعيدة، لما كانت المدينة مركز التجارة الواردة بين أوروبا وآسيا في العصور الوسطى — يعني المدينة بترجع لدورها التاريخي كبوابة تجارة، مش بتبدأ من الصفر. وموقعها بالتحديد في منطقة الكافوري بحي أول العامرية، عند تقاطع طريق القاهرة-الإسكندرية الصحراوي مع طريق الكافوري-برج العرب، وعلى بعد 20 كم بس من ميناء الإسكندرية ومطار النزهة الدولي — يعني قريبة من كل حاجة محتاجاها في نفس الوقت.

416 مشروع · 1353 فدان

### 2 · القاهرة (مدينة نصر)

من أقدم المناطق (تأسست 1973 — قبل ما يصدر [قانون الانفتاح الاقتصادي](https://heshvm101.github.io/GAFI/#legal-history) رقم 43 لسنة 1974 اللي بُني عليه نظام المناطق الحرة الحديث بسنة كاملة)، وموجودة جوه مدينة نصر نفسها اللي بناها عبد الناصر في أواخر الخمسينات كحلم توسع عمراني حديث في الصحراء (والاسم \"نصر\" تيمنًا بانتصار ثورة يوليو، مش نسبة لعبد الناصر شخصيًا زي ما ناس كتير فاكرة غلط). موقعها تحديدًا خلف جمعية الوفاء والأمل، على بعد 25 كم بس من مطار القاهرة الدولي، بيديها ميزة قربها من مراكز القرار والخدمات المالية والمصرفية. استثماراتها التراكمية تخطّت 7 مليار دولار، وبقت مؤخرًا جاذبة لشركات السوفت وير والذكاء الاصطناعي جنب الصناعات التقليدية، مش بس أرض صناعية كلاسيكية.

تأسست 1973 · $7B استثمارات تراكمية · 25 كم من مطار القاهرة

### 3 · بورسعيد

القصة هنا أعقد وأشيق من \"أقدم منطقة حرة\". وأصلًا الحكاية بتبدأ قبل كده بكتير: سنة 1902، الحكومة المصرية وقّعت اتفاق مع شركة قناة السويس وعملت منطقة حرة برية وبحرية ملحقة بالمدينة، غرضها الوحيد خدمة الشركة في توسيع وصيانة الميناء — يعني بورسعيد كانت \"منطقة حرة\" من أول القرن العشرين، من قبل ما يكون في مصر أصلًا هيئة استثمار أو قانون انفتاح. بعد كده بورسعيد شافت شكلين مختلفين من \"الحرية الجمركية\": الأول \"مدينة حرة\" كاملة (المدينة كلها معفاة، مش بس منطقة داخلها) بقرار من يناير 1976، وده خلق طفرة تسوق ضخمة (ناس من كل مصر بتيجي تشتري بضاعة مستوردة معفاة من الجمارك) استمرت لحد ما القانون رقم 5 لسنة 2002 ألغى وضع \"المدينة الحرة\" بالكامل بسبب أضرار اقتصادية واتهامات بتهريب البضائع. الشكل التاني هو \"المنطقة الحرة العامة\" الفعلية (800 ألف م² تقريبًا 190 فدان، بقرار من يوليو 1975 في منطقة الرسوة الصناعية) وهي اللي فضلت شغالة واتحولت بمرور الوقت من مدينة استيراد لمدينة تصنيع وتصدير — النهاردة بتوفر لوحدها حوالي 35-40% من صادرات مصر من الملابس الجاهزة.

أول منطقة حرة في مصر (1902) · المنطقة الحالية 1975 · \~83 مصنع · \~30 ألف عامل

### 4 · السويس (الأدبية / بورتوفيق / عتاقة)

3 مواقع بمحافظة السويس، وموقعها مش بس قريب من ميناء العين السخنة، هي تاريخيًا نقطة انطلاق قافلة الحج المصري للأراضي الحجازية لقرون طويلة، يعني المحافظة كلها اتعودت من الأساس إنها ممر عبور استراتيجي. وفيه ميزة أقل شهرة: جبل عتاقة القريب من المنطقة غني بخامات الرمال والسيليكا اللي بتدخل في صناعة الزجاج والإلكترونيات الدقيقة — يعني في بعض الحالات المصنع مش بس قريب من الميناء، هو قريب من خامته الأساسية كمان. وكل موقع من المواقع التلاتة له دور مختلف عمليًا: بورتوفيق قريب من قلب المدينة، الأدبية بميناء بحري بيستقبل ويفرّغ البضائع مباشرة، وعتاقة الأقرب لميناء العين السخنة نفسه.

3 مواقع · جنب ميناء العين السخنة · خامات سيليكا محلية

### 5 · الإسماعيلية

المدينة نفسها اتبنت سنة 1862 كمقر لشركة قناة السويس، وسُمّيت باسم الخديوي إسماعيل، ولسه لحد النهاردة المقر الرئيسي لهيئة قناة السويس نفسها موجود فيها — يعني المنطقة الحرة مش بس \"في المنتصف جغرافيًا\" بين بورسعيد والسويس، هي حرفيًا قريبة من مركز القرار الإداري لقناة السويس كلها. شهدت موجة استثمارات حديثة (2024-2025) من شركات صينية وتركية في المنسوجات والملابس الجاهزة وملابس الحماية الرياضية.

9 شركات جديدة (2025) · $41.6M استثمارات · 16 ألف فرصة عمل

### 6 · دمياط

الميناء نفسه من أقدم موانئ مصر — آثار فرعونية اتلاقت فيه منقولة دلوقتي لمتحف اللوفر في باريس، وكان الميناء الأهم في مصر قبل الإسكندرية لحد سقوط عكا في القرن الـ14 اللي غيّر مسارات التجارة العالمية لصالح الإسكندرية. الميناء الحديث اتفتح 1986، والمنطقة الحرة (1998) جنب صناعة الأثاث الحرفي اللي دمياط مشهورة بيها قوميًا وعالميًا (فيه مشروع قومي منفصل اسمه \"مدينة دمياط للأثاث\" في نفس المحافظة، مش بالضرورة نفس كيان المنطقة الحرة). استثماراتها موزعة على 5 جنسيات مختلفة (عربية، أوروبية، آسيوية، مصرية، أمريكية-أسترالية) بنسب متقاربة، صورة نادرة للتنوع الحقيقي في مصدر رأس المال.

تأسست 1998 · 190 فدان · بوابة مباشرة على الميناء

### 7 · شبين الكوم (المنوفية)

عكس الانطباع الأول تمامًا — دي مش منطقة مهمّشة، دي منطقة ناجحة لدرجة إنها امتلأت بالكامل. المنطقة مبنية جنب أرض شركة \"مصر شبين الكوم للغزل والنسيج\" التاريخية، وفي 2022 مجلس الوزراء وافق على ضم قطعة أرض إضافية (65,186 م² تقريبًا 15.5 فدان) من أراضي الشركة نفسها للتوسع، بعد ما وصلت المنطقة لإشغال كامل المساحات المتاحة. التوسعة دي لوحدها كانت لـ11 مشروع تصديري جديد باستثمارات 20 مليون دولار و1500 فرصة عمل.

إشغال كامل (2022) · +15.5 فدان توسعة · $20M لـ11 مشروع جديد

### 8 · مدينة الإنتاج الإعلامي (6 أكتوبر)

المنطقة الوحيدة من التسعة المتخصصة رسميًا، ودي أغرب حكاية في الملف كله. الفكرة طلعت من وزير الإعلام الأسبق صفوت الشريف بعد نجاح قطاع الإنتاج بماسبيرو، والشركة اتأسست 1997 على مساحة مليوني متر مربع (10 كم بس من الأهرامات)، ولقّبوها \"هوليوود الشرق\" باعتبارها أكبر كيان إعلامي وإنتاجي في الشرق الأوسط. الأغرب: المدينة فيها ديكورات دائمة لأحياء مصرية حقيقية معاد بناؤها بالكامل — شارع عماد الدين التاريخي (المكان اللي \"اتولدت\" فيه السينما والمسرح المصري في العشرينات) اتبنى من جديد في 59 يوم بس، وفيه كمان حي جاردن سيتي بقصوره وفيلاته، وشارع بطراز الإسكندرية القديمة بترام كهربائي شغال وواجهات أوروبية، وحي بمستوى الدقي الراقي. المدينة كمان فيها 3 بحيرات صناعية ومنطقة أمواج صناعية للمشاهد المائية، و6 مجمعات إنتاج ضخمة، وأول معمل دولبي للصوت المحيطي بجودة عالمية في الشرق الأوسط.

تأسست 1997 · 2 مليون م² · التخصص الرسمي الوحيد

### 9 · قنا (قفط)

المنطقة الوحيدة من التسعة في صعيد مصر، لكن الاختيار مش عشوائي خالص. قفط بالذات كانت من آلاف السنين مركز عبادة الإله \"مين\" — حامي طرق التجارة والمحاجر عند المصريين القدماء — وكانت بوابة القوافل التجارية المتجهة لموانئ البحر الأحمر وبعثات التعدين في الصحراء الشرقية. في العصر البيزنطي اتسمت \"جستنيانوبوليس\"، وفي العصور الإسلامية الوسطى فضلت من أهم مراكز التجارة مع الهند. يعني الهيئة لما اختارت قفط لتكون بوابة الصعيد الصناعية الحديثة، هي عمليًا بتكمل دور المدينة كمحطة تجارة شرقية عمرها آلاف السنين، مش بتخترع دور جديد ليها.

الوحيدة في الصعيد · مركز تجاري منذ العصر الفرعوني

**الإعفاءات الممنوحة للمشروع**

- **✓**

  إعفاء الأصول الرأسمالية ومستلزمات الإنتاج (عدا سيارات الركوب) من الجمارك وضريبة القيمة المضافة، طوال فترة مزاولة النشاط.
- **✓**

  إعفاء صادرات وواردات المشروع من وإلى خارج البلاد من أي رسوم جمركية أو ضريبية.
- **✓**

  عدم خضوع المشروع وأرباحه لقوانين الضرائب أو الجمارك المعمول بها داخل البلاد، طوال فترة مزاولة النشاط.
- **✓**

  إعفاء واردات المشروع من السوق المحلي من ضريبة القيمة المضافة.
- **✓**

  إعفاء بضائع الترانزيت المحددة الوجهة من أي رسوم، بشرط أن يكون المشروع داخل الدائرة الجمركية وأن تكون الوجهة النهائية محددة بـ[بوليصة الشحن](https://heshvm101.github.io/GAFI/#procedures-bill-of-lading) والفاتورة.
- **✓**

  إعفاء المكوّن المحلي من السلع المصنَّعة في المنطقة الحرة من الرسوم الجمركية عند بيعها للسوق المحلي.

**الضمانات القانونية للمشروع**

- **⚖**

  لا يجوز رفع دعوى قضائية ضد مشروعات المناطق الحرة إلا بعد الرجوع إلى الهيئة أولًا.
- **⚖**

  لا يجوز تأميم المشروعات والمنشآت أو مصادرتها.
- **⚖**

  لا يجوز بالطريق الإداري فرض الحراسة على المشروعات، أو الحجز على أموالها، أو الاستيلاء عليها، أو تجميدها، أو مصادرتها إلا بحكم قضائي.

**ميزة الجهة الإدارية الواحدة**

أهم ميزة عملية للمنطقة الحرة إن الشركة بتتعامل مع جهة واحدة بس، هي إدارة المنطقة الحرة، وهي اللي بتتولى: إصدار كل الموافقات اللازمة لإقامة المشروع، إصدار ترخيص مزاولة النشاط (اللي بيغني عن القيد في السجل الصناعي)، تسليم الأرض واعتماد تراخيص البناء فور تقديم الطلب، إتمام كل إجراءات دخول وخروج البضائع عبر إقرارات الوارد والصادر، وصولًا لإجراءات تصفية المشروع لو الشركة قررت إنهاء نشاطها.

**البيئة شرط أساسي، مش إجراء شكلي**

قرار المزاولة مايصدرش أبدًا من غير موافقة جهاز شؤون البيئة. المستثمر بيعمل دراسة بيئية (شبيهة بدراسة الجدوى بس مركّزة على البيئة) عن طريق مكتب معتمد، ويقدّمها لجهاز شؤون البيئة مع خريطة الأنشطة المحيطة بالموقع — والجهاز بيرفض أو يوافق حتى لو مصنع المستثمر نفسه مطابق لكل الاشتراطات، وده لأن الهيئة مش بتوزّع الأنشطة على مناطق منفصلة (مفيش \"شارع كيماويات\" و\"شارع أغذية\")، فاختيار الأرض بيحمل مخاطرة بيئية من الجيران مش بيد المستثمر.

**مثال واقعي:** مشروع بتمويل من بنك أوروبي بمهلة سداد محددة، اتعطّل بسبب رفض جهاز شؤون البيئة رغم إن المبنى كان بمواصفات أوروبية عالية، لأن الأرض المجاورة كانت لشركات بترول وكيماويات. المهلة انتهت قبل ما توافق البيئة، فاضطر المستثمر يصفّي المشروع رغم الاستثمارات الكبيرة اللي كان دخلها فيه.

## السياق الاقتصادي والاستراتيجي

بعد ما شوفنا المشروع من جوه، نطلع خطوة لورا ونسأل سؤال أكبر: **ليه الدولة أصلًا مصممة النظام ده؟ وإيه اللي بتاخده مصر مقابله؟** هنا بنربط الرسوم والمزايا بالمشهد الاقتصادي كله.

### ليه بعض الرسوم زادت بعد قانون 72؟

الفكرة مش إن الدولة عايزة تلغي ميزة المنطقة الحرة، لكن إنها تحاول توازن بين حاجتين:

- الحفاظ على قدرة النظام على جذب الاستثمار.
- حصول الدولة على عائد مناسب مقابل الخدمات والمزايا التي يقدمها النظام.

لذلك، أي تعديل في الرسوم لازم يتفهم داخل السؤال الأكبر: **قد إيه الدولة مستعدة تمنح حوافز عشان تجذب الاستثمار والتصدير، وقد إيه عائدها لازم يغطي تكلفة النظام؟**

### ليه الدولة لسه متمسكة بالمناطق الحرة؟

لو النظام فيه إعفاءات ومزايا، طبيعي تسأل: **مصر بتكسب إيه؟**

الإجابة مش رقم واحد، وإنما مجموعة من النتائج بتشتغل مع بعض:

- جذب استثمارات محلية وأجنبية.
- دعم الإنتاج والتصدير.
- توفير فرص عمل.
- إدخال عملة أجنبية من النشاط التصديري.
- توطين جزء من القيمة المضافة داخل مصر.

بحسب GAFI، المناطق الحرة تساهم بحوالي **22% من إجمالي الصادرات السلعية المصرية**، وده بيوضح إن النظام له وزن فعلي في منظومة التصدير، مش مجرد ميزة قانونية على الورق.

### مصادر العملة الأجنبية في مصر

قبل ما نقول إن المنطقة الحرة \"بتدخل دولار\"، لازم نشوف الدولار بيدخل مصر منين أصلًا.

في **FY 2024/2025**، أظهر توزيع متحصلات الحساب الجاري أن أكبر البنود كانت:

| **2** | **الصادرات غير البترولية** | **31.0%** | **$34.6B** |
| **3** | **السياحة (Travel)** | **15.0%** | **$16.7B** |

### طب وقناة السويس فين؟

هنا مثال مهم على طريقة قراءة الإحصاءات.

قناة السويس مش بند منفصل في الجدول السابق، لكنها داخلة تحت **Transportation**. وفي FY 2024/2025 بلغت متحصلات النقل نحو **$9.4B**، منها حوالي **$3.6B لقناة السويس**.

يعني الإحصاءات أحيانًا بتجمع نشاطًا كبيرًا داخل بند أوسع منه.

**وده بالضبط اللي بيحصل مع المناطق الحرة.**

### طيب المناطق الحرة مكانها فين؟

هنا المفاجأة:

**المناطق الحرة مش مصدر مستقل للعملة الأجنبية جنب الصادرات والسياحة والتحويلات.**

هي **آلية بتقوّي أكثر من قناة في نفس الوقت، وعلى رأسها الصادرات والاستثمار.**

القصة ببساطة:

**Free Zone**

↓

↓

↓

**Export Proceeds**

↓

**عملة أجنبية**

وفي مسار آخر:

**Free Zone**

↓

↓

**FDI**

عشان كده لما حد يعمل قائمة بـ\"مصادر الدولار في مصر\"، غالبًا هتلاقي **الصادرات**، ومش هتلاقي **المناطق الحرة** كبند مستقل. الإحصاءات القومية بتسجل نتيجة المعاملة، وليس المكان أو النظام الذي تمت من خلاله.

### المناطق الحرة والصادرات

دي أهم علاقة لازم تثبت:

> **Free Zones → Export Production → Foreign Currency**

بحسب GAFI، تساهم المناطق الحرة بحوالي **22% من إجمالي الصادرات السلعية المصرية**. وفي صفحة أخرى عن المناطق الحرة المستهدفة، تستخدم الهيئة مقياسًا مختلفًا وتذكر مساهمة تصل إلى **25% من الصادرات الصناعية غير البترولية**؛ والفرق هنا سببه اختلاف المقام، لذلك لازم ما نخلطش الرقمين مع بعض.

مصادر:
- [GAFI · World Free Zones Organization Congress](https://www.gafi.gov.eg/English/MediaCenter/News/Pages/The-11th-World-Free-Zones-Organization-Global-Annual-Congress.aspx)
- [GAFI · New Targeted Free Zones](https://www.gafi.gov.eg/English/StartaBusiness/InvestmentZones/Pages/NewTargetedFreeZones.aspx)

**مهم:** لا تتعامل مع 22% على أنها \"22% من كل العملة الأجنبية التي تدخل مصر\"؛ هي نسبة من الصادرات السلعية تحديدًا.

### ليه محدش بيتكلم عن المناطق الحرة لما يقول \"مصادر الدولار\"؟

لأن السؤالين مختلفين:

**مين بيدخل العملة الأجنبية؟**

إجابته: الصادرات، السياحة، التحويلات، النقل، وغيرها.

**إيه النظام أو المكان اللي ساعد النشاط ده يحصل؟**

هنا ممكن تكون الإجابة: المنطقة الحرة.

يعني المنطقة الحرة **مش بند جديد في الجدول، لكنها جزء من بعض البنود الموجودة أصلًا.**

المصنع هنا لم \"يخلق مصدرًا تاسعًا\" للعملة الأجنبية. هو **ساهم في بند الصادرات**، وفي نفس الوقت خلق قيمة مضافة وفرص عمل وجذب استثمار.

المنطقة الحرة العامة بالإسكندرية في العامرية تضم **416 مشروعًا** باستثمارات تتجاوز **$14.7B**، وتوفر نحو **55 ألف فرصة عمل**، وسجلت مشروعاتها صادرات سلعية بقيمة **$5.3B في 2025**.

**حالة 1 · مشروع تقريبًا جاهز... لكن الأرض نفسها أسقطته**

تخيل مستثمر خلّص التمويل، بدأ التنفيذ، وبنى مبنى مطابقًا لمواصفات عالية. ظاهريًا كل شيء ماشي. لكن فيه اختبار واحد لم ينتهِ بعد: البيئة.

تصفية إجبارية

السبب الحقيقي للرفض: الأرض المجاورة كانت لشركات بترول وكيماويات، ومصنع المستثمر نفسه ملوش دخل بده — لأن الهيئة مش بتوزّع الأنشطة على مناطق منفصلة (مفيش \"شارع كيماويات\" و\"شارع أغذية\")، فاختيار قطعة الأرض بيحمل مخاطرة بيئية من الجيران، مش من نشاط المستثمر نفسه. راجع [\"البيئة شرط أساسي\"](https://heshvm101.github.io/GAFI/#legal-environment) للتفاصيل.

**الدرس المستفاد:** أكبر غلطة هنا إن المستثمر شاف الأرض كمجرد قطعة أرض، بينما الهيئة والبيئة بيشوفوها **جزءًا من بيئة صناعية كاملة**. لذلك الموافقة البيئية مش خطوة شكلية تتعمل في آخر الطريق، بل مخاطرة لازم تتحسب قبل ما المستثمر يربط نفسه بتمويل أو التزام زمني.

**حالة 2 · نفس قيمة البضاعة... لكن فاتورة الهيئة مختلفة**

اتخيل شركتين دخل عند كل واحدة منهما بضاعة بنفس القيمة تقريبًا. من الخارج، العملية شكلها متشابه. لكن واحدة صنعت، والثانية خزنت فقط. هنا نوع النشاط يغيّر أساس حساب الرسم الجاري بالكامل (راجع [FOB وCIF](https://heshvm101.github.io/GAFI/#procedures-incoterms) و[الرسم الجاري](https://heshvm101.github.io/GAFI/#procedures-fees)).

| **العنصرشركة أ (صناعي)شركة ب (تخزيني)** |                                                |                                                          |
| --------------------------------------- | ---------------------------------------------- | -------------------------------------------------------- |
| **النشاط**                              | استوردت خامات قماش، صنّعت ملابس جاهزة، صدّرتها | استوردت بضاعة جاهزة، خزّنتها، أعادت تصديرها من غير تغيير |
| **أساس حساب الرسم**                     | FOB · قيمة الصادرات وقت التصدير                | CIF · قيمة البضاعة الواردة وقت الدخول                    |
| **نسبة الرسم الجاري**                   | 1%                                             | 2%                                                       |
| **وقت التحصيل**                         | وقت التصدير (بعد إضافة القيمة بالتصنيع)        | وقت دخول البضاعة (قبل أي حركة تانية)                     |

**الدرس المستفاد:** النسبة الأعلى في المشروع التخزيني مش معناها إن الهيئة \"بتعاقب\" التخزين. الفكرة إن نوع النشاط نفسه مختلف، وبالتالي **أساس الحساب وتوقيت التحصيل** مختلفان.

**حالة 3 · المصنع قفل... لكن الملف لسه مفتوح**

شركة قررت إنهاء نشاطها اختياريًا بعد ما استقر السوق على عدم جدوى الاستمرار. هنا المستثمر ممكن يتخيل إن آخر خطوة هي قفل المصنع، لكن قانونيًا القصة لسه ما خلصتش. الخطوات دي ملخصة من فصل [تصفية المشروع](https://heshvm101.github.io/GAFI/#research-liquidation) بالكامل.

## المرجع السريع

لو وصلت هنا ووقفت قدام كلمة زي FOB أو مقابل الضمان أو قرار المزاولة، ما ترجعش تدور في الفصول. **المرجع السريع معمول بالضبط عشان يرجّعك للمعلومة في ثواني.**

**مسرد المصطلحات**

| **المصطلحمعناه**                                          |                                                                                                                                                                                                                       |
| --------------------------------------------------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
| **Application / طلب إقامة المشروع**                       | أول نموذج بيقدّمه المستثمر لبدء أي إجراء — قبله المشروع مجرد طلب، مش كيان معتمد                                                                                                                                       |
| **الموافقة المبدئية (Preliminary Approval)**              | موافقة أولية بعد مراجعة اللجنة الفنية، قبل استكمال الشروط                                                                                                                                                             |
| **الموافقة النهائية = قرار المزاولة (Operating License)** | نفس المستند بالظبط — القرار الرسمي اللي بيسمح للمشروع يبدأ نشاطه، صلاحيته 6 شهور                                                                                                                                      |
| **عقد التأسيس (Articles of Association)**                 | العقد اللي بيحدد هيكل الشركة: الشركاء، رأس المال، الإدارة، مكان انعقاد الجمعية                                                                                                                                        |
| **شهادة التأسيس (Certificate of Incorporation)**          | شهادة رسمية بتصدر مع عقد التأسيس تثبت قيام الشركة                                                                                                                                                                     |
| **السجل التجاري (Commercial Register)**                   | التسجيل الرسمي للشركة؛ بيتحدّث كل ما يتغير قرار المزاولة أو عقد التأسيس                                                                                                                                               |
| **اللجنة الفنية (Technical Committee)**                   | اللجنة في القاهرة اللي بتراجع الطلبات وتوصي بالموافقة أو الرفض                                                                                                                                                        |
| **المصفي القانوني (Legal Liquidator)**                    | الشخص اللي بيتولى كل إجراءات تصفية الشركة بدل الشركاء بعد تعيينه                                                                                                                                                      |
| **خطاب الضمان (Letter of Guarantee)**                     | ضمان مالي (1% صناعي / 2% تخزيني من التكاليف الاستثمارية) يفضل طول عمر المشروع، مش رسم بيتحصّل ويخلص                                                                                                                   |
| **مقابل الضمان (Guarantee Fee)**                          | رسم صغير (1‰ من قيمة وثيقة التأمين) — مختلف تمامًا عن خطاب الضمان                                                                                                                                                     |
| **مجمع خدمات الاستثمار (Investment Services Complex)**    | الجهة اللي بتتم فيها إجراءات تأسيس الشركة رسميًا (سجل تجاري، بطاقة ضريبية، عقد الشركة) بعد الموافقة المبدئية                                                                                                          |
| **FOB (Free On Board)**                                   | البائع مسؤول لحد تحميل البضاعة على السفينة بس؛ المشتري يدفع الشحن والتأمين — التفاصيل في فصل التنفيذ                                                                                                                  |
| **CIF (Cost, Insurance & Freight)**                       | البائع مسؤول عن البضاعة + الشحن + التأمين لحد ميناء الوصول — التفاصيل في فصل التنفيذ                                                                                                                                  |
| **إقرار وارد (Import Declaration)**                       | إعلان رسمي من الشركة بالأصناف والكميات اللي عايزة تستوردها، أول مستند في أي عملية استيراد                                                                                                                             |
| **الهالك (Wastage / Scrap Rate)**                         | نسبة الفقد الطبيعي أثناء التصنيع (خامة بتتحول لمخلفات مش منتج نهائي)؛ الجهات الرقابية المختصة بتحدد \"معامل هالك\" ثابت لكل نشاط، وعليه بيتحسب الجمرك المستحق أو المسترد. تجاوز النسبة المحددة بيستدعي مراجعة من الهيئة |
| **مقابل الانتفاع (Usufruct Fee)**                         | إيجار الأرض أو المبنى، سعر ثابت لكل متر مربع بيتحصّل سنويًا طوال فترة الانتفاع — أول رسم بيبدأ بعد الموافقة المبدئية مباشرة                                                                                           |
| **مقابل الخدمات السنوي (Annual Service Fee)**             | نسبة من رأس المال المصدر للشركة (مش من رأس المال المصرح به)، بحد أقصى سنوي يتجدد كل سنة حسب سعر الصرف. المستحق فعليًا هو الأقل بين القيمة المحسوبة والحد الأقصى                                                       |
| **الرسم الجاري (Running Fee)**                            | نسبة بتتحصّل حسب نوع المشروع: 1% صناعي (على أساس FOB وقت التصدير)، 2% تخزيني (على أساس CIF وقت الدخول)، 1% خدمي (على الإيراد السنوي كامل)                                                                             |
| **بوليصة الشحن (Bill of Lading)**                         | وثيقة من شركة الشحن، أول مستند في مسار الاستيراد؛ بتلعب 3 أدوار: إيصال استلام البضاعة، عقد نقل، ووثيقة ملكية قابلة للتداول                                                                                            |
| **براءة الذمة (Clearance Certificate)**                   | إثبات رسمي من جهة معينة (الهيئة، الجمارك، الضرائب، الكهرباء، المياه) إن مفيش أي التزامات مالية مستحقة على الشركة تجاهها — مطلوبة قبل تصفية أي مشروع                                                                   |
| **شهادة عدم الالتباس (Name Reservation Certificate)**     | بتحجز اسم الشركة لمدة 15 يوم قبل التأسيس؛ لو المدة خلصت من غير استكمال الإجراءات، لازم تُستخرج شهادة جديدة                                                                                                            |
| **الوكيل الحصري (Exclusive Agent)**                       | شركة داخل المنطقة الحرة بتوزّع منتج معين حصريًا في سوق أو أكتر (مصر، شمال أفريقيا، أوروبا، غرب آسيا) من غير ما تكون هي المصنّعة الأصلية له                                                                            |
| **المعاينة الثلاثية (Tripartite Inspection)**             | لجنة من 3 أطراف (موظف تنفيذ، موظف جمارك، مندوب الشركة) بتتأكد قبل دخول أو خروج أي بضاعة إنها مطابقة تمامًا للمستندات المقدَّمة                                                                                        |
| **الرصيد لدى الهيئة (Deposit Balance)**                   | مبلغ مقدّم بيحطه المستثمر عند الهيئة، وبيتخصم منه أول بأول أي رسم متكرر (زي مقابل الضمان أو رسوم الإقرارات) بدل ما يدفع كل مرة لوحده                                                                                  |
| **الانفتاح الاقتصادي (Open Door Policy)**                 | سياسة أطلقها السادات بقانون 43 لسنة 1974، فتحت الاقتصاد المصري قدام رأس المال العربي والأجنبي بعد سنين من التأميم والاقتصاد المغلق. عليها بُني نظام المناطق الحرة الحديث من الأساس                                    |
| **المدينة الحرة (Free City — تختلف عن المنطقة الحرة)**    | وضع استثنائي كان لبورسعيد بس (1976-2002)، المدينة كلها معفاة من الجمارك مش منطقة داخلها بس. اتلغى بقانون 5 لسنة 2002. مختلف تمامًا عن \"المنطقة الحرة\" اللي الملف ده بيتكلم عنها                                       |

**الجدول الشامل للرسوم**

| **الرسمالنسبة / القيمةأساس الحسابوقت الاستحقاق** |                                                              |                                                        |                                         |
| ------------------------------------------------ | ------------------------------------------------------------ | ------------------------------------------------------ | --------------------------------------- |
| **مقابل الانتفاع**                               | سعر ثابت / متر مربع سنويًا                                   | مساحة الأرض أو المبنى المخصصة للمشروع                  | سنويًا، طوال فترة الانتفاع              |
| **مقابل الخدمات السنوي**                         | 0.5‰ صناعي · 1‰ تخزيني / خدمي<br>حد أقصى $2,103.77 لعام 2026 | رأس المال المصدر                                       | سنويًا، من تاريخ قرار المزاولة          |
| **مقابل الضمان**                                 | 1‰                                                           | قيمة وثيقة التأمين (الجمارك المستحقة، لا قيمة البضاعة) | عند إصدار وثيقة التأمين                 |

function loadContent() {
  try {
    const html = marked.parse(EMBEDDED_CONTENT);
    content.innerHTML = DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });
    const headings = enhanceHeadings();
    buildToc(headings);
    decorateContent();
    updateProgress();
    updateActiveToc();
  } catch (error) {
    console.error(error);
    content.innerHTML = `
      <div class="callout">
        <h2>حصل خطأ في عرض الملف</h2>
        <p>المحتوى موجود داخل ملف HTML نفسه، لكن حصل خطأ أثناء تفسيره.</p>
      </div>`;
  }
}

searchInput.addEventListener("input", (e) => search(e.target.value));
searchInput.addEventListener("focus", (e) => { if (e.target.value.trim()) search(e.target.value); });
document.getElementById("closeSearch").addEventListener("click", () => searchPanel.classList.remove("open"));
searchPanel.addEventListener("click", (e) => { if (e.target === searchPanel) searchPanel.classList.remove("open"); });

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault(); searchInput.focus();
  }
  if (e.key === "Escape") searchPanel.classList.remove("open");
});

document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  localStorage.setItem("gafi-theme", dark ? "light" : "dark");
});

document.getElementById("menuBtn").addEventListener("click", () => sidebar.classList.toggle("open"));
document.getElementById("backTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

window.addEventListener("scroll", () => {
  updateProgress();
  updateActiveToc();
}, { passive: true });

const storedTheme = localStorage.getItem("gafi-theme");
if (storedTheme) document.documentElement.setAttribute("data-theme", storedTheme);

loadContent();
